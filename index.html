<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时历</title>
  <style>
    :root {
      --paper-bg: #eef3f1;
      --card-bg: #fcfbf7;
      --card-inner: #f2f6f5;
      --ink-main: #24343d;
      --ink-sub: #536973;
      --ink-light: #8799a2;
      --ocean-teal: #266f88;
      --sky-cyan: #3d98b5;
      --sky-soft: #e6f3f7;
      --jade-green: #2b8e5e;
      --jade-soft: #e6f4ec;
      --warm-amber: #d67624;
      --amber-soft: #fdf2e4;
      --sun-gold: #d9a441;
      --gold-dark: #b97524;
      --gold-border: #d2cbb7;
      --dark-border: #8fa3ad;
      --shadow: 0 10px 30px rgba(38, 111, 136, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Palatino Linotype", "Book Antiqua", Baskerville, Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
      background-color: var(--paper-bg);
      background-image:
        radial-gradient(rgba(61, 152, 181, 0.05) 1px, transparent 0),
        radial-gradient(circle at 12% 0%, rgba(98, 190, 212, 0.14), transparent 45%),
        radial-gradient(circle at 88% 100%, rgba(240, 178, 92, 0.12), transparent 45%);
      background-size: 28px 28px, 100% 100%, 100% 100%;
      color: var(--ink-main);
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px 16px 44px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    .scroll-frame {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--ocean-teal);
      padding: 7px;
      box-shadow: var(--shadow);
      border-radius: 3px;
    }

    .scroll-inner {
      position: relative;
      border: 1px solid var(--sun-gold);
      padding: 20px 26px;
      background: var(--card-bg);
    }

    .corner-ornament {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--ocean-teal);
      border-style: solid;
      pointer-events: none;
    }
    .corner-tl { top: 4px; left: 4px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 4px; right: 4px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 4px; left: 4px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; }

    .header {
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 3px double var(--gold-border);
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-title h1 {
      font-size: 24px;
      color: var(--ocean-teal);
      letter-spacing: 3px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 0;
    }

    .live-clock {
      font-size: 14px;
      color: var(--ink-sub);
      letter-spacing: 0.8px;
      padding: 5px 12px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      border-radius: 3px;
      white-space: nowrap;
    }

    .live-clock strong {
      color: var(--ocean-teal);
      font-size: 15px;
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
    }

    .city-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: var(--card-inner);
      padding: 10px 14px;
      border: 1px solid var(--gold-border);
      border-radius: 3px;
    }

    .city-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .city-tabs-label {
      font-size: 13px;
      color: var(--ink-sub);
      margin-right: 4px;
      letter-spacing: 0.5px;
    }

    .city-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      font-size: 14px;
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .city-tab:hover {
      border-color: var(--sky-cyan);
      color: var(--ocean-teal);
      background: var(--sky-soft);
    }

    .city-tab.active {
      background: var(--ocean-teal);
      color: #fcfbf7;
      border-color: var(--ocean-teal);
      box-shadow: inset 0 0 0 1px rgba(243, 198, 99, 0.55);
    }

    .city-tab .remove-city {
      font-size: 14px;
      opacity: 0.65;
      line-height: 1;
      padding: 0 2px;
    }

    .city-tab .remove-city:hover {
      opacity: 1;
    }

    .city-search-wrap {
      position: relative;
      display: flex;
      gap: 6px;
      width: 290px;
      max-width: 100%;
    }

    .city-search-wrap input {
      flex: 1;
      padding: 5px 10px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--dark-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 3px;
      outline: none;
    }

    .city-search-wrap input:focus {
      border-color: var(--sky-cyan);
    }

    .btn-classic {
      padding: 5px 14px;
      font-size: 14px;
      font-family: inherit;
      background: var(--ocean-teal);
      color: #fcfbf7;
      border: 1px solid var(--ocean-teal);
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-classic:hover {
      background: var(--warm-amber);
      border-color: var(--warm-amber);
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--ocean-teal);
      box-shadow: var(--shadow);
      z-index: 100;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      border-radius: 3px;
    }

    .search-dropdown.show {
      display: block;
    }

    .search-item {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--gold-border);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background: var(--sky-soft);
      color: var(--ocean-teal);
    }

    .search-item small {
      color: var(--ink-light);
      font-size: 12px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      padding: 14px 18px;
      border-radius: 3px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(38, 111, 136, 0.03);
    }

    .panel:last-child {
      margin-bottom: 0;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: var(--ocean-teal);
      padding-bottom: 8px;
      margin-bottom: 12px;
      border-bottom: 2px double var(--gold-border);
      letter-spacing: 2px;
    }

    .panel-title-deco::before {
      content: "✦ ";
      color: var(--warm-amber);
      font-size: 13px;
      margin-right: 4px;
    }

    .progress-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 13px;
    }

    .progress-title {
      font-weight: bold;
      color: var(--ocean-teal);
      letter-spacing: 0.8px;
    }

    .progress-meta {
      color: var(--ink-sub);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* 进度条上方：圆形周日标识 */
    .month-sunday-row {
      display: grid;
      gap: 2px;
      width: 100%;
      padding: 0 3px;
      margin-top: 2px;
      margin-bottom: 1px;
      justify-items: center;
      align-items: center;
    }

    .month-sunday-cap {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: transparent;
    }

    .month-sunday-cap.is-sunday {
      background: radial-gradient(circle at 35% 35%, #f9c663, #e68228);
      box-shadow: 0 1px 2px rgba(230, 130, 40, 0.32);
    }

    .month-sunday-cap.is-sunday.is-future {
      background: radial-gradient(circle at 35% 35%, #fbe0a3, #f0ac6b);
      opacity: 0.85;
    }

    /* 月份每日格子进度条：无色底 + 淡浅蓝色已过 + 翠绿色今日 */
    .month-days-track {
      display: grid;
      gap: 2px;
      width: 100%;
      height: 15px;
      background: transparent;
      border: 1px solid var(--gold-border);
      border-radius: 3px;
      padding: 2px;
    }

    .month-day-cell {
      height: 100%;
      background: transparent;
      border: 1px solid rgba(155, 168, 174, 0.32);
      border-radius: 1.5px;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }

    .month-day-cell.is-filled {
      background: linear-gradient(180deg, #cbe8f4, #9fd3e8);
      border-color: rgba(114, 178, 204, 0.55);
    }

    .month-day-cell.is-current,
    .month-day-cell.is-filled.is-current {
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, #43c47e, #239055);
      border-color: #1d7a47;
      transform: scaleY(1.18);
      box-shadow: 0 0 0 1px #fcfbf7, 0 1px 4px rgba(35, 144, 85, 0.32);
    }

    .month-day-nums,
    .month-weekdays {
      display: grid;
      gap: 2px;
      width: 100%;
      padding: 0 3px;
    }

    .month-day-nums span,
    .month-weekdays span {
      position: relative;
      text-align: center;
      font-size: 10px;
      line-height: 1.25;
      color: var(--ink-sub);
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .month-day-nums span.is-future,
    .month-weekdays span.is-future {
      color: var(--ink-light);
    }

    /* 周日保持暖琥珀橘加粗；非周日的当前日用翠绿色加粗标注 */
    .month-day-nums span.is-sunday,
    .month-weekdays span.is-sunday {
      color: #d66f19;
      font-weight: 700;
    }

    .month-day-nums span.is-sunday.is-future,
    .month-weekdays span.is-sunday.is-future {
      color: #e29148;
    }

    .month-day-nums span.is-current:not(.is-sunday),
    .month-weekdays span.is-current:not(.is-sunday) {
      color: var(--jade-green);
      font-weight: 700;
    }

    /* 在“日”与上方序号右侧加竖向虚线 */
    .month-day-nums span.is-week-end::after,
    .month-weekdays span.is-week-end::after {
      content: "";
      position: absolute;
      right: -1.5px;
      top: 0;
      bottom: -3px;
      border-right: 1px dashed rgba(214, 111, 25, 0.45);
      pointer-events: none;
    }

    .month-weekdays span.is-week-end::after {
      top: -2px;
      bottom: 0;
    }

    /* 年份 12 格进度条：退后为低饱和浅亚麻沙色，不再抢占月份进度条视觉焦点 */
    #yearProgressPanel .progress-title {
      color: var(--ink-sub);
    }

    .year-grid-track {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      width: 100%;
      height: 18px;
      background: transparent;
      border: 1px solid rgba(210, 203, 183, 0.85);
      border-radius: 3px;
      padding: 2px;
    }

    .year-grid-cell {
      height: 100%;
      background: rgba(180, 175, 160, 0.12);
      border-radius: 1.5px;
      overflow: hidden;
    }

    .year-grid-fill {
      height: 100%;
      background: linear-gradient(90deg, #e5decb, #cfc3a6);
      transition: width 0.35s ease;
    }

    .year-grid-labels {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      padding: 0 2px;
    }

    .year-grid-labels span {
      text-align: center;
      font-size: 11px;
      color: var(--ink-light);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .year-grid-labels span.is-passed {
      color: var(--ink-sub);
    }

    .year-grid-labels span.is-current {
      color: #7c6d4f;
      font-weight: bold;
    }

    .year-season-labels {
      display: grid;
      grid-template-columns: 2fr 3fr 3fr 3fr 1fr;
      gap: 3px;
      padding: 0 2px;
    }

    .year-season-labels span {
      text-align: center;
      font-size: 11px;
      color: var(--ink-light);
      line-height: 1.25;
      border-top: 1px solid rgba(210, 203, 183, 0.75);
      padding-top: 2px;
      white-space: nowrap;
    }

    .year-season-labels span + span {
      border-left: 1px dashed rgba(210, 203, 183, 0.85);
    }

    .year-season-labels span.is-current {
      font-weight: bold;
    }

    .year-season-labels span.season-spring.is-current {
      color: #55886c;
      border-top-color: #74a489;
    }

    .year-season-labels span.season-summer.is-current {
      color: #9c724b;
      border-top-color: #b88f68;
    }

    .year-season-labels span.season-autumn.is-current {
      color: #85734d;
      border-top-color: #aa966d;
    }

    .year-season-labels span.season-winter.is-current {
      color: #5c8190;
      border-top-color: #7c9fad;
    }

    .cal-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cal-btn {
      padding: 2px 9px;
      font-size: 12px;
      font-family: inherit;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      color: var(--ink-main);
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.15s;
    }

    .cal-btn:hover {
      border-color: var(--sky-cyan);
      color: var(--ocean-teal);
      background: var(--sky-soft);
    }

    .cal-weekdays, .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .cal-weekdays div {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: var(--ink-sub);
      padding: 3px 0;
      border-bottom: 1px solid var(--gold-border);
      margin-bottom: 2px;
    }

    .cal-weekdays div.weekend {
      color: var(--warm-amber);
    }

    .cal-cell {
      min-height: 44px;
      padding: 3px 2px;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.15s;
    }

    .cal-cell:hover {
      background: var(--sky-soft);
      border-color: rgba(61, 152, 181, 0.35);
    }

    .cal-cell.other-month {
      opacity: 0.35;
    }

    .cal-cell.selected {
      border: 1.5px solid var(--jade-green);
      background: var(--jade-soft);
      box-shadow: inset 0 0 0 1px rgba(43, 142, 94, 0.18);
    }

    .cal-cell.today {
      background: var(--ocean-teal);
      color: #fcfbf7;
      border-color: var(--sun-gold);
      box-shadow: inset 0 0 0 1px rgba(252, 251, 247, 0.25);
    }

    .cal-cell.today .cal-lunar {
      color: rgba(252, 251, 247, 0.9);
    }

    .cal-solar {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.15;
      font-variant-numeric: lining-nums;
    }

    .cal-cell.is-weekend:not(.today) .cal-solar {
      color: var(--warm-amber);
    }

    .cal-lunar {
      font-size: 10px;
      color: var(--ink-sub);
      margin-top: 1px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .cal-cell:not(.today) .cal-lunar.is-highlight {
      color: var(--ocean-teal);
      font-weight: bold;
    }

    /* 蓝色实况框（内含当前温度 + 昨今明后四日） */
    .weather-now {
      padding: 10px 12px;
      background: linear-gradient(135deg, var(--sky-soft), var(--card-inner));
      border: 1px solid rgba(61, 152, 181, 0.3);
      border-radius: 3px;
      margin-bottom: 8px;
    }

    .weather-now-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .weather-city-name {
      font-size: 18px;
      font-weight: bold;
      color: var(--ocean-teal);
      line-height: 1.25;
    }

    .weather-city-sub {
      font-size: 11px;
      color: var(--ink-sub);
      margin-top: 1px;
    }

    .weather-temp-wrap {
      text-align: right;
    }

    .weather-temp-main {
      font-size: 32px;
      font-weight: bold;
      color: var(--ocean-teal);
      line-height: 1.05;
      font-variant-numeric: lining-nums;
    }

    .weather-desc {
      font-size: 13px;
      color: var(--ink-main);
      margin-top: 1px;
    }

    /* 蓝框内部四日对比：昨日（淡）、今日、明日（淡）、后日（淡） */
    .weather-four-days {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(61, 152, 181, 0.25);
    }

    .day-mini-card {
      border-radius: 3px;
      padding: 4px 3px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      min-width: 0;
    }

    .day-mini-card.is-muted {
      opacity: 0.52;
      background: rgba(252, 251, 247, 0.42);
      border: 1px solid rgba(61, 152, 181, 0.14);
    }

    .day-mini-card.is-today {
      background: rgba(252, 251, 247, 0.88);
      border: 1px solid rgba(38, 111, 136, 0.35);
      box-shadow: 0 1px 3px rgba(38, 111, 136, 0.06);
    }

    .day-mini-label {
      font-size: 11px;
      color: var(--ink-sub);
      line-height: 1.2;
    }

    .day-mini-card.is-today .day-mini-label {
      color: var(--ocean-teal);
      font-weight: bold;
    }

    .day-mini-cond {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      max-width: 100%;
      font-size: 11px;
      line-height: 1.25;
      color: var(--ink-main);
    }

    .day-mini-card.is-muted .day-mini-cond {
      color: var(--ink-sub);
    }

    .day-mini-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-mini-temp {
      font-size: 11.5px;
      font-weight: bold;
      line-height: 1.2;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .day-mini-card.is-muted .day-mini-temp {
      color: var(--ink-sub);
      font-weight: normal;
    }

    .weather-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1.35fr;
      gap: 8px;
    }

    .metric-item {
      background: var(--card-bg);
      border: 1px solid var(--gold-border);
      padding: 6px 5px;
      text-align: center;
      border-radius: 3px;
      min-width: 0;
    }

    .metric-label {
      font-size: 11px;
      color: var(--ink-light);
      white-space: nowrap;
    }

    .metric-val {
      font-size: 13px;
      font-weight: bold;
      color: var(--ink-main);
      margin-top: 1px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .metric-val.metric-sun {
      font-size: 12px;
    }

    .forecast-list {
      display: flex;
      flex-direction: column;
    }

    .forecast-row {
      display: grid;
      grid-template-columns: 92px 1fr 56px 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 6px;
      border-bottom: 1px solid rgba(210, 203, 183, 0.65);
      font-size: 14px;
    }

    .forecast-row:last-child {
      border-bottom: none;
    }

    .forecast-date {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .forecast-date strong {
      font-size: 14px;
      color: var(--ink-main);
    }

    .forecast-date span {
      font-size: 11px;
      color: var(--ink-light);
    }

    .forecast-cond {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .forecast-rain {
      font-size: 12px;
      color: var(--jade-green);
      text-align: center;

</head>
<body>
  <div class="container">
    <div class="scroll-frame">
      <div class="scroll-inner">
        <div class="corner-ornament corner-tl"></div>
        <div class="corner-ornament corner-tr"></div>
        <div class="corner-ornament corner-bl"></div>
        <div class="corner-ornament corner-br"></div>

        <header class="header">
          <div class="brand">
            <div class="brand-title">
              <h1>时历</h1>
            </div>
          </div>
          <div class="header-right">
            <div class="live-clock" id="liveClock">加载时间中...</div>
          </div>
        </header>

        <section class="city-bar">
          <div class="city-tabs" id="cityTabs">
            <span class="city-tabs-label">观象城市：</span>
          </div>
          <div class="city-search-wrap">
            <input type="text" id="cityInput" placeholder="输入城市名添加（如：苏州、成都）" autocomplete="off" />
            <button class="btn-classic" id="searchBtn">寻城</button>
            <div class="search-dropdown" id="searchDropdown"></div>
          </div>
        </section>

        <main class="main-grid">
          <div>
            <section class="panel" id="yearProgressPanel">
              <div class="status-msg">正在推演年份进度...</div>
            </section>

            <section class="panel" id="monthProgressPanel">
              <div class="status-msg">正在推演月份进度...</div>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span class="panel-title-deco" id="calMonthTitle">月历</span>
                <div class="cal-controls">
                  <button class="cal-btn" id="backTodayBtn" style="display: none;">今日</button>
                  <button class="cal-btn" id="prevMonthBtn">上月</button>
                  <button class="cal-btn" id="currMonthBtn">本月</button>
                  <button class="cal-btn" id="nextMonthBtn">下月</button>
                </div>
              </div>
              <div class="cal-weekdays">
                <div class="weekend">日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div class="weekend">六</div>
              </div>
              <div class="cal-days" id="calDays"></div>
            </section>
          </div>

          <div>
            <section class="panel">
              <div class="panel-title">
                <span class="panel-title-deco">气象 · 今日实况</span>
                <button class="cal-btn" id="refreshWeatherBtn">刷新</button>
              </div>
              <div id="todayWeatherBox">
                <div class="status-msg">正在获取气象数据...</div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span class="panel-title-deco">未来七日晴雨</span>
                <span style="font-size: 12px; font-weight: normal; color: var(--ink-light); letter-spacing: 0;">明日至第七日</span>
              </div>
              <div id="forecastBox">
                <div class="status-msg">正在获取七日预报...</div>
              </div>
            </section>
          </div>
        </main>

        <footer class="footer">
          ✦ 中国农历与节气本地推演 · 气象数据源自 Open-Meteo 开源接口 · 点击月历任意日期可切换当日进度 ✦
        </footer>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const WEEKDAY_CHARS = ['日', '一', '二', '三', '四', '五', '六'];
      const STORAGE_CITIES_KEY = 'suishi_saved_cities_v1';
      const STORAGE_ACTIVE_KEY = 'suishi_active_city_v1';

      const DEFAULT_CITIES = [
        { id: '1816670', name: '北京', admin1: '北京市', country: '中国', latitude: 39.9075, longitude: 116.39723 },
        { id: '1796236', name: '上海', admin1: '上海市', country: '中国', latitude: 31.22222, longitude: 121.45806 },
        { id: '1808926', name: '杭州', admin1: '浙江省', country: '中国', latitude: 30.29365, longitude: 120.16142 }
      ];

      const now = new Date();
      let viewYear = now.getFullYear();
      let viewMonth = now.getMonth() + 1;
      let selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      let savedCities = loadCities();
      let activeCityId = loadActiveCityId(savedCities);

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, function (m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
      }

      function loadCities() {
        try {
          const raw = localStorage.getItem(STORAGE_CITIES_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return DEFAULT_CITIES.slice();
      }

      function saveCities() {
        try {
          localStorage.setItem(STORAGE_CITIES_KEY, JSON.stringify(savedCities));
          localStorage.setItem(STORAGE_ACTIVE_KEY, String(activeCityId));
        } catch (e) {}
      }

      function loadActiveCityId(cities) {
        try {
          const id = localStorage.getItem(STORAGE_ACTIVE_KEY);
          if (id && cities.some(c => String(c.id) === String(id))) return id;
        } catch (e) {}
        return String(cities[0].id);
      }

      function updateClock() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        const dateStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;
        const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        document.getElementById('liveClock').innerHTML = `${dateStr} <strong>${timeStr}</strong>`;
      }
      updateClock();
      setInterval(updateClock, 1000);

      function buildMonthProgressHtml(y, m, d) {
        const daysInMonth = new Date(y, m, 0).getDate();
        const remainMonthDays = daysInMonth - d;
        const monthPct = (d / daysInMonth) * 100;

        let sundayCapsHtml = '';
        let monthCellsHtml = '';
        let monthNumsHtml = '';
        let monthWeekdaysHtml = '';

        for (let dayIdx = 1; dayIdx <= daysInMonth; dayIdx++) {
          const dayOfWeek = new Date(y, m - 1, dayIdx).getDay();
          const weekdayChar = WEEKDAY_CHARS[dayOfWeek];
          const isFilled = dayIdx <= d;
          const isCurrent = dayIdx === d;
          const isSunday = dayOfWeek === 0;
          const isWeekEnd = isSunday && dayIdx < daysInMonth;

          const capCls = [
            'month-sunday-cap',
            isSunday ? 'is-sunday' : '',
            !isFilled ? 'is-future' : ''
          ].filter(Boolean).join(' ');

          const cellCls = [
            'month-day-cell',
            isFilled ? 'is-filled' : '',
            isCurrent ? 'is-current' : ''
          ].filter(Boolean).join(' ');

          const labelCls = [
            !isFilled ? 'is-future' : '',
            isCurrent ? 'is-current' : '',
            isSunday ? 'is-sunday' : '',
            isWeekEnd ? 'is-week-end' : ''
          ].filter(Boolean).join(' ');

          sundayCapsHtml += `<div class="${capCls}" title="${isSunday ? `${m}月${dayIdx}日 周日` : ''}"></div>`;
          monthCellsHtml += `<div class="${cellCls}" title="${m}月${dayIdx}日 星期${weekdayChar}"></div>`;
          monthNumsHtml += `<span class="${labelCls}">${dayIdx}</span>`;
          monthWeekdaysHtml += `<span class="${labelCls}">${weekdayChar}</span>`;
        }

        return `
          <div class="progress-item">
            <div class="progress-header">
              <span class="progress-title">月份进度（${m}月）</span>
              <span class="progress-meta">第 ${d} / ${daysInMonth} 天 · 剩 ${remainMonthDays} 天</span>
            </div>
            <div class="month-sunday-row" style="grid-template-columns: repeat(${daysInMonth}, 1fr);" aria-hidden="true">
              ${sundayCapsHtml}
            </div>
            <div class="month-days-track" style="grid-template-columns: repeat(${daysInMonth}, 1fr);" role="progressbar" aria-valuenow="${monthPct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100">
              ${monthCellsHtml}
            </div>
            <div class="month-day-nums" style="grid-template-columns: repeat(${daysInMonth}, 1fr);">
              ${monthNumsHtml}
            </div>
            <div class="month-weekdays" style="grid-template-columns: repeat(${daysInMonth}, 1fr);">
              ${monthWeekdaysHtml}
            </div>
          </div>
        `;
      }

      function buildYearProgressHtml(y, m, d) {
        const daysInMonth = new Date(y, m, 0).getDate();
        const isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
        const daysInYear = isLeap ? 366 : 365;
        const startOfYear = new Date(y, 0, 1);
        const dayOfYear = Math.floor((new Date(y, m - 1, d) - startOfYear) / 86400000) + 1;
        const remainYearDays = daysInYear - dayOfYear;
        const yearPct = (dayOfYear / daysInYear) * 100;

        let yearCellsHtml = '';
        let yearLabelsHtml = '';
        for (let monthIdx = 1; monthIdx <= 12; monthIdx++) {
          let cellPct = 0;
          if (monthIdx < m) {
            cellPct = 100;
          } else if (monthIdx === m) {
            cellPct = (d / daysInMonth) * 100;
          }
          const labelClass = monthIdx === m ? 'is-current' : (monthIdx < m ? 'is-passed' : '');
          yearCellsHtml += `<div class="year-grid-cell" title="${monthIdx}月"><div class="year-grid-fill" style="width: ${cellPct.toFixed(2)}%;"></div></div>`;
          yearLabelsHtml += `<span class="${labelClass}">${monthIdx}</span>`;
        }

        const seasonCls = {
          winEarly: m <= 2 ? 'is-current' : '',
          spring: m >= 3 && m <= 5 ? 'is-current' : '',
          summer: m >= 6 && m <= 8 ? 'is-current' : '',
          autumn: m >= 9 && m <= 11 ? 'is-current' : '',
          winLate: m === 12 ? 'is-current' : ''
        };

        return `
          <div class="progress-item">
            <div class="progress-header">
              <span class="progress-title">年份进度（${y}年）</span>
              <span class="progress-meta">第 ${dayOfYear} / ${daysInYear} 天 · 剩 ${remainYearDays} 天</span>
            </div>
            <div class="year-grid-track" role="progressbar" aria-valuenow="${yearPct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100">
              ${yearCellsHtml}
            </div>
            <div class="year-grid-labels">
              ${yearLabelsHtml}
            </div>
            <div class="year-season-labels">
              <span class="season-winter ${seasonCls.winEarly}">冬季</span>
              <span class="season-spring ${seasonCls.spring}">春季</span>
              <span class="season-summer ${seasonCls.summer}">夏季</span>
              <span class="season-autumn ${seasonCls.autumn}">秋季</span>
              <span class="season-winter ${seasonCls.winLate}">冬</span>
            </div>
          </div>
        `;
      }

      function renderDateDetail(dateObj) {
        const monthBox = document.getElementById('monthProgressPanel');
        const yearBox = document.getElementById('yearProgressPanel');
        const backBtn = document.getElementById('backTodayBtn');
        const today = new Date();
        const isToday =
          dateObj.getFullYear() === today.getFullYear() &&
          dateObj.getMonth() === today.getMonth() &&
          dateObj.getDate() === today.getDate();

        backBtn.style.display = isToday ? 'none' : 'inline-block';

        const y = dateObj.getFullYear();
        const m = dateObj.getMonth() + 1;
        const d = dateObj.getDate();

        monthBox.innerHTML = buildMonthProgressHtml(y, m, d);
        yearBox.innerHTML = buildYearProgressHtml(y, m, d);
      }

      function renderCalendar(year, month) {
        document.getElementById('calMonthTitle').textContent = `${year}年 ${month}月`;
        const container = document.getElementById('calDays');
        container.innerHTML = '';

        const firstDayOfWeek = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

        const today = new Date();
        const totalCells = Math.ceil((firstDayOfWeek + daysInMonth) / 7) * 7;

        for (let i = 0; i < totalCells; i++) {
          let cellY = year;
          let cellM = month;
          let cellD;
          let isOther = false;

          if (i < firstDayOfWeek) {
            cellD = daysInPrevMonth - firstDayOfWeek + i + 1;
            cellM = month - 1;
            if (cellM < 1) { cellM = 12; cellY -= 1; }
            isOther = true;
          } else if (i >= firstDayOfWeek + daysInMonth) {
            cellD = i - (firstDayOfWeek + daysInMonth) + 1;
            cellM = month + 1;
            if (cellM > 12) { cellM = 1; cellY += 1; }
            isOther = true;
          } else {
            cellD = i - firstDayOfWeek + 1;
          }

          const cellDate = new Date(cellY, cellM - 1, cellD);
          const isToday =
            cellY === today.getFullYear() &&
            cellM === today.getMonth() + 1 &&
            cellD === today.getDate();
          const isSelected =
            cellY === selectedDate.getFullYear() &&
            cellM === selectedDate.getMonth() + 1 &&
            cellD === selectedDate.getDate();
          const isWeekend = cellDate.getDay() === 0 || cellDate.getDay() === 6;

          let lunarText = '';
          let isHighlight = false;

          if (typeof Solar !== 'undefined') {
            const solar = Solar.fromYmd(cellY, cellM, cellD);
            const lunar = solar.getLunar();
            const jq = lunar.getJieQi();
            const fests = [...lunar.getFestivals(), ...solar.getFestivals()];

            if (fests.length > 0) {
              lunarText = fests[0];
              isHighlight = true;
            } else if (jq) {
              lunarText = jq;
              isHighlight = true;
            } else if (lunar.getDay() === 1) {
              lunarText = `${lunar.getMonthInChinese()}月`;
              isHighlight = true;
            } else {
              lunarText = lunar.getDayInChinese();
            }
          }

          const cell = document.createElement('div');
          cell.className = 'cal-cell' +
            (isOther ? ' other-month' : '') +
            (isToday ? ' today' : '') +
            (isSelected && !isToday ? ' selected' : '') +
            (isWeekend ? ' is-weekend' : '');

          cell.innerHTML = `
            <span class="cal-solar">${cellD}</span>
            <span class="cal-lunar ${isHighlight ? 'is-highlight' : ''}">${escapeHtml(lunarText)}</span>
          `;

          cell.addEventListener('click', () => {
            selectedDate = new Date(cellY, cellM - 1, cellD);
            if (isOther) {
              viewYear = cellY;
              viewMonth = cellM;
            }
            renderDateDetail(selectedDate);
            renderCalendar(viewYear, viewMonth);
          });

          container.appendChild(cell);
        }
      }

      document.getElementById('prevMonthBtn').addEventListener('click', () => {
        viewMonth--;
        if (viewMonth < 1) { viewMonth = 12; viewYear--; }
        renderCalendar(viewYear, viewMonth);
      });

      document.getElementById('nextMonthBtn').addEventListener('click', () => {
        viewMonth++;
        if (viewMonth > 12) { viewMonth = 1; viewYear++; }
        renderCalendar(viewYear, viewMonth);
      });

      document.getElementById('currMonthBtn').addEventListener('click', () => {
        const t = new Date();
        viewYear = t.getFullYear();
        viewMonth = t.getMonth() + 1;
        renderCalendar(viewYear, viewMonth);
      });

      document.getElementById('backTodayBtn').addEventListener('click', () => {
        const t = new Date();
        viewYear = t.getFullYear();
        viewMonth = t.getMonth() + 1;
        selectedDate = new Date(t.getFullYear(), t.getMonth(), t.getDate());
        renderDateDetail(selectedDate);
        renderCalendar(viewYear, viewMonth);
      });

      function parseWeatherCode(code) {
        const map = {
          0: { text: '晴朗', icon: '☀️' },
          1: { text: '晴间少云', icon: '🌤️' },
          2: { text: '多云', icon: '⛅' },
          3: { text: '阴天', icon: '☁️' },
          45: { text: '轻雾', icon: '🌫️' },
          48: { text: '霜雾', icon: '🌫️' },
          51: { text: '毛毛微雨', icon: '🌦️' },
          53: { text: '细雨', icon: '🌦️' },
          55: { text: '密雨', icon: '🌧️' },
          56: { text: '微冻雨', icon: '🌨️' },
          57: { text: '冻雨', icon: '🌨️' },
          61: { text: '小雨', icon: '🌦️' },
          63: { text: '中雨', icon: '🌧️' },
          65: { text: '大雨', icon: '🌧️' },
          66: { text: '冻雨', icon: '🌨️' },
          67: { text: '强冻雨', icon: '🌨️' },
          71: { text: '小雪', icon: '🌨️' },
          73: { text: '中雪', icon: '❄️' },
          75: { text: '大雪', icon: '❄️' },
          77: { text: '霰雪', icon: '❄️' },
          80: { text: '阵雨', icon: '🌦️' },
          81: { text: '强阵雨', icon: '🌧️' },
          82: { text: '暴雨', icon: '⛈️' },
          85: { text: '阵雪', icon: '🌨️' },
          86: { text: '强阵雪', icon: '❄️' },
          95: { text: '雷阵雨', icon: '⛈️' },
          96: { text: '雷雨夹雹', icon: '⛈️' },
          99: { text: '强雷暴冰雹', icon: '⛈️' }
        };
        return map[code] || { text: '气象未知', icon: '🌡️' };
      }

      function renderCityTabs() {
        const container = document.getElementById('cityTabs');
        container.innerHTML = '<span class="city-tabs-label">观象城市：</span>';

        savedCities.forEach(city => {
          const isActive = String(city.id) === String(activeCityId);
          const btn = document.createElement('button');
          btn.className = 'city-tab' + (isActive ? ' active' : '');
          btn.innerHTML = `<span>${escapeHtml(city.name)}</span>`;

          if (savedCities.length > 1) {
            const del = document.createElement('span');
            del.className = 'remove-city';
            del.title = '移除此城市';
            del.textContent = '×';
            del.addEventListener('click', e => {
              e.stopPropagation();
              savedCities = savedCities.filter(c => String(c.id) !== String(city.id));
              if (String(activeCityId) === String(city.id)) {
                activeCityId = String(savedCities[0].id);
                fetchWeatherForActiveCity();
              }
              saveCities();
              renderCityTabs();
            });
            btn.appendChild(del);
          }

          btn.addEventListener('click', () => {
            activeCityId = String(city.id);
            saveCities();
            renderCityTabs();
            fetchWeatherForActiveCity();
          });

          container.appendChild(btn);
        });
      }

      async function fetchWeatherForActiveCity() {
        const city = savedCities.find(c => String(c.id) === String(activeCityId)) || savedCities[0];
        if (!city) return;

        const todayBox = document.getElementById('todayWeatherBox');
        const forecastBox = document.getElementById('forecastBox');
        todayBox.innerHTML = `<div class="status-msg">正在获取气象数据（${escapeHtml(city.name)}）...</div>`;
        forecastBox.innerHTML = `<div class="status-msg">正在获取七日预报...</div>`;

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(city.latitude)}&longitude=${encodeURIComponent(city.longitude)}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&past_days=1&forecast_days=8`;

        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('网络请求异常');
          const data = await res.json();

          const curr = data.current;
          const daily = data.daily;
          const wInfo = parseWeatherCode(curr.weather_code);

          const todayStr = curr.time ? curr.time.slice(0, 10) : '';
          let todayIdx = todayStr ? daily.time.indexOf(todayStr) : -1;
          if (todayIdx === -1) {
            todayIdx = daily.time.length >= 9 ? 1 : 0;
          }

          const sunriseTime = daily.sunrise && daily.sunrise[todayIdx] ? daily.sunrise[todayIdx].slice(11, 16) : '--:--';
          const sunsetTime = daily.sunset && daily.sunset[todayIdx] ? daily.sunset[todayIdx].slice(11, 16) : '--:--';
          const regionSub = [city.admin1, city.country].filter(Boolean).join(' · ');

          const fourDaysSpec = [
            { offset: -1, label: '昨日', isToday: false },
            { offset: 0,  label: '今日', isToday: true },
            { offset: 1,  label: '明日', isToday: false },
            { offset: 2,  label: '后日', isToday: false }
          ];

          let fourDaysHtml = '<div class="weather-four-days">';
          fourDaysSpec.forEach(item => {
            const idx = todayIdx + item.offset;
            const cls = item.isToday ? 'day-mini-card is-today' : 'day-mini-card is-muted';
            if (idx >= 0 && idx < daily.time.length) {
              const dInfo = parseWeatherCode(daily.weather_code[idx]);
              const dMin = Math.round(daily.temperature_2m_min[idx]);
              const dMax = Math.round(daily.temperature_2m_max[idx]);
              const tempHtml = item.isToday
                ? `<span class="temp-low">${dMin}°</span>~<span class="temp-high">${dMax}°</span>`
                : `${dMin}°~${dMax}°`;

              fourDaysHtml += `
                <div class="${cls}">
                  <div class="day-mini-label">${item.label}</div>
                  <div class="day-mini-cond">
                    <span>${dInfo.icon}</span>
                    <span class="day-mini-text">${dInfo.text}</span>
                  </div>
                  <div class="day-mini-temp">${tempHtml}</div>
                </div>
              `;
            } else {
              fourDaysHtml += `
                <div class="${cls}">
                  <div class="day-mini-label">${item.label}</div>
                  <div class="day-mini-cond"><span class="day-mini-text">暂无</span></div>
                  <div class="day-mini-temp">--</div>
                </div>
              `;
            }
          });
          fourDaysHtml += '</div>';

          todayBox.innerHTML = `
            <div class="weather-now">
              <div class="weather-now-top">
                <div>
                  <div class="weather-city-name">${escapeHtml(city.name)}</div>
                  <div class="weather-city-sub">${escapeHtml(regionSub)}</div>
                </div>
                <div class="weather-temp-wrap">
                  <div class="weather-temp-main">${Math.round(curr.temperature_2m)}°C</div>
                  <div class="weather-desc">${wInfo.icon} ${wInfo.text}</div>
                </div>
              </div>
              ${fourDaysHtml}
            </div>
            <div class="weather-metrics">
              <div class="metric-item">
                <div class="metric-label">体感</div>
                <div class="metric-val">${Math.round(curr.apparent_temperature)}°C</div>
              </div>
              <div class="metric-item">
                <div class="metric-label">湿度</div>
                <div class="metric-val">${curr.relative_humidity_2m}%</div>
              </div>
              <div class="metric-item">
                <div class="metric-label">日出 / 日落</div>
                <div class="metric-val metric-sun">${sunriseTime} / ${sunsetTime}</div>
              </div>
            </div>
          `;

          let rowsHtml = '<div class="forecast-list">';
          for (let offset = 1; offset <= 7; offset++) {
            const i = todayIdx + offset;
            if (i >= daily.time.length) break;

            const dateStr = daily.time[i];
            const parts = dateStr.split('-');
            const dObj = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            const wdLabel = offset === 1 ? '明日' : offset === 2 ? '后日' : WEEKDAYS[dObj.getDay()];
            const mdLabel = `${Number(parts[1])}月${Number(parts[2])}日`;
            const fInfo = parseWeatherCode(daily.weather_code[i]);
            const rainProb = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
            const tMin = Math.round(daily.temperature_2m_min[i]);
            const tMax = Math.round(daily.temperature_2m_max[i]);

            rowsHtml += `
              <div class="forecast-row">
                <div class="forecast-date">
                  <strong>${wdLabel}</strong>
                  <span>${mdLabel}</span>
                </div>
                <div class="forecast-cond">
                  <span>${fInfo.icon}</span>
                  <span>${fInfo.text}</span>
                </div>
                <div class="forecast-rain">
                  ${rainProb !== null && rainProb > 0 ? `💧${rainProb}%` : ''}
                </div>
                <div class="forecast-temp">
                  <span class="temp-low">${tMin}°</span> ~ <span class="temp-high">${tMax}°</span>
                </div>
              </div>
            `;
          }
          rowsHtml += '</div>';
          forecastBox.innerHTML = rowsHtml;

        } catch (err) {
          todayBox.innerHTML = `<div class="status-msg">气象接口暂时无法连接，请稍后点击刷新。</div>`;
          forecastBox.innerHTML = `<div class="status-msg">暂无未来七日数据</div>`;
        }
      }

      document.getElementById('refreshWeatherBtn').addEventListener('click', fetchWeatherForActiveCity);

      const cityInput = document.getElementById('cityInput');
      const dropdown = document.getElementById('searchDropdown');

      async function searchCity() {
        const rawQuery = cityInput.value.trim();
        if (!rawQuery) return;

        dropdown.innerHTML = '<div class="search-item">寻城中，请稍候...</div>';
        dropdown.classList.add('show');

        async function queryApi(q) {
          const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=zh&format=json`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('搜索失败');
          const json = await res.json();
          return json.results || [];
        }

        try {
          let results = await queryApi(rawQuery);
          if (results.length === 0 && /[市省县区]$/.test(rawQuery) && rawQuery.length > 2) {
            results = await queryApi(rawQuery.slice(0, -1));
          }

          if (results.length === 0) {
            dropdown.innerHTML = '<div class="search-item">未寻得此城，请尝试输入完整城市名（如“苏州”或拼音）</div>';
            return;
          }

          dropdown.innerHTML = '';
          results.forEach(item => {
            const div = document.createElement('div');
            div.className = 'search-item';
            const sub = [item.admin1, item.country].filter(Boolean).join(' · ');
            div.innerHTML = `<span><strong>${escapeHtml(item.name)}</strong></span><small>${escapeHtml(sub)}</small>`;
            div.addEventListener('click', () => {
              const newCity = {
                id: String(item.id),
                name: item.name,
                admin1: item.admin1 || '',
                country: item.country || '',
                latitude: item.latitude,
                longitude: item.longitude
              };
              if (!savedCities.some(c => String(c.id) === newCity.id)) {
                savedCities.push(newCity);
              }
              activeCityId = newCity.id;
              saveCities();
              renderCityTabs();
              fetchWeatherForActiveCity();
              dropdown.classList.remove('show');
              cityInput.value = '';
            });
            dropdown.appendChild(div);
          });
        } catch (e) {
          dropdown.innerHTML = '<div class="search-item">寻城受阻，请检查网络后重试</div>';
        }
      }

      document.getElementById('searchBtn').addEventListener('click', searchCity);
      cityInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') searchCity();
      });

      document.addEventListener('click', e => {
        if (!e.target.closest('.city-search-wrap')) {
          dropdown.classList.remove('show');
        }
      });

      function loadLunarAsync() {
        if (typeof Solar !== 'undefined') return;
        const urls = [
          'https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.8/lunar.min.js',
          'https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.8/lunar.min.js'
        ];
        let idx = 0;
        function tryLoad() {
          if (idx >= urls.length) return;
          const s = document.createElement('script');
          s.src = urls[idx++];
          s.async = true;
          s.onload = function () {
            renderCalendar(viewYear, viewMonth);
          };
          s.onerror = tryLoad;
          document.body.appendChild(s);
        }
        tryLoad();
      }

      renderDateDetail(selectedDate);
      renderCalendar(viewYear, viewMonth);
      renderCityTabs();
      fetchWeatherForActiveCity();
      loadLunarAsync();
    })();
  </script>
</body>
</html>
