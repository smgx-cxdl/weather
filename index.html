<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时历</title>
  <style>
    :root {
      --paper-bg: #eef3f1;
      --card-bg: #fcfbf7;
      --card-inner: #f2f6f5;
      --ink-main: #24343d;
      --ink-sub: #536973;
      --ink-light: #8799a2;
      --ocean-teal: #266f88;
      --sky-cyan: #3d98b5;
      --sky-soft: #e6f3f7;
      --jade-green: #2b8e5e;
      --jade-soft: #e6f4ec;
      --warm-amber: #d67624;
      --amber-soft: #fdf2e4;
      --sun-gold: #d9a441;
      --gold-dark: #b97524;
      --gold-border: #d2cbb7;
      --dark-border: #8fa3ad;
      --shadow: 0 10px 30px rgba(38, 111, 136, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Palatino Linotype", "Book Antiqua", Baskerville, Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
      background-color: var(--paper-bg);
      background-image:
        radial-gradient(rgba(61, 152, 181, 0.05) 1px, transparent 0),
        radial-gradient(circle at 12% 0%, rgba(98, 190, 212, 0.14), transparent 45%),
        radial-gradient(circle at 88% 100%, rgba(240, 178, 92, 0.12), transparent 45%);
      background-size: 28px 28px, 100% 100%, 100% 100%;
      color: var(--ink-main);
      line-height: 1.6;
      min-height: 100vh;
      padding: 12px 10px 28px;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    .scroll-frame {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--ocean-teal);
      padding: 0;
      box-shadow: var(--shadow);
      border-radius: 3px;
    }

    .scroll-inner {
      position: relative;
      padding: 4px 14px 14px;
      background: var(--card-bg);
    }

    .header {
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 2px;
      padding-bottom: 5px;
      border-bottom: 3px double var(--gold-border);
      margin-bottom: 9px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-title h1 {
      font-size: 22px;
      color: var(--ocean-teal);
      letter-spacing: 3px;
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      min-width: 0;
    }

    .live-clock {
      font-size: 13px;
      color: var(--ink-sub);
      letter-spacing: 0.6px;
      padding: 3px 10px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      border-radius: 3px;
      white-space: nowrap;
    }

    .live-clock strong {
      color: var(--ocean-teal);
      font-size: 14px;
      margin-left: 6px;
      font-variant-numeric: tabular-nums;
    }

    .city-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 11px;
      background: var(--card-inner);
      padding: 8px 12px;
      border: 1px solid var(--gold-border);
      border-radius: 3px;
    }

    .city-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .city-tabs-label {
      font-size: 13px;
      color: var(--ink-sub);
      margin-right: 4px;
      letter-spacing: 0.5px;
    }

    .city-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      font-size: 14px;
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .city-tab:hover {
      border-color: var(--sky-cyan);
      color: var(--ocean-teal);
      background: var(--sky-soft);
    }

    .city-tab.active {
      background: var(--ocean-teal);
      color: #fcfbf7;
      border-color: var(--ocean-teal);
      box-shadow: inset 0 0 0 1px rgba(243, 198, 99, 0.55);
    }

    .city-tab .remove-city {
      font-size: 14px;
      opacity: 0.65;
      line-height: 1;
      padding: 0 2px;
    }

    .city-tab .remove-city:hover {
      opacity: 1;
    }

    .city-search-wrap {
      position: relative;
      display: flex;
      gap: 6px;
      width: 290px;
      max-width: 100%;
    }

    .city-search-wrap input {
      flex: 1;
      min-width: 0;
      padding: 5px 10px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--dark-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 3px;
      outline: none;
    }

    .city-search-wrap input:focus {
      border-color: var(--sky-cyan);
    }

    .btn-classic {
      padding: 5px 14px;
      font-size: 14px;
      font-family: inherit;
      background: var(--ocean-teal);
      color: #fcfbf7;
      border: 1px solid var(--ocean-teal);
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-classic:hover {
      background: var(--warm-amber);
      border-color: var(--warm-amber);
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--ocean-teal);
      box-shadow: var(--shadow);
      z-index: 100;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      border-radius: 3px;
    }

    .search-dropdown.show {
      display: block;
    }

    .search-item {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--gold-border);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background: var(--sky-soft);
      color: var(--ocean-teal);
    }

    .search-item small {
      color: var(--ink-light);
      font-size: 12px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 12px;
      align-items: start;
    }

    .main-col-left,
    .main-col-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .panel {
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      padding: 11px 14px;
      border-radius: 3px;
      box-shadow: 0 2px 10px rgba(38, 111, 136, 0.03);
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: var(--ocean-teal);
      padding-bottom: 6px;
      margin-bottom: 9px;
      border-bottom: 2px double var(--gold-border);
      letter-spacing: 2px;
    }

    .panel-title-deco::before {
      content: "✦ ";
      color: var(--warm-amber);
      font-size: 13px;
      margin-right: 4px;
    }

    .progress-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 14px;
    }

    .progress-title {
      font-weight: bold;
      color: var(--ocean-teal);
      letter-spacing: 0.8px;
    }

    .progress-meta {
      color: var(--ink-sub);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* 进度条上方：圆形周日标识 */
    .month-sunday-row {
      display: grid;
      gap: 2px;
      width: 100%;
      padding: 0 3px;
      margin-top: 2px;
      margin-bottom: 1px;
      justify-items: center;
      align-items: center;
    }

    .month-sunday-cap {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: transparent;
    }

    .month-sunday-cap.is-sunday {
      background: radial-gradient(circle at 35% 35%, #f9c663, #e68228);
      box-shadow: 0 1px 2px rgba(230, 130, 40, 0.32);
    }

    .month-sunday-cap.is-sunday.is-future {
      background: radial-gradient(circle at 35% 35%, #fbe0a3, #f0ac6b);
      opacity: 0.72;
    }

    /* 月份每日格子进度条：已过青色 + 今日翠绿 + 未过透明空白 */
    .month-days-track {
      display: grid;
      gap: 2px;
      width: 100%;
      height: 15px;
      background: transparent;
      border: 1px solid var(--gold-border);
      border-radius: 3px;
      padding: 2px;
    }

    .month-day-cell {
      height: 100%;
      background: transparent;
      border: 1px solid rgba(155, 168, 174, 0.25);
      border-radius: 1.5px;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }

    .month-day-cell.is-filled {
      background: linear-gradient(180deg, #8fd4e4, #4ca7c0);
      border-color: rgba(38, 111, 136, 0.45);
    }

    .month-day-cell.is-current,
    .month-day-cell.is-filled.is-current {
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, #43c47e, #239055);
      border-color: #1d7a47;
      transform: scaleY(1.18);
      box-shadow: 0 0 0 1px #fcfbf7, 0 1px 4px rgba(35, 144, 85, 0.32);
    }

    .month-day-nums,
    .month-weekdays {
      display: grid;
      gap: 2px;
      width: 100%;
      padding: 0 3px;
    }

    .month-day-nums span,
    .month-weekdays span {
      position: relative;
      text-align: center;
      font-size: 10px;
      line-height: 1.25;
      color: var(--ink-sub);
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .month-day-nums span.is-future,
    .month-weekdays span.is-future {
      color: var(--ink-light);
    }

    /* 周日保持暖琥珀橘加粗；非周日的当前日用翠绿色加粗标注 */
    .month-day-nums span.is-sunday,
    .month-weekdays span.is-sunday {
      color: #d66f19;
      font-weight: 700;
    }

    .month-day-nums span.is-sunday.is-future,
    .month-weekdays span.is-sunday.is-future {
      color: #e29148;
    }

    .month-day-nums span.is-current:not(.is-sunday),
    .month-weekdays span.is-current:not(.is-sunday) {
      color: var(--jade-green);
      font-weight: 700;
    }

    /* 在“日”与上方序号右侧加竖向虚线 */
    .month-day-nums span.is-week-end::after,
    .month-weekdays span.is-week-end::after {
      content: "";
      position: absolute;
      right: -1.5px;
      top: 0;
      bottom: -3px;
      border-right: 1px dashed rgba(214, 111, 25, 0.45);
      pointer-events: none;
    }

    .month-weekdays span.is-week-end::after {
      top: -2px;
      bottom: 0;
    }

    /* 年份 12 格进度条：高度与月份进度条保持一致 */
    #yearProgressPanel .progress-title {
      color: #c96c1f;
    }

    .year-grid-track {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      width: 100%;
      height: 15px;
      background: transparent;
      border: 1px solid rgba(210, 203, 183, 0.9);
      border-radius: 3px;
      padding: 2px;
    }

    .year-grid-cell {
      height: 100%;
      background: transparent;
      border: 1px solid rgba(214, 118, 36, 0.22);
      border-radius: 1.5px;
      overflow: hidden;
      display: flex;
      justify-content: flex-start;
    }

    .year-grid-fill {
      height: 100%;
      background: linear-gradient(90deg, #f6ba6f, #e0822b);
      transition: width 0.35s ease;
    }

    .year-grid-labels {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      padding: 0 2px;
    }

    .year-grid-labels span {
      text-align: center;
      font-size: 11px;
      color: var(--ink-light);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .year-grid-labels span.is-passed {
      color: var(--ink-sub);
    }

    .year-grid-labels span.is-current {
      color: #c96c1f;
      font-weight: bold;
    }

    .year-season-labels {
      display: grid;
      grid-template-columns: 2fr 3fr 3fr 3fr 1fr;
      gap: 3px;
      padding: 0 2px;
    }

    .year-season-labels span {
      text-align: center;
      font-size: 11px;
      color: var(--ink-light);
      line-height: 1.25;
      border-top: 1px solid rgba(210, 203, 183, 0.75);
      padding-top: 2px;
      white-space: nowrap;
    }

    .year-season-labels span + span {
      border-left: 1px dashed rgba(210, 203, 183, 0.85);
    }

    .year-season-labels span.is-current {
      font-weight: bold;
    }

    .year-season-labels span.season-spring.is-current {
      color: #55886c;
      border-top-color: #74a489;
    }

    .year-season-labels span.season-summer.is-current {
      color: #9c724b;
      border-top-color: #b88f68;
    }

    .year-season-labels span.season-autumn.is-current {
      color: #c96c1f;
      border-top-color: #e0822b;
    }

    .year-season-labels span.season-winter.is-current {
      color: #5c8190;
      border-top-color: #7c9fad;
    }

    .cal-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cal-btn {
      padding: 2px 9px;
      font-size: 12px;
      font-family: inherit;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      color: var(--ink-main);
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.15s;
    }

    .cal-btn:hover {
      border-color: var(--sky-cyan);
      color: var(--ocean-teal);
      background: var(--sky-soft);
    }

    .cal-weekdays, .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .cal-weekdays div {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: var(--ink-sub);
      padding: 3px 0;
      border-bottom: 1px solid var(--gold-border);
      margin-bottom: 2px;
    }

    .cal-weekdays div.weekend {
      color: #707880;
      background: rgba(130, 140, 150, 0.09);
      border-radius: 3px 3px 0 0;
    }

    .cal-cell {
      min-height: 44px;
      padding: 3px 2px;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.15s;
    }

    .cal-cell.is-weekend:not(.today):not(.selected):not(:hover) {
      background: rgba(130, 140, 150, 0.09);
    }

    .cal-cell:hover {
      background: var(--sky-soft);
      border-color: rgba(61, 152, 181, 0.35);
    }

    .cal-cell.other-month {
      opacity: 0.35;
    }

    .cal-cell.selected {
      border: 1.5px solid var(--jade-green);
      background: var(--jade-soft);
      box-shadow: inset 0 0 0 1px rgba(43, 142, 94, 0.18);
    }

    .cal-cell.today {
      background: var(--ocean-teal);
      color: #fcfbf7;
      border-color: var(--sun-gold);
      box-shadow: inset 0 0 0 1px rgba(252, 251, 247, 0.25);
    }

    .cal-cell.today .cal-lunar {
      color: rgba(252, 251, 247, 0.9);
    }

    .cal-solar {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.15;
      font-variant-numeric: lining-nums;
    }

    .cal-cell.is-weekend:not(.today) .cal-solar {
      color: #6b737b;
    }

    .cal-lunar {
      font-size: 10px;
      color: var(--ink-sub);
      margin-top: 1px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .cal-cell:not(.today) .cal-lunar.is-highlight {
      color: var(--ocean-teal);
      font-weight: bold;
    }

    .cal-cell:not(.today) .cal-lunar.is-statutory {
      color: #c93b2b;
      font-weight: bold;
    }

    .cal-cell:not(.today) .cal-lunar.is-western {
      color: #2166c2;
      font-weight: bold;
    }

    .cal-cell:not(.today) .cal-lunar.is-traditional {
      color: #6e747c;
      font-weight: bold;
    }

   /* 实况框：无色背景，固定最小高度，加载与刷新不跳动 */
    .weather-now {
      min-height: 138px;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid rgba(61, 152, 181, 0.3);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity 0.2s ease;
    }

    .weather-now.is-loading {
      justify-content: center;
      align-items: center;
    }

    .is-refreshing {
      opacity: 0.58;
    }

    .weather-now-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .weather-city-block {
      min-width: 0;
      flex-shrink: 1;
    }

    .weather-city-name {
      font-size: 18px;
      font-weight: bold;
      color: var(--ocean-teal);
      line-height: 1.2;
    }

    .weather-city-sub {
      font-size: 11px;
      color: var(--ink-sub);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 挤进蓝色框中间的体感、湿度、日出日落（缩小字体） */
    .weather-mid-metrics {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      padding: 2px 8px;
      border-left: 1px dashed rgba(61, 152, 181, 0.28);
      border-right: 1px dashed rgba(61, 152, 181, 0.28);
      font-size: 11px;
      line-height: 1.28;
      color: var(--ink-sub);
      text-align: center;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .weather-mid-metrics strong {
      color: var(--ink-main);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-left: 2px;
    }

    .weather-temp-wrap {
      text-align: right;
      flex-shrink: 0;
    }

    .weather-temp-main {
      font-size: 30px;
      font-weight: bold;
      color: var(--ocean-teal);
      line-height: 1.05;
      font-variant-numeric: lining-nums;
    }

    .weather-desc {
      font-size: 12.5px;
      color: var(--ink-main);
      margin-top: 1px;
    }

    /* 蓝框内部四日对比：昨日（淡）、今日、明日（淡）、后日（淡） */
    .weather-four-days {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(61, 152, 181, 0.25);
    }

    .day-mini-card {
      border-radius: 3px;
      padding: 4px 3px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      min-width: 0;
    }

.day-mini-card.is-muted {
      opacity: 0.52;
      background: transparent;
      border: 1px solid rgba(61, 152, 181, 0.14);
    }

    .day-mini-card.is-today {
      background: transparent;
      border: 1px solid #000;
    }

    .day-mini-label {
      font-size: 11px;
      color: var(--ink-sub);
      line-height: 1.2;
    }

    .day-mini-card.is-today .day-mini-label {
      color: var(--ocean-teal);
      font-weight: bold;
    }

    .day-mini-cond {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      max-width: 100%;
      font-size: 11px;
      line-height: 1.25;
      color: var(--ink-main);
    }

    .day-mini-card.is-muted .day-mini-cond {
      color: var(--ink-sub);
    }

    .day-mini-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-mini-temp {
      font-size: 11.5px;
      font-weight: bold;
      line-height: 1.2;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .day-mini-card.is-muted .day-mini-temp {
      color: var(--ink-sub);
      font-weight: normal;
    }

    /* 倒计时独立面板 */
    .panel-countdown {
      padding: 8px 12px;
      background: var(--card-inner);
    }

    .countdown-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      min-height: 28px;
    }

    .countdown-left {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      font-size: 13px;
      color: var(--ink-sub);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .countdown-left strong {
      font-size: 20px;
      line-height: 1;
      color: var(--warm-amber);
      font-variant-numeric: tabular-nums;
    }

    .countdown-left.is-today strong {
      font-size: 16px;
      color: var(--jade-green);
    }

    .countdown-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .countdown-note {
      font-size: 13.5px;
      color: var(--ink-main);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .countdown-date-tag {
      font-size: 11.5px;
      color: var(--ink-light);
      font-weight: normal;
      margin-left: 4px;
      font-variant-numeric: tabular-nums;
    }

    .countdown-editor {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--gold-border);
      flex-direction: column;
      gap: 7px;
    }

    .countdown-editor.show {
      display: flex;
    }

    .countdown-fest-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .fest-pill {
      padding: 2px 8px;
      font-size: 11.5px;
      font-family: inherit;
      background: var(--card-bg);
      border: 1px solid var(--gold-border);
      color: var(--ink-sub);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .fest-pill:hover {
      border-color: var(--sky-cyan);
      color: var(--ocean-teal);
      background: var(--sky-soft);
    }

    .fest-pill.active {
      background: var(--ocean-teal);
      color: #fcfbf7;
      border-color: var(--ocean-teal);
    }

    .countdown-custom-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .countdown-custom-row input[type="text"] {
      flex: 1;
      min-width: 120px;
      padding: 4px 8px;
      font-size: 12.5px;
      font-family: inherit;
      border: 1px solid var(--dark-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 3px;
      outline: none;
    }

    .countdown-custom-row input[type="date"] {
      padding: 3px 6px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid var(--dark-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 3px;
      outline: none;
    }

    .countdown-custom-row input:focus {
      border-color: var(--sky-cyan);
    }

    #forecastBox {
      min-height: 318px;
      display: flex;
      flex-direction: column;
      transition: opacity 0.2s ease;
    }

    #forecastBox .status-msg {
      margin: auto;
    }

    .forecast-list {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .forecast-row {
      display: grid;
      grid-template-columns: 92px 1fr 56px 96px;
      align-items: center;
      gap: 8px;
      padding: 7px 6px;
      border-bottom: 1px solid rgba(210, 203, 183, 0.65);
      font-size: 14px;
    }

    .forecast-row:last-child {
      border-bottom: none;
    }

    .forecast-date {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .forecast-date strong {
      font-size: 14px;
      color: var(--ink-main);
    }

    .forecast-date span {
      font-size: 11px;
      color: var(--ink-light);
    }

    .forecast-cond {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .forecast-rain {
      font-size: 12px;
      color: var(--jade-green);
      text-align: center;
    }

    .forecast-temp {
      text-align: right;
      font-weight: bold;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .temp-low {
      color: var(--sky-cyan);
      font-weight: normal;
    }

    .temp-high {
      color: var(--warm-amber);
    }

    .status-msg {
      padding: 16px;
      text-align: center;
      color: var(--ink-sub);
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--gold-border);
      font-size: 12px;
      color: var(--ink-light);
      letter-spacing: 1px;
    }

    @media (max-width: 860px) {
      .main-grid {
        grid-template-columns: 1fr;
        gap: 9px;
      }
      .main-col-left,
      .main-col-right {
        display: contents;
      }
      .panel-year-prog     { order: 1; }
      .panel-month-prog    { order: 2; }
      .panel-countdown     { order: 3; }
      .panel-calendar      { order: 4; }
      .panel-today-weather { order: 5; }
      .panel-forecast      { order: 6; }
      .scroll-inner {
        padding: 4px 10px 12px;
      }
    }

    @media (max-width: 680px) {
      .city-search-wrap {
        width: 100%;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 4px 3px 16px;
      }
      .scroll-frame {
        padding: 0;
      }
      .scroll-inner {
        padding: 3px 6px 10px;
      }
      .header {
        padding-top: 1px;
        padding-bottom: 4px;
        margin-bottom: 6px;
        gap: 6px;
      }
      .brand-title h1 {
        font-size: 18px;
        letter-spacing: 1.5px;
      }
      .live-clock {
        font-size: 11px;
        letter-spacing: 0.2px;
        padding: 2px 7px;
      }
      .live-clock strong {
        font-size: 12px;
        margin-left: 4px;
      }
      .city-bar {
        padding: 6px 7px;
        margin-bottom: 7px;
        gap: 5px;
      }
      .main-grid {
        gap: 7px;
      }
      .panel {
        padding: 8px 7px;
      }
      .panel-countdown {
        padding: 7px 8px;
      }
      .panel-title {
        font-size: 15px;
        padding-bottom: 5px;
        margin-bottom: 6px;
        letter-spacing: 1px;
      }
      .month-sunday-row {
        gap: 1px;
        padding: 0 2.5px;
      }
      .month-sunday-cap {
        width: 5px;
        height: 5px;
      }
      .month-days-track {
        gap: 1px;
        height: 13px;
        padding: 1.5px;
      }
      .month-day-nums,
      .month-weekdays {
        gap: 1px;
        padding: 0 2.5px;
      }
      .month-day-nums span,
      .month-weekdays span {
        font-size: 8px;
        letter-spacing: -0.5px;
      }
      .month-day-nums span.is-week-end::after,
      .month-weekdays span.is-week-end::after {
        right: -1px;
      }
      .year-grid-track,
      .year-grid-labels,
      .year-season-labels {
        gap: 2px;
      }
      .year-grid-track {
        height: 13px;
        padding: 1.5px;
      }
      .year-grid-labels span,
      .year-season-labels span {
        font-size: 10px;
      }
      .cal-btn {
        padding: 2px 7px;
        font-size: 12px;
      }
      .cal-weekdays, .cal-days {
        gap: 2px;
      }
      .cal-weekdays div {
        padding: 2px 0;
        font-size: 11px;
        margin-bottom: 2px;
      }
      .cal-cell {
        min-height: 38px;
        padding: 2px 1px;
      }
      .cal-solar {
        font-size: 14px;
        line-height: 1.1;
      }
      .cal-lunar {
        font-size: 9.5px;
        margin-top: 1px;
      }
      .weather-now {
        min-height: 120px;
        padding: 8px 8px;
      }
      .weather-now-top {
        gap: 5px;
      }
      .weather-city-name {
        font-size: 16px;
      }
      .weather-city-sub {
        font-size: 10px;
      }
      .weather-mid-metrics {
        padding: 1px 6px;
        font-size: 10px;
        line-height: 1.2;
      }
      .weather-temp-main {
        font-size: 25px;
      }
      .weather-desc {
        font-size: 11.5px;
      }
      .weather-four-days {
        gap: 4px;
        margin-top: 6px;
        padding-top: 6px;
      }
      .day-mini-card {
        padding: 4px 2px;
      }
      .day-mini-label,
      .day-mini-cond,
      .day-mini-temp {
        font-size: 10.5px;
      }
      .countdown-left {
        font-size: 12px;
      }
      .countdown-left strong {
        font-size: 18px;
      }
      .countdown-note {
        font-size: 12.5px;
      }
      #forecastBox {
        min-height: 280px;
      }
      .forecast-row {
        grid-template-columns: 78px 1fr 44px 82px;
        font-size: 13px;
        padding: 6px 4px;
      }
      .footer {
        margin-top: 10px;
        padding-top: 8px;
      }
    }

    @media (max-width: 375px) {
      .brand-title h1 {
        font-size: 17px;
        letter-spacing: 1px;
      }
      .live-clock {
        font-size: 10px;
        letter-spacing: 0;
        padding: 2px 5px;
      }
      .live-clock strong {
        font-size: 11px;
        margin-left: 3px;
      }
      .weather-mid-metrics {
        font-size: 9.5px;
        padding: 1px 4px;
      }
      .weather-temp-main {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="scroll-frame">
      <div class="scroll-inner">
        <header class="header">
          <div class="brand">
            <div class="brand-title">
              <h1>时历</h1>
            </div>
          </div>
          <div class="header-right">
            <div class="live-clock" id="liveClock">加载时间中...</div>
          </div>
        </header>

        <section class="city-bar">
          <div class="city-tabs" id="cityTabs">
            <span class="city-tabs-label">观象城市：</span>
          </div>
          <div class="city-search-wrap">
            <input type="text" id="cityInput" placeholder="输入城市名添加（如：苏州、成都）" autocomplete="off" />
            <button class="btn-classic" id="searchBtn">寻城</button>
            <div class="search-dropdown" id="searchDropdown"></div>
          </div>
        </section>

        <main class="main-grid">
          <div class="main-col-left">
            <section class="panel panel-calendar">
              <div class="panel-title">
                <span class="panel-title-deco" id="calMonthTitle">月历</span>
                <div class="cal-controls">
                  <button class="cal-btn" id="backTodayBtn" style="display: none;">今日</button>
                  <button class="cal-btn" id="prevMonthBtn">上月</button>
                  <button class="cal-btn" id="currMonthBtn">本月</button>
                  <button class="cal-btn" id="nextMonthBtn">下月</button>
                </div>
              </div>
              <div class="cal-weekdays">
                <div class="weekend">日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div class="weekend">六</div>
              </div>
              <div class="cal-days" id="calDays"></div>
            </section>
          </div>

          <div class="main-col-right">
            <section class="panel panel-year-prog" id="yearProgressPanel">
              <div class="status-msg">正在推演年份进度...</div>
            </section>

            <section class="panel panel-month-prog" id="monthProgressPanel">
              <div class="status-msg">正在推演月份进度...</div>
            </section>

            <section class="panel panel-countdown" id="countdownBox"></section>

            <section class="panel panel-today-weather">
              <div class="panel-title">
                <span class="panel-title-deco">气象 · 今日实况</span>
                <button class="cal-btn" id="refreshWeatherBtn">刷新</button>
              </div>
              <div id="todayWeatherBox">
                <div class="weather-now is-loading">
                  <div class="status-msg">正在获取气象数据...</div>
                </div>
              </div>
            </section>

            <section class="panel panel-forecast">
              <div class="panel-title">
                <span class="panel-title-deco">未来七日晴雨</span>
                <span style="font-size: 12px; font-weight: normal; color: var(--ink-light); letter-spacing: 0;">明日至第七日</span>
              </div>
              <div id="forecastBox">
                <div class="status-msg">正在获取七日预报...</div>
              </div>
            </section>
          </div>
        </main>

        <footer class="footer">
          ✦ 中国农历与节气本地推演 · 气象数据源自 Open-Meteo 开源接口 · 点击月历任意日期可切换当日进度 ✦
        </footer>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const WEEKDAY_CHARS = ['日', '一', '二', '三', '四', '五', '六'];
      const STATUTORY_FESTIVALS = new Set([
        '元旦节', '除夕', '春节', '清明', '劳动节', '端午节', '中秋节', '国庆节'
      ]);
      const WESTERN_FESTIVALS = new Set([
        '情人节', '愚人节', '母亲节', '父亲节',
        '万圣节前夜', '万圣节', '感恩节', '平安夜', '圣诞节'
      ]);
      const STORAGE_CITIES_KEY = 'suishi_saved_cities_v1';
      const STORAGE_ACTIVE_KEY = 'suishi_active_city_v1';
      const STORAGE_COUNTDOWN_KEY = 'suishi_countdown_v1';

      const DEFAULT_CITIES = [
        { id: '1816670', name: '北京', admin1: '北京市', country: '中国', latitude: 39.9075, longitude: 116.39723 },
        { id: '1796236', name: '上海', admin1: '上海市', country: '中国', latitude: 31.22222, longitude: 121.45806 },
        { id: '1808926', name: '杭州', admin1: '浙江省', country: '中国', latitude: 30.29365, longitude: 120.16142 }
      ];

      const now = new Date();
      let viewYear = now.getFullYear();
      let viewMonth = now.getMonth() + 1;
      let selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      let savedCities = loadCities();
      let activeCityId = loadActiveCityId(savedCities);
      let countdownState = loadCountdownState();
      let countdownEditorOpen = false;
      let hasWeatherRendered = false;

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, function (m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
      }

      function loadCities() {
        try {
          const raw = localStorage.getItem(STORAGE_CITIES_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return DEFAULT_CITIES.slice();
      }

      function saveCities() {
        try {
          localStorage.setItem(STORAGE_CITIES_KEY, JSON.stringify(savedCities));
          localStorage.setItem(STORAGE_ACTIVE_KEY, String(activeCityId));
        } catch (e) {}
      }

      function loadActiveCityId(cities) {
        try {
          const id = localStorage.getItem(STORAGE_ACTIVE_KEY);
          if (id && cities.some(c => String(c.id) === String(id))) return id;
        } catch (e) {}
        return String(cities[0].id);
      }

      function loadCountdownState() {
        try {
          const raw = localStorage.getItem(STORAGE_COUNTDOWN_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') return parsed;
          }
        } catch (e) {}
        return { mode: 'auto', name: '', dateStr: '' };
      }

      function saveCountdownState(next) {
        countdownState = next;
        try {
          localStorage.setItem(STORAGE_COUNTDOWN_KEY, JSON.stringify(next));
        } catch (e) {}
      }

      function updateClock() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        const dateStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;
        const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        document.getElementById('liveClock').innerHTML = `${dateStr} <strong>${timeStr}</strong>`;
      }

      updateClock();
      setInterval(updateClock, 1000);

      function buildMonthProgressHtml(y, m, d) {
        const daysInMonth = new Date(y, m, 0).getDate();
        const remainMonthDays = daysInMonth - d;
        const monthPct = (d / daysInMonth) * 100;

        let sundayCapsHtml = '';
        let monthCellsHtml = '';
        let monthNumsHtml = '';
        let monthWeekdaysHtml = '';

        for (let dayIdx = 1; dayIdx <= daysInMonth; dayIdx++) {
          const dayOfWeek = new Date(y, m - 1, dayIdx).getDay();
          const weekdayChar = WEEKDAY_CHARS[dayOfWeek];
          const isFilled = dayIdx < d;
          const isCurrent = dayIdx === d;
          const isFuture = dayIdx > d;
          const isSunday = dayOfWeek === 0;
          const isWeekEnd = isSunday && dayIdx < daysInMonth;

          const capCls = [
            'month-sunday-cap',
            isSunday ? 'is-sunday' : '',
            isFuture ? 'is-future' : ''
          ].filter(Boolean).join(' ');

          const cellCls = [
            'month-day-cell',
            isFilled ? 'is-filled' : '',
            isCurrent ? 'is-current' : ''
          ].filter(Boolean).join(' ');

          const labelCls = [
            isFuture ? 'is-future' : '',
            isCurrent ? 'is-current' : '',
            isSunday ? 'is-sunday' : '',
            isWeekEnd ? 'is-week-end' : ''
          ].filter(Boolean).join(' ');

          sundayCapsHtml += `<div class="${capCls}" title="${isSunday ? `${m}月${dayIdx}日 周日` : ''}"></div>`;
          monthCellsHtml += `<div class="${cellCls}" title="${m}月${dayIdx}日 星期${weekdayChar}"></div>`;
          monthNumsHtml += `<span class="${labelCls}">${dayIdx}</span>`;
          monthWeekdaysHtml += `<span class="${labelCls}">${weekdayChar}</span>`;
        }

        return `
          <div class="progress-item">
            <div class="progress-header">
              <span class="progress-title">${m}月</span>
              <span class="progress-meta">剩 ${remainMonthDays} 天</span>
            </div>
            <div class="month-sunday-row" style="grid-template-columns: repeat(${daysInMonth}, 1fr);" aria-hidden="true">
              ${sundayCapsHtml}
            </div>
            <div class="month-days-track" style="grid-template-columns: repeat(${daysInMonth}, 1fr);" role="progressbar" aria-valuenow="${monthPct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100">
              ${monthCellsHtml}
            </div>
            <div class="month-day-nums" style="grid-template-columns: repeat(${daysInMonth}, 1fr);">
              ${monthNumsHtml}
            </div>
            <div class="month-weekdays" style="grid-template-columns: repeat(${daysInMonth}, 1fr);">
              ${monthWeekdaysHtml}
            </div>
          </div>
        `;
      }

      function buildYearProgressHtml(y, m, d) {
        const daysInMonth = new Date(y, m, 0).getDate();
        const isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
        const daysInYear = isLeap ? 366 : 365;
        const startOfYear = new Date(y, 0, 1);
        const dayOfYear = Math.floor((new Date(y, m - 1, d) - startOfYear) / 86400000) + 1;
        const remainYearDays = daysInYear - dayOfYear;
        const yearPct = (dayOfYear / daysInYear) * 100;

        let yearCellsHtml = '';
        let yearLabelsHtml = '';
        for (let monthIdx = 1; monthIdx <= 12; monthIdx++) {
          let cellPct = 0;
          if (monthIdx < m) {
            cellPct = 100;
          } else if (monthIdx === m) {
            cellPct = (d / daysInMonth) * 100;
          }
          const labelClass = monthIdx === m ? 'is-current' : (monthIdx < m ? 'is-passed' : '');
          yearCellsHtml += `<div class="year-grid-cell" title="${monthIdx}月"><div class="year-grid-fill" style="width: ${cellPct.toFixed(2)}%;"></div></div>`;
          yearLabelsHtml += `<span class="${labelClass}">${monthIdx}</span>`;
        }

        const seasonCls = {
          winEarly: m <= 2 ? 'is-current' : '',
          spring: m >= 3 && m <= 5 ? 'is-current' : '',
          summer: m >= 6 && m <= 8 ? 'is-current' : '',
          autumn: m >= 9 && m <= 11 ? 'is-current' : '',
          winLate: m === 12 ? 'is-current' : ''
        };

        return `
          <div class="progress-item">
            <div class="progress-header">
              <span class="progress-title">${y}年</span>
              <span class="progress-meta">剩 ${remainYearDays} 天</span>
            </div>
            <div class="year-grid-track" role="progressbar" aria-valuenow="${yearPct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100">
              ${yearCellsHtml}
            </div>
            <div class="year-grid-labels">
              ${yearLabelsHtml}
            </div>
            <div class="year-season-labels">
              <span class="season-winter ${seasonCls.winEarly}">冬季</span>
              <span class="season-spring ${seasonCls.spring}">春季</span>
              <span class="season-summer ${seasonCls.summer}">夏季</span>
              <span class="season-autumn ${seasonCls.autumn}">秋季</span>
              <span class="season-winter ${seasonCls.winLate}">冬</span>
            </div>
          </div>
        `;
      }

      function renderDateDetail(dateObj) {
        const monthBox = document.getElementById('monthProgressPanel');
        const yearBox = document.getElementById('yearProgressPanel');
        const backBtn = document.getElementById('backTodayBtn');
        const today = new Date();
        const isToday =
          dateObj.getFullYear() === today.getFullYear() &&
          dateObj.getMonth() === today.getMonth() &&
          dateObj.getDate() === today.getDate();

        backBtn.style.display = isToday ? 'none' : 'inline-block';

        const y = dateObj.getFullYear();
        const m = dateObj.getMonth() + 1;
        const d = dateObj.getDate();

        monthBox.innerHTML = buildMonthProgressHtml(y, m, d);
        yearBox.innerHTML = buildYearProgressHtml(y, m, d);
      }

      function formatYmd(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function parseYmdLocal(dateStr) {
        if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return null;
        const p = dateStr.split('-');
        return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      }

      function getUpcomingFestivals() {
        const t = new Date();
        const todayMidnight = new Date(t.getFullYear(), t.getMonth(), t.getDate());
        const list = [];
        const seen = new Set();

        for (let offset = 0; offset <= 375; offset++) {
          const dt = new Date(todayMidnight.getFullYear(), todayMidnight.getMonth(), todayMidnight.getDate() + offset);
          const y = dt.getFullYear();
          const m = dt.getMonth() + 1;
          const d = dt.getDate();
          const ymd = formatYmd(dt);

          const addFest = name => {
            if (!seen.has(name)) {
              seen.add(name);
              list.push({ name, dateStr: ymd, monthDay: `${m}月${d}日`, diffDays: offset });
            }
          };

          if (m === 1 && d === 1) addFest('元旦');
          if (m === 5 && d === 1) addFest('劳动节');
          if (m === 10 && d === 1) addFest('国庆节');

          if (typeof Solar !== 'undefined') {
            const solar = Solar.fromYmd(y, m, d);
            const lunar = solar.getLunar();
            const jq = lunar.getJieQi();
            if (jq === '清明') addFest('清明');
            if (jq === '冬至') addFest('冬至');

            const nextDt = new Date(y, m - 1, d + 1);
            const nextLunar = Solar.fromYmd(nextDt.getFullYear(), nextDt.getMonth() + 1, nextDt.getDate()).getLunar();
            if (nextLunar.getMonth() === 1 && nextLunar.getDay() === 1) {
              addFest('除夕');
            }

            const lm = lunar.getMonth();
            const ld = lunar.getDay();
            if (lm === 1 && ld === 1) addFest('春节');
            if (lm === 1 && ld === 15) addFest('元宵');
            if (lm === 5 && ld === 5) addFest('端午');
            if (lm === 7 && ld === 7) addFest('七夕');
            if (lm === 8 && ld === 15) addFest('中秋');
            if (lm === 9 && ld === 9) addFest('重阳');
            if (lm === 12 && ld === 8) addFest('腊八');
          }
        }
        return list;
      }

      function renderCountdown() {
        const box = document.getElementById('countdownBox');
        if (!box) return;

        const t = new Date();
        const todayMidnight = new Date(t.getFullYear(), t.getMonth(), t.getDate());
        const festivals = getUpcomingFestivals();

        let targetName = '';
        let targetDateStr = '';

        if (countdownState.mode === 'custom' && countdownState.dateStr) {
          targetName = countdownState.name || '记事目标日';
          targetDateStr = countdownState.dateStr;
        } else if (countdownState.mode === 'festival' && countdownState.name) {
          const matched = festivals.find(f => f.name === countdownState.name);
          if (matched) {
            targetName = matched.name;
            targetDateStr = matched.dateStr;
          } else if (countdownState.dateStr) {
            targetName = countdownState.name;
            targetDateStr = countdownState.dateStr;
          }
        }

        if (!targetDateStr) {
          if (festivals.length > 0) {
            targetName = festivals[0].name;
            targetDateStr = festivals[0].dateStr;
          } else {
            const nextYear = new Date(t.getFullYear() + 1, 0, 1);
            targetName = '元旦';
            targetDateStr = formatYmd(nextYear);
          }
        }

        const targetDate = parseYmdLocal(targetDateStr) || todayMidnight;
        const diffDays = Math.round((targetDate - todayMidnight) / 86400000);
        const mdLabel = `${targetDate.getMonth() + 1}月${targetDate.getDate()}日`;

        let leftHtml = '';
        if (diffDays > 0) {
          leftHtml = `<div class="countdown-left">还剩 <strong>${diffDays}</strong> 天</div>`;
        } else if (diffDays === 0) {
          leftHtml = `<div class="countdown-left is-today">就是 <strong>今日</strong></div>`;
        } else {
          leftHtml = `<div class="countdown-left">已过 <strong>${Math.abs(diffDays)}</strong> 天</div>`;
        }

        const pillsHtml = festivals.map(f => {
          const isAct = countdownState.mode !== 'custom' && f.name === targetName;
          return `<button type="button" class="fest-pill${isAct ? ' active' : ''}" data-fest-name="${escapeHtml(f.name)}" data-fest-date="${f.dateStr}">${escapeHtml(f.name)} ${f.monthDay}</button>`;
        }).join('');

        box.innerHTML = `
          <div class="countdown-bar">
            ${leftHtml}
            <div class="countdown-right">
              <div class="countdown-note" title="${escapeHtml(targetName)}（${mdLabel}）">
                ${escapeHtml(targetName)}<span class="countdown-date-tag">${mdLabel}</span>
              </div>
              <button type="button" class="cal-btn" id="toggleCountdownBtn">${countdownEditorOpen ? '收起' : '记事'}</button>
            </div>
          </div>
          <div class="countdown-editor${countdownEditorOpen ? ' show' : ''}" id="countdownEditor">
            <div class="countdown-fest-pills">
              ${pillsHtml}
            </div>
            <div class="countdown-custom-row">
              <input type="text" id="countdownTextInput" maxlength="20" placeholder="可输入记事文字（仅存本地）" value="${countdownState.mode === 'custom' ? escapeHtml(countdownState.name) : ''}" />
              <input type="date" id="countdownDateInput" value="${targetDateStr}" />
              <button type="button" class="cal-btn" id="saveCountdownBtn">确定</button>
              <button type="button" class="cal-btn" id="autoCountdownBtn">自动最近</button>
            </div>
          </div>
        `;

        document.getElementById('toggleCountdownBtn').addEventListener('click', () => {
          countdownEditorOpen = !countdownEditorOpen;
          renderCountdown();
        });

        box.querySelectorAll('.fest-pill').forEach(btn => {
          btn.addEventListener('click', () => {
            saveCountdownState({
              mode: 'festival',
              name: btn.getAttribute('data-fest-name'),
              dateStr: btn.getAttribute('data-fest-date')
            });
            countdownEditorOpen = false;
            renderCountdown();
          });
        });

        document.getElementById('saveCountdownBtn').addEventListener('click', () => {
          const txt = document.getElementById('countdownTextInput').value.trim();
          const dt = document.getElementById('countdownDateInput').value;
          if (!dt) return;
          saveCountdownState({
            mode: 'custom',
            name: txt || '记事目标日',
            dateStr: dt
          });
          countdownEditorOpen = false;
          renderCountdown();
        });

        document.getElementById('autoCountdownBtn').addEventListener('click', () => {
          saveCountdownState({ mode: 'auto', name: '', dateStr: '' });
          countdownEditorOpen = false;
          renderCountdown();
        });
      }

      function renderCalendar(year, month) {
        document.getElementById('calMonthTitle').textContent = `${year}年 ${month}月`;
        const container = document.getElementById('calDays');
        container.innerHTML = '';

        const firstDayOfWeek = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

        const today = new Date();
        const totalCells = Math.ceil((firstDayOfWeek + daysInMonth) / 7) * 7;

        for (let i = 0; i < totalCells; i++) {
          let cellY = year;
          let cellM = month;
          let cellD;
          let isOther = false;

          if (i < firstDayOfWeek) {
            cellD = daysInPrevMonth - firstDayOfWeek + i + 1;
            cellM = month - 1;
            if (cellM < 1) { cellM = 12; cellY -= 1; }
            isOther = true;
          } else if (i >= firstDayOfWeek + daysInMonth) {
            cellD = i - (firstDayOfWeek + daysInMonth) + 1;
            cellM = month + 1;
            if (cellM > 12) { cellM = 1; cellY += 1; }
            isOther = true;
          } else {
            cellD = i - firstDayOfWeek + 1;
          }

          const cellDate = new Date(cellY, cellM - 1, cellD);
          const isToday =
            cellY === today.getFullYear() &&
            cellM === today.getMonth() + 1 &&
            cellD === today.getDate();
          const isSelected =
            cellY === selectedDate.getFullYear() &&
            cellM === selectedDate.getMonth() + 1 &&
            cellD === selectedDate.getDate();
          const isWeekend = cellDate.getDay() === 0 || cellDate.getDay() === 6;

          let lunarText = '';
          let lunarClass = '';

          if (typeof Solar !== 'undefined') {
            const solar = Solar.fromYmd(cellY, cellM, cellD);
            const lunar = solar.getLunar();
            const jq = lunar.getJieQi();
            const lunarFests = lunar.getFestivals();
            const solarFests = solar.getFestivals();
            const fests = [...lunarFests, ...solarFests];
            const statutoryHit = fests.find(f => STATUTORY_FESTIVALS.has(f)) || (STATUTORY_FESTIVALS.has(jq) ? jq : '');

            if (statutoryHit) {
              lunarText = statutoryHit;
              lunarClass = 'is-statutory';
            } else if (fests.length > 0) {
              lunarText = fests[0];
              if (WESTERN_FESTIVALS.has(lunarText)) {
                lunarClass = 'is-western';
              } else if (lunarFests.includes(lunarText)) {
                lunarClass = 'is-traditional';
              } else {
                lunarClass = 'is-highlight';
              }
            } else if (jq) {
              lunarText = jq;
              lunarClass = 'is-traditional';
            } else if (lunar.getDay() === 1) {
              lunarText = `${lunar.getMonthInChinese()}月`;
              lunarClass = 'is-highlight';
            } else {
              lunarText = lunar.getDayInChinese();
            }
          }

          const cell = document.createElement('div');
          cell.className = 'cal-cell' +
            (isOther ? ' other-month' : '') +
            (isToday ? ' today' : '') +
            (isSelected && !isToday ? ' selected' : '') +
            (isWeekend ? ' is-weekend' : '');

          cell.innerHTML = `
            <span class="cal-solar">${cellD}</span>
            <span class="cal-lunar ${lunarClass}">${escapeHtml(lunarText)}</span>
          `;

          cell.addEventListener('click', () => {
            selectedDate = new Date(cellY, cellM - 1, cellD);
            if (isOther) {
              viewYear = cellY;
              viewMonth = cellM;
            }
            renderDateDetail(selectedDate);
            renderCalendar(viewYear, viewMonth);
          });

          container.appendChild(cell);
        }
      }

      document.getElementById('prevMonthBtn').addEventListener('click', () => {
        viewMonth--;
        if (viewMonth < 1) { viewMonth = 12; viewYear--; }
        renderCalendar(viewYear, viewMonth);

      document.getElementById('nextMonthBtn').addEventListener('click', () => {

      async function fetchWeatherForActiveCity() {
        const city = savedCities.find(c => String(c.id) === String(activeCityId)) || savedCities[0];
        if (!city) return;

        const todayBox = document.getElementById('todayWeatherBox');
        const forecastBox = document.getElementById('forecastBox');
        const refreshBtn = document.getElementById('refreshWeatherBtn');

        if (refreshBtn) refreshBtn.textContent = '刷新中...';
        if (hasWeatherRendered) {
          todayBox.classList.add('is-refreshing');
          forecastBox.classList.add('is-refreshing');
        } else {
          todayBox.innerHTML = `<div class="weather-now is-loading"><div class="status-msg">正在获取气象数据（${escapeHtml(city.name)}）...</div></div>`;
          forecastBox.innerHTML = `<div class="status-msg">正在获取七日预报...</div>`;
        }

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(city.latitude)}&longitude=${encodeURIComponent(city.longitude)}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&past_days=1&forecast_days=8`;

        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('网络请求异常');
          const data = await res.json();

          const curr = data.current;
          const daily = data.daily;
          const wInfo = parseWeatherCode(curr.weather_code);

          const todayStr = curr.time ? curr.time.slice(0, 10) : '';
          let todayIdx = todayStr ? daily.time.indexOf(todayStr) : -1;
          if (todayIdx === -1) {
            todayIdx = daily.time.length >= 9 ? 1 : 0;
          }

          const sunriseTime = daily.sunrise && daily.sunrise[todayIdx] ? daily.sunrise[todayIdx].slice(11, 16) : '--:--';
          const sunsetTime = daily.sunset && daily.sunset[todayIdx] ? daily.sunset[todayIdx].slice(11, 16) : '--:--';
          const regionSub = [city.admin1, city.country].filter(Boolean).join(' · ');

          const fourDaysSpec = [
            { offset: -1, label: '昨日', isToday: false },
            { offset: 0,  label: '今日', isToday: true },
            { offset: 1,  label: '明日', isToday: false },
            { offset: 2,  label: '后日', isToday: false }
          ];

          let fourDaysHtml = '<div class="weather-four-days">';
          fourDaysSpec.forEach(item => {
            const idx = todayIdx + item.offset;
            const cls = item.isToday ? 'day-mini-card is-today' : 'day-mini-card is-muted';
            if (idx >= 0 && idx < daily.time.length) {
              const dInfo = parseWeatherCode(daily.weather_code[idx]);
              const dMin = Math.round(daily.temperature_2m_min[idx]);
              const dMax = Math.round(daily.temperature_2m_max[idx]);
              const tempHtml = item.isToday
                ? `<span class="temp-low">${dMin}°</span>~<span class="temp-high">${dMax}°</span>`
                : `${dMin}°~${dMax}°`;

              fourDaysHtml += `
                <div class="${cls}">
                  <div class="day-mini-label">${item.label}</div>
                  <div class="day-mini-cond">
                    <span>${dInfo.icon}</span>
                    <span class="day-mini-text">${dInfo.text}</span>
                  </div>
                  <div class="day-mini-temp">${tempHtml}</div>
                </div>
              `;
            } else {
              fourDaysHtml += `
                <div class="${cls}">
                  <div class="day-mini-label">${item.label}</div>
                  <div class="day-mini-cond"><span class="day-mini-text">暂无</span></div>
                  <div class="day-mini-temp">--</div>
                </div>
              `;
            }
          });
          fourDaysHtml += '</div>';

          todayBox.innerHTML = `
            <div class="weather-now">
              <div class="weather-now-top">
                <div class="weather-city-block">
                  <div class="weather-city-name">${escapeHtml(city.name)}</div>
                  <div class="weather-city-sub">${escapeHtml(regionSub)}</div>
                </div>
                <div class="weather-mid-metrics">
                  <div><span>体感</span><strong>${Math.round(curr.apparent_temperature)}°C</strong></div>
                  <div><span>湿度</span><strong>${curr.relative_humidity_2m}%</strong></div>
                  <div><span>日出/落</span><strong>${sunriseTime}/${sunsetTime}</strong></div>
                </div>
                <div class="weather-temp-wrap">
                  <div class="weather-temp-main">${Math.round(curr.temperature_2m)}°C</div>
                  <div class="weather-desc">${wInfo.icon} ${wInfo.text}</div>
                </div>
              </div>
              ${fourDaysHtml}
            </div>
          `;

          let rowsHtml = '<div class="forecast-list">';
          for (let offset = 1; offset <= 7; offset++) {
            const i = todayIdx + offset;
            if (i >= daily.time.length) break;

            const dateStr = daily.time[i];
            const parts = dateStr.split('-');
            const dObj = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            const wdLabel = offset === 1 ? '明日' : offset === 2 ? '后日' : WEEKDAYS[dObj.getDay()];
            const mdLabel = `${Number(parts[1])}月${Number(parts[2])}日`;
            const fInfo = parseWeatherCode(daily.weather_code[i]);
            const rainProb = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
            const tMin = Math.round(daily.temperature_2m_min[i]);
            const tMax = Math.round(daily.temperature_2m_max[i]);

            rowsHtml += `
              <div class="forecast-row">
                <div class="forecast-date">
                  <strong>${wdLabel}</strong>
                  <span>${mdLabel}</span>
                </div>
                <div class="forecast-cond">
                  <span>${fInfo.icon}</span>
                  <span>${fInfo.text}</span>
                </div>
                <div class="forecast-rain">
                  ${rainProb !== null && rainProb > 0 ? `💧${rainProb}%` : ''}
                </div>
                <div class="forecast-temp">
                  <span class="temp-low">${tMin}°</span> ~ <span class="temp-high">${tMax}°</span>
                </div>
              </div>
            `;
          }
          rowsHtml += '</div>';
          forecastBox.innerHTML = rowsHtml;
          hasWeatherRendered = true;

        } catch (err) {
          if (!hasWeatherRendered) {
            todayBox.innerHTML = `<div class="weather-now is-loading"><div class="status-msg">气象接口暂时无法连接，请稍后点击刷新。</div></div>`;
            forecastBox.innerHTML = `<div class="status-msg">暂无未来七日数据</div>`;
          }
        } finally {
          todayBox.classList.remove('is-refreshing');
          forecastBox.classList.remove('is-refreshing');
          if (refreshBtn) refreshBtn.textContent = '刷新';
        }
      }

          const res = await fetch(url);
          if (!res.ok) throw new Error('搜索失败');
          const json = await res.json();

        }

        try {
          let results = await queryApi(rawQuery);
          if (results.length === 0 && /[市省县区]$/.test(rawQuery) && rawQuery.length > 2) {
            results = await queryApi(rawQuery.slice(0, -1));

          if (results.length === 0) {

                longitude: item.longitude
              };

              saveCities();

      function loadLunarAsync() {
        if (typeof Solar !== 'undefined') return;
        const urls = [
          'https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.8/lunar.min.js',
          'https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.8/lunar.min.js'
        ];
        let idx = 0;
        function tryLoad() {
          if (idx >= urls.length) return;
          const s = document.createElement('script');
          s.src = urls[idx++];
          s.async = true;
          s.onload = function () {
            renderCalendar(viewYear, viewMonth);
            renderCountdown();
          };
          s.onerror = tryLoad;
          document.body.appendChild(s);
        }
        tryLoad();
      }

      renderDateDetail(selectedDate);
      renderCalendar(viewYear, viewMonth);
      renderCityTabs();
      renderCountdown();
      fetchWeatherForActiveCity();
      loadLunarAsync();
    })();
  </script>
</body>
</html>
