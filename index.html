<style>
  :root { --ink:#222; --grid:#dcdcdc; --muted:#888; --red:#e02020; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f4f4f2; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
    padding-bottom: 25vh;
  }
  body.dragging, body.dragging * { user-select: none; -webkit-user-select: none; }
  .sheet {
    max-width: 560px; margin: 16px auto; padding: 16px 12px 24px;
    background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.1);
  }
  .today { font-size: 20px; font-weight: bold; margin: 4px 0 16px; }

  /* 日期计算：日期 + 天数 = 日期 */
  .calc { display: grid; grid-template-columns: 1fr 64px 1fr; gap: 8px; margin-bottom: 22px; }
  .calc .lab { font-size: 13px; color: #444; margin-bottom: 4px; white-space: nowrap; }
  .calc input, .calc .res {
    width: 100%; height: 36px; border: 1px solid var(--grid); background: #fff;
    font: inherit; font-size: 13px; color: var(--ink); padding: 0 6px; border-radius: 0; outline: none;
    display: flex; align-items: center;
  }
  .calc input { text-align: right; }
  .calc .res { justify-content: flex-end; }
  .calc input:focus { background: #fff8e6; }

  /* 表格 */
  /* 每行 = 固定的序号列 + 可拖动的内容部分(.body) */
  .row {
    display: grid; grid-template-columns: 24px minmax(0, 1fr);
    -webkit-touch-callout: none;
  }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 90px 90px 46px; }
  .body > * {
    min-height: 34px; border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid);
  }
  .rn {
    min-height: 34px; border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid);
    border-left: 1px solid var(--grid);
    color: var(--muted); font-size: 12px; user-select: none;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .hd .rn, .hd .body > * { border-top: 1px solid var(--grid); }
  .hd {
    font-family: "Songti TC", "PMingLiU", "SimSun", serif; font-weight: bold; font-size: 14px;
  }
  .hd .body > div { display: flex; align-items: center; padding: 0 6px; white-space: nowrap; }
  .hd .body > div:nth-child(2), .hd .body > div:nth-child(3), .hd .body > div:nth-child(4) { justify-content: center; padding: 0 2px; }

  /* 序号由位置自动编号：固定不动，内容拖到哪个位置就是哪个序号 */
  #rows { counter-reset: rowno; }
  #rows .row { counter-increment: rowno; }
  #rows .rn::before { content: counter(rowno); }
  .row input {
    width: 100%; height: 100%; min-height: 34px; border: none; background: transparent;
    font: inherit; font-size: 15px; color: var(--ink); padding: 0 6px; border-radius: 0; outline: none;
  }
  .row input.dt { text-align: right; font-size: 12px; padding: 0 3px; }
  /* 平时输入框不接收触摸，由「点一下单元格」来聚焦它：
     这样长按时不会弹键盘、不会冒出光标和选字手柄，屏幕保持不变 */
  .row { -webkit-tap-highlight-color: transparent; }
  .row input { pointer-events: none; }
  .row input:focus { pointer-events: auto; }
  .row input:focus, .calc input:focus { background: #fff8e6; }
  .bad { background: #ffe3e3 !important; }
  .rem {
    color: var(--red); font-size: 15px; display: flex; align-items: center; justify-content: flex-end; padding: 0 6px;
    cursor: pointer; user-select: none;
  }

  /* 底部操作栏：复制成纯文字 */
  .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
  .actions button {
    font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--grid);
    background: #fff; color: var(--ink); cursor: pointer; border-radius: 0;
  }
  .actions button:active { background: #f4f4f2; }
  .actions button.ok { border-color: var(--ink); background: var(--ink); color: #fff; }

  /* 长按拖动换顺序：被拖的那一行浮起来 */
  .body.lift {
    position: relative; z-index: 3; background: #fffbe8;
    box-shadow: 0 4px 14px rgba(0,0,0,.28);
  }

  /* 弹窗（清空确认 / 手动复制兜底） */
  .mask {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 10;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 28vh;
  }
  .mask[hidden] { display: none; }
  .dlg { background: #fff; width: 280px; max-width: 86%; padding: 20px 18px 16px; box-shadow: 0 4px 20px rgba(0,0,0,.25); }
  .dlg-t { font-size: 16px; line-height: 1.5; text-align: center; margin-bottom: 18px; word-break: break-all; }
  .dlg-b { display: flex; gap: 10px; justify-content: center; }
  .dlg-b button {
    font: inherit; font-size: 15px; padding: 8px 22px; border: 1px solid var(--ink);
    background: #fff; color: var(--ink); cursor: pointer; border-radius: 0;
  }
  .dlg-b .danger { background: var(--red); border-color: var(--red); color: #fff; }
  .dlg-ta {
    width: 100%; height: 150px; border: 1px solid var(--grid); padding: 8px; margin-bottom: 14px;
    font: inherit; font-size: 13px; line-height: 1.5; color: var(--ink); border-radius: 0; resize: none; outline: none;
  }
</style>
</head>
<body>
<main class="sheet">
  <div class="today" id="today"></div>

  <div class="calc">
    <div><div class="lab">日期计算</div><div id="calcBaseBox"></div></div>
    <div><div class="lab">加（天）</div><div id="calcDaysBox"></div></div>
    <div><div class="lab">等于</div><div class="res" id="calcRes"></div></div>
  </div>

  <div class="row hd">
    <div class="rn"></div>
    <div class="body"><div>事项</div><div>自</div><div>至</div><div>余天</div></div>
  </div>
  <div id="rows"></div>
  <div class="actions">
    <button type="button" id="copyBtn">复制为纯文字</button>
  </div>
</main>

<div class="mask" id="mask" hidden>
  <div class="dlg">
    <div class="dlg-t" id="dlgT"></div>
    <div class="dlg-b">
      <button type="button" id="dlgNo">取消</button>
      <button type="button" id="dlgYes" class="danger">清空</button>
    </div>
  </div>
</div>

<div class="mask" id="copyMask" hidden>
  <div class="dlg" style="width: 340px;">
    <div class="dlg-t" style="margin-bottom: 10px; font-size: 14px;">请长按或按 Ctrl+C 复制以下文字</div>
    <textarea class="dlg-ta" id="copyTa" readonly></textarea>
    <div class="dlg-b">
      <button type="button" id="copyClose">关闭</button>
    </div>
  </div>
</div>

<script>
(function () {
  var ROWS = 10, KEY = "tracker-v1";

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }
  function fmt(s) {
    if (!s) return "";
    var p = s.split("-");
    return p[0] + "年" + (+p[1]) + "月" + (+p[2]) + "日";
  }
  function dayNum(s) {
    var p = s.split("-");
    return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
  }
  function todayIso() {
    var n = new Date();
    return iso(n.getFullYear(), n.getMonth() + 1, n.getDate());
  }
  function addDays(s, n) {
    var p = s.split("-");
    var dt = new Date(+p[0], +p[1] - 1, +p[2] + n);
    return iso(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
  }
  function validIso(y, m, d) {
    var dt = new Date(y, m - 1, d);
    return (dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d) ? iso(y, m, d) : null;
  }

  // 解析输入：空 → ""；认不出 → null
  // 支持：20261126 / 261126 / 1126 / 926 / 26（本月26日）/ 11/26 / 2026-11-26 / 2026年11月26日
  function parseDate(raw) {
    var s = (raw || "").trim();
    if (!s) return "";
    var parts = s.match(/\d+/g);
    if (!parts) return null;
    var now = new Date(), y, m, d;
    if (parts.length >= 3) {
      y = +parts[0]; m = +parts[1]; d = +parts[2];
      if (y < 100) y += 2000;
    } else if (parts.length === 2) {
      y = now.getFullYear(); m = +parts[0]; d = +parts[1];
    } else {
      var n = parts[0];
      if (n.length === 8) { y = +n.slice(0, 4); m = +n.slice(4, 6); d = +n.slice(6, 8); }
      else if (n.length === 6) { y = 2000 + (+n.slice(0, 2)); m = +n.slice(2, 4); d = +n.slice(4, 6); }
      else if (n.length === 4) { y = now.getFullYear(); m = +n.slice(0, 2); d = +n.slice(2, 4); }
      else if (n.length === 3) { y = now.getFullYear(); m = +n.slice(0, 1); d = +n.slice(1, 3); }
      else if (n.length <= 2) { y = now.getFullYear(); m = now.getMonth() + 1; d = +n; }
      else return null;
    }
    return validIso(y, m, d);
  }

  // ===== 数据 =====
  var state = null;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || typeof state !== "object") state = {};
  var rowsData = [];
  for (var i = 0; i < ROWS; i++) {
    var o = (state.rows && state.rows[i]) || {};
    rowsData.push({ text: o.text || "", from: o.from || "", to: o.to || "" });
  }
  var calc = state.calc || { base: todayIso(), days: "30" };
  state = { rows: rowsData, calc: calc };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ===== 日期输入框：点一下全选，直接用数字键盘输入，离开后自动整理成「X年X月X日」=====
  function dateInput(get, set, after) {
    var el = document.createElement("input");
    el.type = "text"; el.className = "dt"; el.autocomplete = "off";
    el.setAttribute("inputmode", "numeric");
    el.value = fmt(get());
    el.addEventListener("focus", function () {
      setTimeout(function () { try { el.select(); } catch (e) {} }, 0);
    });
    el.addEventListener("blur", function () {
      var v = parseDate(el.value);
      if (v === null) {                       // 认不出来：恢复原样并闪一下
        el.value = fmt(get());
        el.classList.add("bad");
        setTimeout(function () { el.classList.remove("bad"); }, 700);
        return;
      }
      set(v);
      el.value = fmt(v);
      save();
      after();
    });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
    });
    return el;
  }

  // ===== 今日日期 =====
  var todayEl = document.getElementById("today");
  var lastToday = "";
  function showToday() {
    lastToday = todayIso();
    var p = lastToday.split("-");
    var wd = ["日", "一", "二", "三", "四", "五", "六"][new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
    todayEl.textContent = "今日日期：" + fmt(lastToday) + "\u3000星期" + wd;
  }

  // ===== 日期计算：日期 + 天数 = 日期 =====
  var resEl = document.getElementById("calcRes");
  function updateCalc() {
    var n = parseInt(state.calc.days, 10);
    var b = state.calc.base;
    resEl.textContent = (b && !isNaN(n)) ? fmt(addDays(b, n)) : "";
  }
  document.getElementById("calcBaseBox").appendChild(
    dateInput(function () { return state.calc.base; }, function (v) { state.calc.base = v; }, updateCalc)
  );
  var daysEl = document.createElement("input");
  daysEl.type = "text"; daysEl.autocomplete = "off"; daysEl.setAttribute("inputmode", "numeric");
  daysEl.value = state.calc.days;
  daysEl.addEventListener("focus", function () {
    setTimeout(function () { try { daysEl.select(); } catch (e) {} }, 0);
  });
  daysEl.addEventListener("input", function () {
    var v = daysEl.value.replace(/[^\d-]/g, "").replace(/(?!^)-/g, "").slice(0, 6);
    daysEl.value = v;
    state.calc.days = v;
    save();
    updateCalc();
  });
  daysEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); daysEl.blur(); }
  });
  document.getElementById("calcDaysBox").appendChild(daysEl);

  // ===== 表格 =====
  function updateRem(row) {
    var to = row._r.to;
    row._rem.textContent = to ? String(dayNum(to) - dayNum(todayIso())) : "";
  }
  function updateAllRem() { [].forEach.call(box.children, updateRem); }

  // ===== 点「余天」数字：确认后清空这一行 =====
  var mask = document.getElementById("mask");
  var pending = null;
  function askClear(row) {
    var r = row._r;
    if (!r.text && !r.from && !r.to) return;          // 本来就是空的，不弹窗
    pending = row;
    var idx = [].indexOf.call(box.children, row);
    var name = r.text ? "「" + (r.text.length > 12 ? r.text.slice(0, 12) + "…" : r.text) + "」" : "";
    document.getElementById("dlgT").textContent = "是否清空第 " + (idx + 1) + " 项" + name + "？";
    mask.hidden = false;
  }
  function closeAsk() { mask.hidden = true; pending = null; }
  document.getElementById("dlgNo").onclick = closeAsk;
  mask.onclick = function (e) { if (e.target === mask) closeAsk(); };
  document.getElementById("dlgYes").onclick = function () {
    var row = pending;
    if (row) {
      var r = row._r;
      r.text = ""; r.from = ""; r.to = "";
      row._in.t.value = ""; row._in.f.value = ""; row._in.o.value = "";
      updateRem(row);
      save();
    }
    closeAsk();
  };

  var box = document.getElementById("rows");
  function buildRows() {
    box.innerHTML = "";
    state.rows.forEach(function (r) {
      var row = document.createElement("div");
      row.className = "row";
      row._r = r;

      var rn = document.createElement("div");
      rn.className = "rn";

      var tw = document.createElement("div");
      var t = document.createElement("input");
      t.type = "text"; t.maxLength = 60; t.value = r.text; t.autocomplete = "off";
      t.addEventListener("input", function () { r.text = t.value; save(); });
      tw.appendChild(t);

      var fIn = dateInput(function () { return r.from; }, function (v) { r.from = v; }, function () {});
      var fw = document.createElement("div");
      fw.appendChild(fIn);

      var oIn = dateInput(function () { return r.to; }, function (v) { r.to = v; }, function () { updateRem(row); });
      var ow = document.createElement("div");
      ow.appendChild(oIn);

      var rem = document.createElement("div");
      rem.className = "rem";
      row._rem = rem;
      row._in = { t: t, f: fIn, o: oIn };
      rem.onclick = function () { askClear(row); };

      var body = document.createElement("div");
      body.className = "body";
      body.appendChild(tw); body.appendChild(fw); body.appendChild(ow); body.appendChild(rem);
      row._body = body;

      row.appendChild(rn); row.appendChild(body);
      box.appendChild(row);
    });
  }
  buildRows();

  // ===== 复制为纯文字 =====
  var copyBtn = document.getElementById("copyBtn");
  var copyMask = document.getElementById("copyMask");
  var copyTa = document.getElementById("copyTa");
  var copyTimer = null;

  function buildPlainText() {
    var todayNum = dayNum(todayIso());
    var lines = [];
    var idx = 0;
    state.rows.forEach(function (r) {
      var text = (r.text || "").trim();
      if (!text && !r.from && !r.to) return;
      idx++;
      var parts = [];
      if (text) parts.push(text);
      if (r.from && r.to) parts.push("自 " + fmt(r.from) + " 至 " + fmt(r.to));
      else if (r.from) parts.push("自 " + fmt(r.from));
      else if (r.to) parts.push("至 " + fmt(r.to));
      if (r.to) parts.push("余 " + (dayNum(r.to) - todayNum) + " 天");
      lines.push(idx + ". " + parts.join("｜"));
    });
    if (!lines.length) return "";
    return todayEl.textContent + "\n\n" + lines.join("\n");
  }

  function flashCopyBtn(label, active) {
    clearTimeout(copyTimer);
    copyBtn.textContent = label;
    if (active) copyBtn.classList.add("ok");
    else copyBtn.classList.remove("ok");
    copyTimer = setTimeout(function () {
      copyBtn.textContent = "复制为纯文字";
      copyBtn.classList.remove("ok");
    }, 1800);
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0;";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, text.length); } catch (e) {}
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function openCopyFallback(text) {
    copyTa.value = text;
    copyMask.hidden = false;
    setTimeout(function () {
      copyTa.focus();
      copyTa.select();
      try { copyTa.setSelectionRange(0, text.length); } catch (e) {}
    }, 0);
  }

  document.getElementById("copyClose").onclick = function () { copyMask.hidden = true; };
  copyMask.onclick = function (e) { if (e.target === copyMask) copyMask.hidden = true; };

  copyBtn.addEventListener("click", function () {
    // 若有正在编辑的输入框，先失焦使其解析并保存
    try {
      var ae = document.activeElement;
      if (ae && ae.tagName === "INPUT" && ae.blur) ae.blur();
    } catch (e) {}
    var text = buildPlainText();
    if (!text) {
      flashCopyBtn("暂无内容", false);
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        flashCopyBtn("已复制", true);
      }, function () {
        if (fallbackCopy(text)) flashCopyBtn("已复制", true);
        else openCopyFallback(text);
      });
    } else if (fallbackCopy(text)) {
      flashCopyBtn("已复制", true);
    } else {
      openCopyFallback(text);
    }
  });

  // ===== 长按任意一行，上下拖动换顺序 =====
  var LONG = 400, SLOP = 8;
  var press = null;          // 按下但还没满 0.4 秒
  var drag = null;           // 正在拖动
  var lastTouch = 0;         // 用来忽略触摸后补发的鼠标事件
  var suppressUntil = 0;     // 拖动结束后短时间内不触发点击

  function cancelPress() {
    if (press) { clearTimeout(press.timer); press = null; }
  }
  function startPress(row, x, y) {
    cancelPress();
    press = {
      row: row, x: x, y: y,
      timer: setTimeout(function () { beginDrag(); }, LONG)
    };
  }
  function beginDrag() {
    if (!press) return;
    var row = press.row;
    var top = row.getBoundingClientRect().top;
    drag = { row: row, body: row._body, grab: press.y - top, dy: 0 };
    press = null;
    // 只有正在编辑的输入框就在被拖的这一行里时才收起键盘；否则键盘/光标保持原样
    try { var ae = document.activeElement; if (ae && row.contains(ae)) ae.blur(); } catch (e) {}
    document.body.classList.add("dragging");
    row._body.classList.add("lift");
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
  }
  // 只移动内容部分(.body)；序号列留在原位，序号按位置自动编号
  function moveDrag(y) {
    var row = drag.row;
    var h = row.offsetHeight;
    var br = box.getBoundingClientRect();
    var desired = Math.max(br.top - 6, Math.min(y - drag.grab, br.bottom - h + 6));
    var dy = desired - row.getBoundingClientRect().top;
    for (var g = 0; g < 12; g++) {
      var next = row.nextElementSibling, prev = row.previousElementSibling;
      if (dy > h / 2 && next) box.insertBefore(row, next.nextSibling);
      else if (dy < -h / 2 && prev) box.insertBefore(row, prev);
      else break;
      dy = desired - row.getBoundingClientRect().top;
    }
    drag.dy = dy;
    drag.body.style.transform = "translateY(" + dy + "px)";
  }
  function endDrag() {
    var row = drag.row;
    row._body.style.transform = "";
    row._body.classList.remove("lift");
    document.body.classList.remove("dragging");
    drag = null;
    suppressUntil = Date.now() + 500;
    var order = [].map.call(box.children, function (el) { return el._r; });
    var changed = order.some(function (r, i) { return r !== state.rows[i]; });
    if (changed) { state.rows = order; save(); }       // 页面上已经是新顺序，不用重建，键盘/光标不受影响
  }

  // 触摸（手机）
  box.addEventListener("touchstart", function (e) {
    lastTouch = Date.now();
    if (e.touches.length !== 1) { cancelPress(); return; }
    var row = e.target.closest ? e.target.closest(".row") : null;
    if (!row || (e.target.closest && e.target.closest(".rn")) || e.target === document.activeElement) return;   // 序号列、正在编辑的输入框不参与拖动
    var t = e.touches[0];
    startPress(row, t.clientX, t.clientY);
  }, { passive: true });
  box.addEventListener("touchmove", function (e) {
    lastTouch = Date.now();
    var t = e.touches[0];
    if (drag) { if (e.cancelable) e.preventDefault(); moveDrag(t.clientY); return; }
    if (press && (Math.abs(t.clientX - press.x) > SLOP || Math.abs(t.clientY - press.y) > SLOP)) cancelPress();
  }, { passive: false });
  function endTouch(e) {
    lastTouch = Date.now();
    if (drag) {
      if (e.cancelable) e.preventDefault();      // 不要再触发点击/弹出键盘
      endDrag();
    }
    cancelPress();
  }
  box.addEventListener("touchend", endTouch);
  box.addEventListener("touchcancel", endTouch);
  box.addEventListener("contextmenu", function (e) {
    if (drag || press) e.preventDefault();
  });

  // 鼠标（电脑）
  box.addEventListener("mousedown", function (e) {
    if (Date.now() - lastTouch < 800 || e.button !== 0) return;
    var row = e.target.closest ? e.target.closest(".row") : null;
    if (!row || (e.target.closest && e.target.closest(".rn")) || e.target === document.activeElement) return;
    startPress(row, e.clientX, e.clientY);
  });
  document.addEventListener("mousemove", function (e) {
    if (Date.now() - lastTouch < 800) return;
    if (drag) { e.preventDefault(); moveDrag(e.clientY); return; }
    if (press && (Math.abs(e.clientX - press.x) > SLOP || Math.abs(e.clientY - press.y) > SLOP)) cancelPress();
  });
  document.addEventListener("mouseup", function () {
    if (Date.now() - lastTouch < 800) return;
    if (drag) endDrag();
    cancelPress();
  });

  // 拖动刚结束时，吞掉紧跟着的那一下点击
  box.addEventListener("click", function (e) {
    if (Date.now() < suppressUntil) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  // 点一下单元格 → 聚焦里面的输入框（这时才弹出键盘）
  box.addEventListener("click", function (e) {
    var cell = e.target;
    if (!cell || cell.tagName === "INPUT" || !cell.querySelector) return;
    if (!cell.parentNode || !cell.parentNode.classList.contains("body")) return;
    var inp = cell.querySelector("input");
    if (inp) inp.focus();
  });

  showToday();
  updateCalc();
  updateAllRem();

  // 跨天后自动刷新今日日期和剩余天数
  function checkDay() {
    if (todayIso() !== lastToday) { showToday(); updateAllRem(); }
  }
  setInterval(checkDay, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkDay(); });
})();
</script>
</body>
</html>
