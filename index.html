<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时历</title>
  <style>
    :root {
      --paper-bg: #eef3f1;
      --card-bg: #fcfbf7;
      --card-inner: #f2f6f5;
      --ink-main: #24343d;
      --ink-sub: #536973;
      --ink-light: #8799a2;
      --ocean-teal: #266f88;
      --sky-cyan: #3d98b5;
      --sky-soft: #e6f3f7;
      --jade-green: #2b8e5e;
      --jade-soft: #e6f4ec;
      --warm-amber: #d67624;
      --amber-soft: #fdf2e4;
      --sun-gold: #d9a441;
      --gold-dark: #b97524;
      --gold-border: #d2cbb7;
      --dark-border: #8fa3ad;
      --shadow: 0 10px 30px rgba(38, 111, 136, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Palatino Linotype", "Book Antiqua", Baskerville, Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
      background-color: var(--paper-bg);
      background-image:
        radial-gradient(rgba(61, 152, 181, 0.05) 1px, transparent 0),
        radial-gradient(circle at 12% 0%, rgba(98, 190, 212, 0.14), transparent 45%),
        radial-gradient(circle at 88% 100%, rgba(240, 178, 92, 0.12), transparent 45%);
      background-size: 28px 28px, 100% 100%, 100% 100%;
      color: var(--ink-main);
      line-height: 1.55;
      min-height: 100vh;
      padding: 12px 10px 26px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .scroll-frame {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--ocean-teal);
      padding: 0;
      box-shadow: var(--shadow);
      border-radius: 3px;
    }

    .scroll-inner {
      position: relative;
      padding: 4px 14px 14px;
      background: var(--card-bg);
    }

    .header {
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 2px;
      padding-bottom: 5px;
      border-bottom: 3px double var(--gold-border);
      margin-bottom: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-title h1 {
      font-size: 22px;
      color: var(--ocean-teal);
      letter-spacing: 3px;
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      min-width: 0;
    }

    .live-clock {
      font-size: 13px;
      color: var(--ink-sub);
      letter-spacing: 0.6px;
      padding: 3px 10px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      border-radius: 3px;
      white-space: nowrap;
    }

    .live-clock strong {
      color: var(--ocean-teal);
      font-size: 14px;
      margin-left: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* 寻城条左移缩窄 + 城市标签紧邻右侧单行展示 */
    .city-bar {
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-start;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      background: var(--card-inner);
      padding: 6px 10px;
      border: 1px solid var(--gold-border);
      border-radius: 3px;
    }

    .city-search-wrap {
      position: relative;
      display: flex;
      gap: 5px;
      width: 184px;
      flex-shrink: 0;
    }

    .city-search-wrap input {
      flex: 1;
      min-width: 0;
      padding: 4px 8px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid var(--dark-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 3px;
      outline: none;
    }

    .city-search-wrap input:focus {
      border-color: var(--sky-cyan);
    }

    .btn-classic {
      padding: 4px 11px;
      font-size: 13px;
      font-family: inherit;
      background: var(--ocean-teal);
      color: #fcfbf7;
      border: 1px solid var(--ocean-teal);
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-classic:hover {
      background: var(--warm-amber);
      border-color: var(--warm-amber);
    }

    .city-tabs {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .city-tabs::-webkit-scrollbar {
      display: none;
    }

    .city-tab {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      font-size: 13.5px;
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .city-tab:hover {
      border-color: var(--sky-cyan);
      color: var(--ocean-teal);
      background: var(--sky-soft);
    }

    .city-tab.active {
      background: var(--ocean-teal);
      color: #fcfbf7;
      border-color: var(--ocean-teal);
      box-shadow: inset 0 0 0 1px rgba(243, 198, 99, 0.55);
    }

    .city-tab .remove-city {
      font-size: 13px;
      opacity: 0.7;
      line-height: 1;
      padding: 0 2px;
    }

    .city-tab .remove-city:hover {
      opacity: 1;
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 250px;
      background: var(--card-bg);
      border: 1px solid var(--ocean-teal);
      box-shadow: var(--shadow);
      z-index: 100;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      border-radius: 3px;
    }

    .search-dropdown.show {
      display: block;
    }

    .search-item {
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid var(--gold-border);
      font-size: 13.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background: var(--sky-soft);
      color: var(--ocean-teal);
    }

    .search-item small {
      color: var(--ink-light);
      font-size: 11.5px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.04fr 0.96fr;
      gap: 11px;
      align-items: start;
    }

    .main-col-left,
    .main-col-right {
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
    }

    .panel {
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      padding: 10px 13px;
      border-radius: 3px;
      box-shadow: 0 2px 10px rgba(38, 111, 136, 0.03);
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: var(--ocean-teal);
      padding-bottom: 5px;
      margin-bottom: 8px;
      border-bottom: 2px double var(--gold-border);
      letter-spacing: 1.8px;
    }

    .panel-title-deco::before {
      content: "✦ ";
      color: var(--warm-amber);
      font-size: 13px;
      margin-right: 4px;
    }

    .progress-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 14px;
    }

    .progress-title {
      font-weight: bold;
      color: var(--ocean-teal);
      letter-spacing: 0.8px;
    }

    .progress-meta {
      color: var(--ink-sub);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .month-sunday-row {
      display: grid;
      gap: 2px;
      width: 100%;
      padding: 0 3px;
      margin-top: 1px;
      margin-bottom: 1px;
      justify-items: center;
      align-items: center;
    }

    .month-sunday-cap {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: transparent;
    }

    .month-sunday-cap.is-sunday {
      background: radial-gradient(circle at 35% 35%, #f9c663, #e68228);
      box-shadow: 0 1px 2px rgba(230, 130, 40, 0.32);
    }

    .month-sunday-cap.is-sunday.is-future {
      background: radial-gradient(circle at 35% 35%, #fbe0a3, #f0ac6b);
      opacity: 0.72;
    }

    .month-days-track {
      display: grid;
      gap: 2px;
      width: 100%;
      height: 14px;
      background: transparent;
      border: 1px solid var(--gold-border);
      border-radius: 3px;
      padding: 2px;
    }

    .month-day-cell {
      height: 100%;
      background: transparent;
      border: 1px solid rgba(155, 168, 174, 0.25);
      border-radius: 1.5px;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }

    .month-day-cell.is-filled {
      background: linear-gradient(180deg, #8fd4e4, #4ca7c0);
      border-color: rgba(38, 111, 136, 0.45);
    }

    .month-day-cell.is-current,
    .month-day-cell.is-filled.is-current {
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, #43c47e, #239055);
      border-color: #1d7a47;
      transform: scaleY(1.18);
      box-shadow: 0 0 0 1px #fcfbf7, 0 1px 4px rgba(35, 144, 85, 0.32);
    }

    .month-day-nums,
    .month-weekdays {
      display: grid;
      gap: 2px;
      width: 100%;
      padding: 0 3px;
    }

    .month-day-nums span,
    .month-weekdays span {
      position: relative;
      text-align: center;
      font-size: 10px;
      line-height: 1.25;
      color: var(--ink-sub);
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .month-day-nums span.is-future,
    .month-weekdays span.is-future {
      color: var(--ink-light);
    }

    .month-day-nums span.is-sunday,
    .month-weekdays span.is-sunday {
      color: #d66f19;
      font-weight: 700;
    }

    .month-day-nums span.is-sunday.is-future,
    .month-weekdays span.is-sunday.is-future {
      color: #e29148;
    }

    .month-day-nums span.is-current:not(.is-sunday),
    .month-weekdays span.is-current:not(.is-sunday) {
      color: var(--jade-green);
      font-weight: 700;
    }

    .month-day-nums span.is-week-end::after,
    .month-weekdays span.is-week-end::after {
      content: "";
      position: absolute;
      right: -1.5px;
      top: 0;
      bottom: -3px;
      border-right: 1px dashed rgba(214, 111, 25, 0.45);
      pointer-events: none;
    }

    .month-weekdays span.is-week-end::after {
      top: -2px;
      bottom: 0;
    }

    #yearProgressPanel .progress-title {
      color: #c96c1f;
    }

    .year-grid-track {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      width: 100%;
      height: 14px;
      background: transparent;
      border: 1px solid rgba(210, 203, 183, 0.9);
      border-radius: 3px;
      padding: 2px;
    }

    .year-grid-cell {
      height: 100%;
      background: transparent;
      border: 1px solid rgba(214, 118, 36, 0.22);
      border-radius: 1.5px;
      overflow: hidden;
      display: flex;
      justify-content: flex-start;
    }

    .year-grid-fill {
      height: 100%;
      background: linear-gradient(90deg, #f6ba6f, #e0822b);
      transition: width 0.35s ease;
    }

    .year-grid-labels {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      padding: 0 2px;
    }

    .year-grid-labels span {
      text-align: center;
      font-size: 11px;
      color: var(--ink-light);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .year-grid-labels span.is-passed {
      color: var(--ink-sub);
    }

    .year-grid-labels span.is-current {
      color: #c96c1f;
      font-weight: bold;
    }

    .year-season-labels {
      display: grid;
      grid-template-columns: 2fr 3fr 3fr 3fr 1fr;
      gap: 3px;
      padding: 0 2px;
    }

    .year-season-labels span {
      text-align: center;
      font-size: 11px;
      color: var(--ink-light);
      line-height: 1.25;
      border-top: 1px solid rgba(210, 203, 183, 0.75);
      padding-top: 2px;
      white-space: nowrap;
    }

    .year-season-labels span + span {
      border-left: 1px dashed rgba(210, 203, 183, 0.85);
    }

    .year-season-labels span.is-current {
      font-weight: bold;
    }

    .year-season-labels span.season-spring.is-current {
      color: #55886c;
      border-top-color: #74a489;
    }

    .year-season-labels span.season-summer.is-current {
      color: #9c724b;
      border-top-color: #b88f68;
    }

    .year-season-labels span.season-autumn.is-current {
      color: #c96c1f;
      border-top-color: #e0822b;
    }

    .year-season-labels span.season-winter.is-current {
      color: #5c8190;
      border-top-color: #7c9fad;
    }

    .cal-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cal-btn {
      padding: 2px 9px;
      font-size: 12px;
      font-family: inherit;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      color: var(--ink-main);
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.15s;
    }

    .cal-btn:hover {
      border-color: var(--sky-cyan);
      color: var(--ocean-teal);
      background: var(--sky-soft);
    }

    .cal-weekdays, .cal-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 3px;
    }

    .cal-weekdays div {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: var(--ink-sub);
      padding: 3px 0;
      border-bottom: 1px solid var(--gold-border);
      margin-bottom: 2px;
    }

    .cal-weekdays div.weekend {
      color: #e29148;
    }

    .cal-cell {
      min-width: 0;
      min-height: 45px;
      padding: 5px 2px 3px;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      overflow: hidden;
      transition: all 0.15s;
    }

    .cal-cell:hover {
      background: var(--sky-soft);
      border-color: rgba(61, 152, 181, 0.35);
    }

    .cal-cell.other-month {
      opacity: 0.35;
    }

    .cal-cell.selected {
      border: 1.5px solid var(--jade-green);
      background: var(--jade-soft);
      box-shadow: inset 0 0 0 1px rgba(43, 142, 94, 0.18);
    }

    .cal-cell.today {
      background: var(--ocean-teal);
      color: #fcfbf7;
      border-color: var(--sun-gold);
      box-shadow: inset 0 0 0 1px rgba(252, 251, 247, 0.25);
    }

    .cal-cell.today .cal-lunar {
      color: rgba(252, 251, 247, 0.9);
    }

    .cal-solar {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.14;
      font-variant-numeric: lining-nums;
    }

    .cal-cell.is-weekend:not(.today) .cal-solar {
      color: #e29148;
    }

    .cal-cell.is-statutory-day:not(.today) .cal-solar {
      color: #c93b2b;
    }

    .cal-lunar {
      font-size: 10px;
      color: var(--ink-sub);
      margin-top: 2px;
      line-height: 1.18;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .cal-lunar.is-long {
      white-space: normal;
      font-size: 8.5px;
      line-height: 1.12;
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cal-lunar.is-extra-long {
      font-size: 8px;
      line-height: 1.08;
    }

    .cal-cell.is-weekend:not(.today) .cal-lunar:not(.is-statutory):not(.is-western):not(.is-traditional):not(.is-highlight) {
      color: #e29148;
    }

    .cal-cell:not(.today) .cal-lunar.is-statutory {
      background: #c93b2b;
      color: #fcfbf7;
      font-weight: bold;
      border-radius: 2px;
      padding: 1px 0;
      width: 3.8em;
      max-width: 100%;
      text-align: center;
      line-height: 1.25;
    }

    .cal-cell:not(.today) .cal-lunar.is-highlight,
    .cal-cell:not(.today) .cal-lunar.is-western,
    .cal-cell:not(.today) .cal-lunar.is-traditional {
      color: #2166c2;
      font-weight: bold;
    }

    /* 今日实况卡片 */
    .weather-now {
      min-height: 162px;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid rgba(61, 152, 181, 0.3);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity 0.2s ease;
    }

    .weather-now.is-loading {
      justify-content: center;
      align-items: center;
    }

    .is-refreshing {
      opacity: 0.58;
    }

    .weather-now-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .weather-left-info {
      flex: 0 0 182px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
    }

    .weather-head-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
    }

    .weather-city-block {
      min-width: 0;
      flex-shrink: 1;
    }

    .weather-city-name {
      font-size: 18px;
      font-weight: bold;
      color: var(--ocean-teal);
      line-height: 1.15;
    }

    .weather-city-sub {
      font-size: 11px;
      color: var(--ink-sub);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .weather-temp-wrap {
      text-align: right;
      flex-shrink: 0;
    }

    .weather-temp-main {
      font-size: 27px;
      font-weight: bold;
      color: var(--ocean-teal);
      line-height: 1.05;
      font-variant-numeric: lining-nums;
    }

    .weather-desc {
      font-size: 12px;
      color: var(--ink-main);
      margin-top: 1px;
      white-space: nowrap;
    }

    .weather-metrics-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      line-height: 1.3;
      color: var(--ink-sub);
      white-space: nowrap;
    }

    .weather-metrics-row strong {
      color: var(--ink-main);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-left: 2px;
    }

    /* 移至左侧的日出日落 / 月出月落时刻 */
    .astro-times-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      line-height: 1.3;
      color: var(--ink-sub);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .astro-times-line {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .astro-times-line strong {
      color: var(--ink-main);
      font-weight: 600;
      margin-left: 2px;
    }

    /* 右侧日月出落圆环区域：尽量最大化 */
    .weather-celestial-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .celestial-svg {
      width: 100%;
      max-width: 204px;
      height: auto;
      display: block;
      overflow: visible;
    }

    /* 四日对比（无顶部灰线） */
    .weather-four-days {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
      padding-top: 0;
    }

    .day-mini-card {
      border-radius: 3px;
      padding: 4px 3px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      min-width: 0;
    }

    .day-mini-card.is-muted {
      opacity: 0.52;
      background: transparent;
      border: 1px solid rgba(61, 152, 181, 0.14);
    }

    .day-mini-card.is-today {
      background: transparent;
      border: 1px solid #000;
    }

    .day-mini-label {
      font-size: 11px;
      color: var(--ink-sub);
      line-height: 1.2;
    }

    .day-mini-card.is-today .day-mini-label {
      color: var(--ocean-teal);
      font-weight: bold;
    }

    .day-mini-cond {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;

  <div class="container">

  <script>
    (function () {
      const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const WEEKDAY_CHARS = ['日', '一', '二', '三', '四', '五', '六'];
      const STATUTORY_FESTIVALS = new Set([
        '元旦节', '除夕', '春节', '清明', '劳动节', '端午节', '中秋节', '国庆节'
      ]);
      const WESTERN_FESTIVALS = new Set([
        '情人节', '愚人节', '母亲节', '父亲节',
        '万圣节前夜', '万圣节', '感恩节', '平安夜', '圣诞节'
      ]);
      const STORAGE_CITIES_KEY = 'suishi_saved_cities_v1';
      const STORAGE_ACTIVE_KEY = 'suishi_active_city_v1';
      const STORAGE_COUNTDOWN_KEY = 'suishi_countdown_v1';

      const DEFAULT_CITIES = [
        { id: '1816670', name: '北京', admin1: '北京市', country: '中国', latitude: 39.9075, longitude: 116.39723 },
        { id: '1796236', name: '上海', admin1: '上海市', country: '中国', latitude: 31.22222, longitude: 121.45806 },
        { id: '1808926', name: '杭州', admin1: '浙江省', country: '中国', latitude: 30.29365, longitude: 120.16142 }
      ];

      // 内嵌轻量级太阳/月亮位置与月相推演算法
      const SunCalcLite = (function () {
        const PI = Math.PI;
        const sin = Math.sin;
        const cos = Math.cos;
        const tan = Math.tan;
        const asin = Math.asin;
        const atan = Math.atan2;
        const acos = Math.acos;
        const rad = PI / 180;

        const dayMs = 86400000;
        const J1970 = 2440588;
        const J2000 = 2451545;
        const e = rad * 23.4397;

        function toJulian(date) { return date.valueOf() / dayMs - 0.5 + J1970; }
        function fromJulian(j) { return new Date((j + 0.5 - J1970) * dayMs); }
        function toDays(date) { return toJulian(date) - J2000; }

        function rightAscension(l, b) { return atan(sin(l) * cos(e) - tan(b) * sin(e), cos(l)); }
        function declination(l, b) { return asin(sin(b) * cos(e) + cos(b) * sin(e) * sin(l)); }
        function azimuth(H, phi, dec) { return atan(sin(H), cos(H) * sin(phi) - tan(dec) * cos(phi)); }
        function altitude(H, phi, dec) { return asin(sin(phi) * sin(dec) + cos(phi) * cos(dec) * cos(H)); }
        function siderealTime(d, lw) { return rad * (280.16 + 360.9856235 * d) - lw; }

        function solarMeanAnomaly(d) { return rad * (357.5291 + 0.98560028 * d); }
        function eclipticLongitude(M) {
          const C = rad * (1.9148 * sin(M) + 0.02 * sin(2 * M) + 0.0003 * sin(3 * M));
          const P = rad * 102.9372;
          return M + C + P + PI;
        }
        function sunCoords(d) {
          const M = solarMeanAnomaly(d);
          const L = eclipticLongitude(M);
          return { dec: declination(L, 0), ra: rightAscension(L, 0) };
        }

        function getSunPosition(date, lat, lng) {
          const lw = rad * -lng;
          const phi = rad * lat;
          const d = toDays(date);
          const c = sunCoords(d);
          const H = siderealTime(d, lw) - c.ra;
          return { azimuth: azimuth(H, phi, c.dec), altitude: altitude(H, phi, c.dec) };
        }

        const J0 = 0.0009;
        function julianCycle(d, lw) { return Math.round(d - J0 - lw / (2 * PI)); }
        function approxTransit(Ht, lw, n) { return J0 + (Ht + lw) / (2 * PI) + n; }
        function solarTransitJ(ds, M, L) { return J2000 + ds + 0.0053 * sin(M) - 0.0069 * sin(2 * L); }
        function hourAngle(h, phi, d) { return acos((sin(h) - sin(phi) * sin(d)) / (cos(phi) * cos(d))); }
        function getSetJ(h, lw, phi, dec, n, M, L) {
          const w = hourAngle(h, phi, dec);
          const a = approxTransit(w, lw, n);
          return solarTransitJ(a, M, L);
        }

        function getSunTimes(date, lat, lng) {
          const lw = rad * -lng;
          const phi = rad * lat;
          const d = toDays(date);
          const n = julianCycle(d, lw);
          const ds = approxTransit(0, lw, n);
          const M = solarMeanAnomaly(ds);
          const L = eclipticLongitude(M);
          const dec = declination(L, 0);
          const Jnoon = solarTransitJ(ds, M, L);
          const h0 = -0.833 * rad;
          const cosArg = (sin(h0) - sin(phi) * sin(dec)) / (cos(phi) * cos(dec));
          if (cosArg < -1 || cosArg > 1) {
            return { sunrise: null, sunset: null, solarNoon: fromJulian(Jnoon) };
          }
          const Jset = getSetJ(h0, lw, phi, dec, n, M, L);
          const Jrise = Jnoon - (Jset - Jnoon);
          return {
            sunrise: fromJulian(Jrise),
            sunset: fromJulian(Jset),
            solarNoon: fromJulian(Jnoon)
          };
        }

        function moonCoords(d) {
          const L = rad * (218.316 + 13.176396 * d);
          const M = rad * (134.963 + 13.064993 * d);
          const F = rad * (93.272 + 13.229350 * d);
          const l = L + rad * 6.289 * sin(M);
          const b = rad * 5.128 * sin(F);
          const dt = 385001 - 20905 * cos(M);
          return { ra: rightAscension(l, b), dec: declination(l, b), dist: dt };
        }

        function astroRefraction(h) {
          if (h < 0) h = 0;
          return 0.0002967 / Math.tan(h + 0.00312536 / (h + 0.08901179));
        }

        function getMoonPosition(date, lat, lng) {
          const lw = rad * -lng;
          const phi = rad * lat;
          const d = toDays(date);
          const c = moonCoords(d);
          const H = siderealTime(d, lw) - c.ra;
          let h = altitude(H, phi, c.dec);
          h = h + astroRefraction(h);
          return { azimuth: azimuth(H, phi, c.dec), altitude: h, distance: c.dist };
        }

        function getMoonIllumination(date) {
          const d = toDays(date);
          const s = sunCoords(d);
          const m = moonCoords(d);
          const sdist = 149598000;
          const phi = acos(sin(s.dec) * sin(m.dec) + cos(s.dec) * cos(m.dec) * cos(s.ra - m.ra));
          const inc = atan(sdist * sin(phi), m.dist - sdist * cos(phi));
          const angle = atan(
            cos(s.dec) * sin(s.ra - m.ra),
            sin(s.dec) * cos(m.dec) - cos(s.dec) * sin(m.dec) * cos(s.ra - m.ra)
          );
          return {
            fraction: (1 + cos(inc)) / 2,
            phase: 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / PI,
            angle: angle
          };
        }

        function hoursLater(tMs, h) {
          return new Date(tMs + h * 3600000);
        }

        function getMoonEvents(startMs, durationHours, lat, lng) {
          const hc = 0.133 * rad;
          let h0 = getMoonPosition(new Date(startMs), lat, lng).altitude - hc;
          const events = [];
          for (let i = 1; i <= durationHours; i += 2) {
            const h1 = getMoonPosition(hoursLater(startMs, i), lat, lng).altitude - hc;
            const h2 = getMoonPosition(hoursLater(startMs, i + 1), lat, lng).altitude - hc;
            const a = (h0 + h2) / 2 - h1;
            const b = (h2 - h0) / 2;
            const xe = -b / (2 * a);
            const ye = (a * xe + b) * xe + h1;
            const d = b * b - 4 * a * h1;
            let roots = 0;
            let x1 = 0, x2 = 0;
            if (d >= 0) {
              const dx = Math.sqrt(d) / (Math.abs(a) * 2);
              x1 = xe - dx;
              x2 = xe + dx;
              if (Math.abs(x1) <= 1) roots++;
              if (Math.abs(x2) <= 1) roots++;
              if (x1 < -1) x1 = x2;
            }
            if (roots === 1) {
              events.push({
                type: h0 < 0 ? 'rise' : 'set',
                time: hoursLater(startMs, i + x1).valueOf()
              });
            } else if (roots === 2) {
              const rTime = hoursLater(startMs, i + (ye < 0 ? x2 : x1)).valueOf();
              const sTime = hoursLater(startMs, i + (ye < 0 ? x1 : x2)).valueOf();
              if (rTime < sTime) {
                events.push({ type: 'rise', time: rTime }, { type: 'set', time: sTime });
              } else {
                events.push({ type: 'set', time: sTime }, { type: 'rise', time: rTime });
              }
            }
            h0 = h2;
          }
          events.sort((a, b) => a.time - b.time);
          return events;
        }

        return {
          getSunPosition,
          getSunTimes,
          getMoonPosition,
          getMoonIllumination,
          getMoonEvents
        };
      })();

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, function (m) {

        });

      function buildMonthProgressHtml(y, m, d) {
        const daysInMonth = new Date(y, m, 0).getDate();
        const remainMonthDays = daysInMonth - d;
        const monthPct = (d / daysInMonth) * 100;

        let sundayCapsHtml = '';
        let monthCellsHtml = '';
        let monthNumsHtml = '';
        let monthWeekdaysHtml = '';

        for (let dayIdx = 1; dayIdx <= daysInMonth; dayIdx++) {
          const dayOfWeek = new Date(y, m - 1, dayIdx).getDay();
          const weekdayChar = WEEKDAY_CHARS[dayOfWeek];
          const isFilled = dayIdx < d;
          const isCurrent = dayIdx === d;
          const isFuture = dayIdx > d;
          const isSunday = dayOfWeek === 0;
          const isWeekEnd = isSunday && dayIdx < daysInMonth;

          const capCls = [
            'month-sunday-cap',
            isSunday ? 'is-sunday' : '',
            isFuture ? 'is-future' : ''
          ].filter(Boolean).join(' ');

          const cellCls = [
            'month-day-cell',
            isFilled ? 'is-filled' : '',
            isCurrent ? 'is-current' : ''
          ].filter(Boolean).join(' ');

          const labelCls = [
            isFuture ? 'is-future' : '',
            isCurrent ? 'is-current' : '',
            isSunday ? 'is-sunday' : '',
            isWeekEnd ? 'is-week-end' : ''
          ].filter(Boolean).join(' ');

          sundayCapsHtml += `<div class="${capCls}" title="${isSunday ? `${m}月${dayIdx}日 周日` : ''}"></div>`;
          monthCellsHtml += `<div class="${cellCls}" title="${m}月${dayIdx}日 星期${weekdayChar}"></div>`;
          monthNumsHtml += `<span class="${labelCls}">${dayIdx}</span>`;
          monthWeekdaysHtml += `<span class="${labelCls}">${weekdayChar}</span>`;
        }

        return `
          <div class="progress-item">
            <div class="progress-header">
              <span class="progress-title">${m}月</span>
              <span class="progress-meta">剩 ${remainMonthDays} 天</span>
            </div>
            <div class="month-sunday-row" style="grid-template-columns: repeat(${daysInMonth}, 1fr);" aria-hidden="true">
              ${sundayCapsHtml}
            </div>
            <div class="month-days-track" style="grid-template-columns: repeat(${daysInMonth}, 1fr);" role="progressbar" aria-valuenow="${monthPct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100">
              ${monthCellsHtml}
            </div>
            <div class="month-day-nums" style="grid-template-columns: repeat(${daysInMonth}, 1fr);">
              ${monthNumsHtml}
            </div>
            <div class="month-weekdays" style="grid-template-columns: repeat(${daysInMonth}, 1fr);">
              ${monthWeekdaysHtml}
            </div>
          </div>
        `;
      }

      function buildYearProgressHtml(y, m, d) {
        const daysInMonth = new Date(y, m, 0).getDate();
        const isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
        const daysInYear = isLeap ? 366 : 365;
        const startOfYear = new Date(y, 0, 1);
        const dayOfYear = Math.floor((new Date(y, m - 1, d) - startOfYear) / 86400000) + 1;
        const remainYearDays = daysInYear - dayOfYear;
        const yearPct = (dayOfYear / daysInYear) * 100;

        let yearCellsHtml = '';
        let yearLabelsHtml = '';
        for (let monthIdx = 1; monthIdx <= 12; monthIdx++) {
          let cellPct = 0;
          if (monthIdx < m) {
            cellPct = 100;
          } else if (monthIdx === m) {
            cellPct = (d / daysInMonth) * 100;
          }
          const labelClass = monthIdx === m ? 'is-current' : (monthIdx < m ? 'is-passed' : '');
          yearCellsHtml += `<div class="year-grid-cell" title="${monthIdx}月"><div class="year-grid-fill" style="width: ${cellPct.toFixed(2)}%;"></div></div>`;
          yearLabelsHtml += `<span class="${labelClass}">${monthIdx}</span>`;
        }

        const seasonCls = {
          winEarly: m <= 2 ? 'is-current' : '',
          spring: m >= 3 && m <= 5 ? 'is-current' : '',
          summer: m >= 6 && m <= 8 ? 'is-current' : '',
          autumn: m >= 9 && m <= 11 ? 'is-current' : '',
          winLate: m === 12 ? 'is-current' : ''
        };

        return `
          <div class="progress-item">
            <div class="progress-header">
              <span class="progress-title">${y}年</span>
              <span class="progress-meta">剩 ${remainYearDays} 天</span>
            </div>
            <div class="year-grid-track" role="progressbar" aria-valuenow="${yearPct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100">
              ${yearCellsHtml}
            </div>
            <div class="year-grid-labels">
              ${yearLabelsHtml}
            </div>
            <div class="year-season-labels">
              <span class="season-winter ${seasonCls.winEarly}">冬季</span>
              <span class="season-spring ${seasonCls.spring}">春季</span>
              <span class="season-summer ${seasonCls.summer}">夏季</span>
              <span class="season-autumn ${seasonCls.autumn}">秋季</span>
              <span class="season-winter ${seasonCls.winLate}">冬</span>
            </div>
          </div>
        `;
      }

      function renderDateDetail(dateObj) {
        const monthBox = document.getElementById('monthProgressPanel');
        const yearBox = document.getElementById('yearProgressPanel');
        const backBtn = document.getElementById('backTodayBtn');

        const isToday =
          dateObj.getFullYear() === today.getFullYear() &&
          dateObj.getMonth() === today.getMonth() &&
          dateObj.getDate() === today.getDate();

        backBtn.style.display = isToday ? 'none' : 'inline-block';

        const m = dateObj.getMonth() + 1;
        const d = dateObj.getDate();

        monthBox.innerHTML = buildMonthProgressHtml(y, m, d);
        yearBox.innerHTML = buildYearProgressHtml(y, m, d);
      }

      function formatYmd(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function parseYmdLocal(dateStr) {
        if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return null;
        const p = dateStr.split('-');
        return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      }

      function getUpcomingFestivals() {
        const t = new Date();
        const todayMidnight = new Date(t.getFullYear(), t.getMonth(), t.getDate());
        const list = [];
        const seen = new Set();

        for (let offset = 0; offset <= 375; offset++) {
          const dt = new Date(todayMidnight.getFullYear(), todayMidnight.getMonth(), todayMidnight.getDate() + offset);
          const y = dt.getFullYear();
          const m = dt.getMonth() + 1;
          const d = dt.getDate();
          const ymd = formatYmd(dt);

          const addFest = name => {
            if (!seen.has(name)) {
              seen.add(name);
              list.push({ name, dateStr: ymd, monthDay: `${m}月${d}日`, diffDays: offset });
            }
          };

          if (m === 1 && d === 1) addFest('元旦');
          if (m === 5 && d === 1) addFest('劳动节');
          if (m === 10 && d === 1) addFest('国庆节');

          if (typeof Solar !== 'undefined') {
            const solar = Solar.fromYmd(y, m, d);
            const lunar = solar.getLunar();
            const jq = lunar.getJieQi();
            if (jq === '清明') addFest('清明');
            if (jq === '冬至') addFest('冬至');

            const nextDt = new Date(y, m - 1, d + 1);
            const nextLunar = Solar.fromYmd(nextDt.getFullYear(), nextDt.getMonth() + 1, nextDt.getDate()).getLunar();
            if (nextLunar.getMonth() === 1 && nextLunar.getDay() === 1) {
              addFest('除夕');
            }

            const lm = lunar.getMonth();
            const ld = lunar.getDay();
            if (lm === 1 && ld === 1) addFest('春节');
            if (lm === 1 && ld === 15) addFest('元宵');
            if (lm === 5 && ld === 5) addFest('端午');
            if (lm === 7 && ld === 7) addFest('七夕');
            if (lm === 8 && ld === 15) addFest('中秋');
            if (lm === 9 && ld === 9) addFest('重阳');
            if (lm === 12 && ld === 8) addFest('腊八');
          }
        }
        return list;
      }

      function renderCountdown() {
        const box = document.getElementById('countdownBox');
        if (!box) return;

        const t = new Date();
        const todayMidnight = new Date(t.getFullYear(), t.getMonth(), t.getDate());
        const festivals = getUpcomingFestivals();

        let targetName = '';
        let targetDateStr = '';

        if (countdownState.mode === 'custom' && countdownState.dateStr) {
          targetName = countdownState.name || '记事目标日';
          targetDateStr = countdownState.dateStr;
        } else if (countdownState.mode === 'festival' && countdownState.name) {
          const matched = festivals.find(f => f.name === countdownState.name);
          if (matched) {
            targetName = matched.name;
            targetDateStr = matched.dateStr;
          } else if (countdownState.dateStr) {
            targetName = countdownState.name;
            targetDateStr = countdownState.dateStr;
          }
        }

        if (!targetDateStr) {
          if (festivals.length > 0) {
            targetName = festivals[0].name;
            targetDateStr = festivals[0].dateStr;
          } else {
            const nextYear = new Date(t.getFullYear() + 1, 0, 1);
            targetName = '元旦';
            targetDateStr = formatYmd(nextYear);
          }
        }

        const targetDate = parseYmdLocal(targetDateStr) || todayMidnight;
        const diffDays = Math.round((targetDate - todayMidnight) / 86400000);
        const mdLabel = `${targetDate.getMonth() + 1}月${targetDate.getDate()}日`;

        let leftHtml = '';
        if (diffDays > 0) {
          leftHtml = `<div class="countdown-left">还剩 <strong>${diffDays}</strong> 天</div>`;
        } else if (diffDays === 0) {
          leftHtml = `<div class="countdown-left is-today">就是 <strong>今日</strong></div>`;
        } else {
          leftHtml = `<div class="countdown-left">已过 <strong>${Math.abs(diffDays)}</strong> 天</div>`;
        }

        const pillsHtml = festivals.map(f => {
          const isAct = countdownState.mode !== 'custom' && f.name === targetName;
          return `<button type="button" class="fest-pill${isAct ? ' active' : ''}" data-fest-name="${escapeHtml(f.name)}" data-fest-date="${f.dateStr}">${escapeHtml(f.name)} ${f.monthDay}</button>`;
        }).join('');

        box.innerHTML = `
          <div class="countdown-bar">
            ${leftHtml}
            <div class="countdown-right">
              <div class="countdown-note" title="${escapeHtml(targetName)}（${mdLabel}）">
                ${escapeHtml(targetName)}<span class="countdown-date-tag">${mdLabel}</span>
              </div>
              <button type="button" class="cal-btn" id="toggleCountdownBtn">${countdownEditorOpen ? '收起' : '记事'}</button>
            </div>
          </div>
          <div class="countdown-editor${countdownEditorOpen ? ' show' : ''}" id="countdownEditor">
            <div class="countdown-fest-pills">
              ${pillsHtml}
            </div>
            <div class="countdown-custom-row">
              <input type="text" id="countdownTextInput" maxlength="20" placeholder="可输入记事文字（仅存本地）" value="${countdownState.mode === 'custom' ? escapeHtml(countdownState.name) : ''}" />
              <input type="date" id="countdownDateInput" value="${targetDateStr}" />
              <button type="button" class="cal-btn" id="saveCountdownBtn">确定</button>
              <button type="button" class="cal-btn" id="autoCountdownBtn">自动最近</button>
            </div>
          </div>
        `;

        document.getElementById('toggleCountdownBtn').addEventListener('click', () => {
          countdownEditorOpen = !countdownEditorOpen;
          renderCountdown();
        });

        box.querySelectorAll('.fest-pill').forEach(btn => {
          btn.addEventListener('click', () => {
            saveCountdownState({
              mode: 'festival',
              name: btn.getAttribute('data-fest-name'),
              dateStr: btn.getAttribute('data-fest-date')
            });
            countdownEditorOpen = false;
            renderCountdown();
          });
        });

        document.getElementById('saveCountdownBtn').addEventListener('click', () => {
          const txt = document.getElementById('countdownTextInput').value.trim();
          const dt = document.getElementById('countdownDateInput').value;
          if (!dt) return;
          saveCountdownState({
            mode: 'custom',
            name: txt || '记事目标日',
            dateStr: dt
          });
          countdownEditorOpen = false;
          renderCountdown();
        });

        document.getElementById('autoCountdownBtn').addEventListener('click', () => {
          saveCountdownState({ mode: 'auto', name: '', dateStr: '' });
          countdownEditorOpen = false;
          renderCountdown();
        });
      }

      function renderCalendar(year, month) {
        document.getElementById('calMonthTitle').textContent = `${year}年 ${month}月`;
        const container = document.getElementById('calDays');
        container.innerHTML = '';

        const firstDayOfWeek = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

        const today = new Date();
        const totalCells = Math.ceil((firstDayOfWeek + daysInMonth) / 7) * 7;

        for (let i = 0; i < totalCells; i++) {
          let cellY = year;
          let cellM = month;
          let cellD;
          let isOther = false;

          if (i < firstDayOfWeek) {
            cellD = daysInPrevMonth - firstDayOfWeek + i + 1;
            cellM = month - 1;
            if (cellM < 1) { cellM = 12; cellY -= 1; }
            isOther = true;
          } else if (i >= firstDayOfWeek + daysInMonth) {
            cellD = i - (firstDayOfWeek + daysInMonth) + 1;
            cellM = month + 1;
            if (cellM > 12) { cellM = 1; cellY += 1; }
            isOther = true;
          } else {
            cellD = i - firstDayOfWeek + 1;
          }

          const cellDate = new Date(cellY, cellM - 1, cellD);
          const isToday =
            cellY === today.getFullYear() &&
            cellM === today.getMonth() + 1 &&
            cellD === today.getDate();
          const isSelected =
            cellY === selectedDate.getFullYear() &&
            cellM === selectedDate.getMonth() + 1 &&
            cellD === selectedDate.getDate();
          const isWeekend = cellDate.getDay() === 0 || cellDate.getDay() === 6;

          let lunarText = '';
          let lunarClass = '';

          if (typeof Solar !== 'undefined') {
            const solar = Solar.fromYmd(cellY, cellM, cellD);
            const lunar = solar.getLunar();
            const jq = lunar.getJieQi();
            const lunarFests = lunar.getFestivals();
            const solarFests = solar.getFestivals();
            const fests = [...lunarFests, ...solarFests];
            const statutoryHit = fests.find(f => STATUTORY_FESTIVALS.has(f)) || (STATUTORY_FESTIVALS.has(jq) ? jq : '');

            if (statutoryHit) {
              lunarText = statutoryHit;
              lunarClass = 'is-statutory';
            } else if (fests.length > 0) {
              lunarText = fests[0];
              if (WESTERN_FESTIVALS.has(lunarText)) {
                lunarClass = 'is-western';
              } else if (lunarFests.includes(lunarText)) {
                lunarClass = 'is-traditional';
              } else {
                lunarClass = 'is-highlight';
              }
            } else if (jq) {
              lunarText = jq;
              lunarClass = 'is-traditional';
            } else if (lunar.getDay() === 1) {
              lunarText = `${lunar.getMonthInChinese()}月`;
              lunarClass = 'is-highlight';
            } else {
              lunarText = lunar.getDayInChinese();
            }
          }

          const lunarLenClass = lunarText.length >= 9
            ? 'is-long is-extra-long'
            : (lunarText.length >= 5 ? 'is-long' : '');

          const cell = document.createElement('div');
          cell.className = 'cal-cell' +
            (isOther ? ' other-month' : '') +
            (isToday ? ' today' : '') +
            (isSelected && !isToday ? ' selected' : '') +
            (isWeekend ? ' is-weekend' : '') +
            (lunarClass === 'is-statutory' ? ' is-statutory-day' : '');

          cell.innerHTML = `
            <span class="cal-solar">${cellD}</span>
            <span class="cal-lunar ${lunarClass} ${lunarLenClass}">${escapeHtml(lunarText)}</span>
          `;

          cell.addEventListener('click', () => {
            selectedDate = new Date(cellY, cellM - 1, cellD);
            if (isOther) {
              viewYear = cellY;
              viewMonth = cellM;
            }
            renderDateDetail(selectedDate);
            renderCalendar(viewYear, viewMonth);
          });

          container.appendChild(cell);
        }
      }

      document.getElementById('prevMonthBtn').addEventListener('click', () => {
        viewMonth--;
        if (viewMonth < 1) { viewMonth = 12; viewYear--; }
        renderCalendar(viewYear, viewMonth);

      document.getElementById('nextMonthBtn').addEventListener('click', () => {

          95: { text: '雷阵雨', icon: '⛈️' },
          96: { text: '雷雨夹雹', icon: '⛈️' },
          99: { text: '强雷暴冰雹', icon: '⛈️' }
        };
        return map[code] || { text: '气象未知', icon: '🌡️' };
      }

      function formatCityHm(utcMs, offsetSec) {
        if (!Number.isFinite(utcMs)) return '--:--';
        const d = new Date(utcMs + offsetSec * 1000);
        const hh = String(d.getUTCHours()).padStart(2, '0');
        const mm = String(d.getUTCMinutes()).padStart(2, '0');
        return `${hh}:${mm}`;
      }

      function getCityLocalHours(utcMs, offsetSec) {
        const d = new Date(utcMs + offsetSec * 1000);
        return d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600;
      }

      // 24小时制圆环角度：12点在正上方(π/2)，18点在正右(0)，0点在正下(-π/2)，6点在正左(π)
      function timeTo24hAngle(hours24) {
        return Math.PI * (1.5 - hours24 / 12);
      }

      function isBodyAboveHorizon(nowMs, events, fallbackAbove) {
        let prev = null;
        for (let i = 0; i < events.length; i++) {
          if (events[i].time <= nowMs) {
            prev = events[i];
          } else {
            break;
          }
        }
        if (prev) return prev.type === 'rise';
        return fallbackAbove;
      }

      function getMoonPhaseName(phase) {
        if (phase < 0.03 || phase >= 0.97) return '新月';
        if (phase < 0.22) return '蛾眉月';
        if (phase < 0.28) return '上弦月';
        if (phase < 0.47) return '盈凸月';
        if (phase < 0.53) return '满月';
        if (phase < 0.72) return '亏凸月';
        if (phase < 0.78) return '下弦月';
        return '残月';
      }

      function buildMoonPhaseSvg(cx, cy, r, phase, fraction, isSouthernHemisphere) {
        const flipAttr = isSouthernHemisphere ? ' transform="scale(-1, 1)"' : '';
        let litPath = '';

        if (fraction >= 0.985) {
          litPath = `<circle cx="0" cy="0" r="${r}" fill="#e6eaee" stroke="#adb6be" stroke-width="0.55" />`;
        } else if (fraction > 0.015) {
          const rx = Math.max(0.01, Math.abs(Math.cos(phase * 2 * Math.PI)) * r);
          if (phase <= 0.5) {
            const termSweep = phase < 0.25 ? 0 : 1;
            litPath = `<path d="M 0 ${-r} A ${r} ${r} 0 0 1 0 ${r} A ${rx.toFixed(2)} ${r} 0 0 ${termSweep} 0 ${-r} Z" fill="#e6eaee" />`;
          } else {
            const termSweep = phase < 0.75 ? 0 : 1;
            litPath = `<path d="M 0 ${-r} A ${r} ${r} 0 0 0 0 ${r} A ${rx.toFixed(2)} ${r} 0 0 ${termSweep} 0 ${-r} Z" fill="#e6eaee" />`;
          }
        }

        return `
          <g transform="translate(${cx.toFixed(2)}, ${cy.toFixed(2)})">
            <g${flipAttr}>
              <circle cx="0" cy="0" r="${r}" fill="#7c8790" stroke="#5f6b74" stroke-width="0.6" />
              ${litPath}
              <circle cx="0" cy="0" r="${r}" fill="none" stroke="#626f78" stroke-width="0.55" opacity="0.65" />
            </g>
          </g>
        `;
      }

      // 计算天文数据（日出日落、月出月落、实时位置与月相）
      function computeCelestialState(city, offsetSec, fallbackSunriseStr, fallbackSunsetStr) {
        const lat = Number(city.latitude);
        const lng = Number(city.longitude);
        const nowMs = Date.now();
        const nowDate = new Date(nowMs);

        const shifted = new Date(nowMs + offsetSec * 1000);
        const cY = shifted.getUTCFullYear();
        const cM = shifted.getUTCMonth();
        const cD = shifted.getUTCDate();
        const dayStartMs = Date.UTC(cY, cM, cD, 0, 0, 0) - offsetSec * 1000;
        const dayEndMs = dayStartMs + 86400000;
        const dayNoonMs = dayStartMs + 43200000;

        const sunEvents = [];
        [-86400000, 0, 86400000].forEach(delta => {
          const st = SunCalcLite.getSunTimes(new Date(dayNoonMs + delta), lat, lng);
          if (st.sunrise) sunEvents.push({ type: 'rise', time: st.sunrise.valueOf() });
          if (st.sunset) sunEvents.push({ type: 'set', time: st.sunset.valueOf() });
        });
        sunEvents.sort((a, b) => a.time - b.time);

        const todaySunRise = sunEvents.find(e => e.type === 'rise' && e.time >= dayStartMs && e.time < dayEndMs);
        const todaySunSet = sunEvents.find(e => e.type === 'set' && e.time >= dayStartMs && e.time < dayEndMs);
        const sunriseLabel = todaySunRise ? formatCityHm(todaySunRise.time, offsetSec) : (fallbackSunriseStr || '--:--');
        const sunsetLabel = todaySunSet ? formatCityHm(todaySunSet.time, offsetSec) : (fallbackSunsetStr || '--:--');

        const moonEvents = SunCalcLite.getMoonEvents(dayStartMs - 86400000, 72, lat, lng);
        const todayMoonRise = moonEvents.find(e => e.type === 'rise' && e.time >= dayStartMs && e.time < dayEndMs);
        const todayMoonSet = moonEvents.find(e => e.type === 'set' && e.time >= dayStartMs && e.time < dayEndMs);
        const moonriseLabel = todayMoonRise ? formatCityHm(todayMoonRise.time, offsetSec) : '--:--';
        const moonsetLabel = todayMoonSet ? formatCityHm(todayMoonSet.time, offsetSec) : '--:--';

        const sunPos = SunCalcLite.getSunPosition(nowDate, lat, lng);
        const moonPos = SunCalcLite.getMoonPosition(nowDate, lat, lng);
        const moonIllum = SunCalcLite.getMoonIllumination(nowDate);

        const nowH = getCityLocalHours(nowMs, offsetSec);
        const isDaytime = isBodyAboveHorizon(nowMs, sunEvents, sunPos.altitude >= 0);
        const isMoonVisible = isBodyAboveHorizon(nowMs, moonEvents, moonPos.altitude >= 0);

        return {
          lat,
          nowMs,
          nowH,
          offsetSec,
          sunriseLabel,
          sunsetLabel,
          moonriseLabel,
          moonsetLabel,
          todaySunRise,
          todaySunSet,
          todayMoonRise,
          todayMoonSet,
          isDaytime,
          isMoonVisible,
          moonIllum
        };
      }

      // 构建右侧 24 小时制昼夜表盘圆环（带 6/12/18/0 表盘刻度 + 细指针精确指时 + 小巧精致太阳月亮）
      function buildCelestialSvg(state) {
        const cx = 82;
        const cy = 82;
        const R = 64;
        const sunR = 5.2;  // 精致太阳半径（仅覆盖约半小时弧度，不占满一两小时）
        const moonR = 3.9; // 比太阳小一号的月亮

        const nowAngle = timeTo24hAngle(state.nowH);

        // 确定日出/日落扇形角度
        let hRise = 6;
        let hSet = 18;
        if (state.todaySunRise && state.todaySunSet) {
          hRise = getCityLocalHours(state.todaySunRise.time, state.offsetSec);
          hSet = getCityLocalHours(state.todaySunSet.time, state.offsetSec);
        }
        const aRise = timeTo24hAngle(hRise);
        const aSet = timeTo24hAngle(hSet);

        const rx1 = cx + R * Math.cos(aRise);
        const ry1 = cy - R * Math.sin(aRise);
        const rx2 = cx + R * Math.cos(aSet);
        const ry2 = cy - R * Math.sin(aSet);
        const dayLargeArc = (hSet - hRise) > 12 ? 1 : 0;
        const nightLargeArc = (24 - (hSet - hRise)) > 12 ? 1 : 0;

        // 除去日照之外即月照扇形
        const moonSectorHtml = `
          <path d="M ${cx} ${cy} L ${rx2.toFixed(2)} ${ry2.toFixed(2)} A ${R} ${R} 0 ${nightLargeArc} 1 ${rx1.toFixed(2)} ${ry1.toFixed(2)} Z"
                fill="rgba(116, 138, 154, 0.14)" />
        `;

        // 日照淡橙色扇形（盖在最上层，重叠时依然保持纯净淡橙色）
        const daySectorHtml = `
          <path d="M ${cx} ${cy} L ${rx1.toFixed(2)} ${ry1.toFixed(2)} A ${R} ${R} 0 ${dayLargeArc} 1 ${rx2.toFixed(2)} ${ry2.toFixed(2)} Z"
                fill="#fcfbf7" />
          <path d="M ${cx} ${cy} L ${rx1.toFixed(2)} ${ry1.toFixed(2)} A ${R} ${R} 0 ${dayLargeArc} 1 ${rx2.toFixed(2)} ${ry2.toFixed(2)} Z"
                fill="rgba(255, 178, 66, 0.22)" />
        `;

        // 扇形两条虚线边（按日出日落角度设定）
        const sectorDashedLinesHtml = `
          <line x1="${cx}" y1="${cy}" x2="${rx1.toFixed(2)}" y2="${ry1.toFixed(2)}"
                stroke="#d68536" stroke-width="1.1" stroke-dasharray="3.2 2.6" opacity="0.82" />
          <line x1="${cx}" y1="${cy}" x2="${rx2.toFixed(2)}" y2="${ry2.toFixed(2)}"
                stroke="#d68536" stroke-width="1.1" stroke-dasharray="3.2 2.6" opacity="0.82" />
          <circle cx="${rx1.toFixed(2)}" cy="${ry1.toFixed(2)}" r="1.8" fill="#e68228" />
          <circle cx="${rx2.toFixed(2)}" cy="${ry2.toFixed(2)}" r="1.8" fill="#e68228" />
        `;

        // 表盘刻度：6/12/18/0 主刻度 + 每 2 小时细小辅助刻度
        let dialTicksHtml = '';
        for (let hr = 0; hr < 24; hr += 2) {
          const ang = timeTo24hAngle(hr);
          const isMajor = hr % 6 === 0;
          const rIn = isMajor ? R - 5.2 : R - 2.6;
          const rOut = isMajor ? R + 1.2 : R;
          const x1 = cx + rIn * Math.cos(ang);
          const y1 = cy - rIn * Math.sin(ang);
          const x2 = cx + rOut * Math.cos(ang);
          const y2 = cy - rOut * Math.sin(ang);
          dialTicksHtml += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${isMajor ? '#566b76' : '#96a7b0'}" stroke-width="${isMajor ? '1.5' : '0.9'}" stroke-linecap="round" />`;
        }

        // 月出/月落微点标记
        let moonMarkersHtml = '';
        if (state.todayMoonRise) {
          const a = timeTo24hAngle(getCityLocalHours(state.todayMoonRise.time, state.offsetSec));
          moonMarkersHtml += `<circle cx="${(cx + R * Math.cos(a)).toFixed(2)}" cy="${(cy - R * Math.sin(a)).toFixed(2)}" r="1.8" fill="#7c8790" opacity="0.85" />`;
        }
        if (state.todayMoonSet) {
          const a = timeTo24hAngle(getCityLocalHours(state.todayMoonSet.time, state.offsetSec));
          moonMarkersHtml += `<circle cx="${(cx + R * Math.cos(a)).toFixed(2)}" cy="${(cy - R * Math.sin(a)).toFixed(2)}" r="1.8" fill="#7c8790" opacity="0.85" />`;
        }

        // 细时间指针（从圆心指向精确当前时刻轨道落点，避免图标本身宽于单小时导致看不准分钟）
        const tipX = cx + R * Math.cos(nowAngle);
        const tipY = cy - R * Math.sin(nowAngle);
        const handColor = state.isDaytime ? 'rgba(225, 118, 22, 0.55)' : 'rgba(92, 116, 130, 0.45)';
        const timeNeedleHtml = `
          <line x1="${cx}" y1="${cy}" x2="${tipX.toFixed(2)}" y2="${tipY.toFixed(2)}"
                stroke="${handColor}" stroke-width="0.9" stroke-linecap="round" />
        `;

        // 计算太阳与月亮坐标：太阳居中于轨道 R，若月亮同时可见则置于内侧轨道(R - 11.5)防重叠
        const sunRadius = R;
        const moonRadius = R - 11.5;

        const sx = cx + sunRadius * Math.cos(nowAngle);
        const sy = cy - sunRadius * Math.sin(nowAngle);
        const mx = cx + moonRadius * Math.cos(nowAngle);
        const my = cy - moonRadius * Math.sin(nowAngle);

        const moonName = getMoonPhaseName(state.moonIllum.phase);
        const moonPct = Math.round(state.moonIllum.fraction * 100);
        const nowClockStr = formatCityHm(state.nowMs, state.offsetSec);
        const sunTitle = `太阳（当前 ${nowClockStr} · 日出 ${state.sunriseLabel} / 日落 ${state.sunsetLabel}）`;
        const moonTitle = `月亮：${moonName}（照明 ${moonPct}% · 月出 ${state.moonriseLabel} / 月落 ${state.moonsetLabel}）`;

        const sunElementHtml = state.isDaytime
          ? `
            <g>
              <title>${sunTitle}</title>
              <circle cx="${sx.toFixed(2)}" cy="${sy.toFixed(2)}" r="${sunR + 2.5}" fill="url(#sunHaloGrad)" />
              <circle cx="${sx.toFixed(2)}" cy="${sy.toFixed(2)}" r="${sunR}" fill="url(#sunBodyGrad)" stroke="#eb6b09" stroke-width="0.6" />
              <circle cx="${sx.toFixed(2)}" cy="${sy.toFixed(2)}" r="1.1" fill="#fff7d6" opacity="0.9" />
            </g>
          `
          : `
            <g opacity="0.4">
              <title>${sunTitle}（夜间在地平线下）</title>
              <circle cx="${sx.toFixed(2)}" cy="${sy.toFixed(2)}" r="${sunR - 0.5}" fill="#f7a03b" stroke="#d97014" stroke-width="0.7" stroke-dasharray="1.8 1.3" />
            </g>
          `;

        const moonElementHtml = state.isMoonVisible
          ? `
            <g>
              <title>${moonTitle}</title>
              ${buildMoonPhaseSvg(mx, my, moonR, state.moonIllum.phase, state.moonIllum.fraction, state.lat < 0)}
            </g>
          `
          : '';

        return `
          <svg class="celestial-svg" viewBox="0 0 164 164" role="img" aria-label="24小时制表盘日月出落实时演示">
            <defs>
              <radialGradient id="sunBodyGrad" cx="38%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ffe169" />
                <stop offset="60%" stop-color="#ff9914" />
                <stop offset="100%" stop-color="#f26b0a" />
              </radialGradient>
              <radialGradient id="sunHaloGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="rgba(255, 152, 24, 0.36)" />
                <stop offset="100%" stop-color="rgba(255, 152, 24, 0)" />
              </radialGradient>
            </defs>

            <!-- 月照扇形 + 淡橙色日照扇形 -->
            ${moonSectorHtml}
            ${daySectorHtml}

            <!-- 24小时制实线外圈 -->
            <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#7d909b" stroke-width="1.25" />

            <!-- 表盘刻度（6/12/18/0主刻度 + 2小时微刻度） -->
            ${dialTicksHtml}

            <!-- 日出/日落虚线扇形边界 -->
            ${sectorDashedLinesHtml}

            <!-- 24小时制数字刻度 -->
            <text x="${cx}" y="11" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6b7f8a">12</text>
            <text x="156" y="${cy + 3.2}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6b7f8a">18</text>
            <text x="${cx}" y="159.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6b7f8a">0</text>
            <text x="8" y="${cy + 3.2}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6b7f8a">6</text>

            <!-- 昼 / 夜 标识 -->
            <text x="${cx}" y="${cy - 10}" text-anchor="middle" font-size="12" font-weight="600" fill="#c96c1f" opacity="0.88">昼</text>
            <text x="${cx}" y="${cy + 18}" text-anchor="middle" font-size="12" font-weight="600" fill="#4f6570" opacity="0.88">夜</text>

            <!-- 精确时间指针细线 -->
            ${timeNeedleHtml}

            <!-- 圆心点 -->
            <circle cx="${cx}" cy="${cy}" r="2.2" fill="#566b76" />

            <!-- 月出/月落微点 -->
            ${moonMarkersHtml}

            <!-- 月亮（仅月出后至月落前显示） -->
            ${moonElementHtml}

            <!-- 太阳 -->
            ${sunElementHtml}
          </svg>
        `;
      }

      function refreshLiveCelestial() {
        if (!lastCelestialCtx) return;
        const stage = document.getElementById('celestialStage');
        const astroLeft = document.getElementById('astroTimesLeft');
        if (!stage) return;

        const cState = computeCelestialState(
          lastCelestialCtx.city,
          lastCelestialCtx.offsetSec,
          lastCelestialCtx.sunriseTime,
          lastCelestialCtx.sunsetTime
        );
        stage.innerHTML = buildCelestialSvg(cState);

        if (astroLeft) {
          const moonPhaseName = getMoonPhaseName(cState.moonIllum.phase);
          astroLeft.innerHTML = `
            <div class="astro-times-line">
              <span>日出<strong>${cState.sunriseLabel}</strong></span>
              <span>日落<strong>${cState.sunsetLabel}</strong></span>
            </div>
            <div class="astro-times-line" title="当前月相：${moonPhaseName}">
              <span>月出<strong>${cState.moonriseLabel}</strong></span>
              <span>月落<strong>${cState.moonsetLabel}</strong></span>
            </div>
          `;
        }
      }

      setInterval(refreshLiveCelestial, 30000);

      function renderCityTabs() {
        const container = document.getElementById('cityTabs');
        container.innerHTML = '';

        savedCities.forEach(city => {
          const isActive = String(city.id) === String(activeCityId);
          const btn = document.createElement('button');
          btn.className = 'city-tab' + (isActive ? ' active' : '');
          btn.innerHTML = `<span>${escapeHtml(city.name)}</span>`;

          if (savedCities.length > 1) {
            const del = document.createElement('span');
            del.className = 'remove-city';
            del.title = '移除此城市';
            del.textContent = '×';
            del.addEventListener('click', e => {
              e.stopPropagation();
              savedCities = savedCities.filter(c => String(c.id) !== String(city.id));
              if (String(activeCityId) === String(city.id)) {
                activeCityId = String(savedCities[0].id);
                fetchWeatherForActiveCity();
              }
              saveCities();
              renderCityTabs();
            });
            btn.appendChild(del);
          }

          btn.addEventListener('click', () => {
            activeCityId = String(city.id);
            saveCities();
            renderCityTabs();
            fetchWeatherForActiveCity();
          });

          container.appendChild(btn);
        });
      }

      async function fetchWeatherForActiveCity() {
        const city = savedCities.find(c => String(c.id) === String(activeCityId)) || savedCities[0];
        if (!city) return;

        const todayBox = document.getElementById('todayWeatherBox');
        const forecastBox = document.getElementById('forecastBox');
        const refreshBtn = document.getElementById('refreshWeatherBtn');

        if (refreshBtn) refreshBtn.textContent = '刷新中...';
        if (hasWeatherRendered) {
          todayBox.classList.add('is-refreshing');
          forecastBox.classList.add('is-refreshing');
        } else {
          todayBox.innerHTML = `<div class="weather-now is-loading"><div class="status-msg">正在获取气象数据（${escapeHtml(city.name)}）...</div></div>`;
          forecastBox.innerHTML = `<div class="status-msg">正在获取七日预报...</div>`;
        }

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(city.latitude)}&longitude=${encodeURIComponent(city.longitude)}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&past_days=1&forecast_days=8`;

        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('网络请求异常');
          const data = await res.json();

          const curr = data.current;
          const daily = data.daily;
          const wInfo = parseWeatherCode(curr.weather_code);
          const offsetSec = Number.isFinite(data.utc_offset_seconds)
            ? data.utc_offset_seconds
            : -new Date().getTimezoneOffset() * 60;

          const todayStr = curr.time ? curr.time.slice(0, 10) : '';
          let todayIdx = todayStr ? daily.time.indexOf(todayStr) : -1;
          if (todayIdx === -1) {
            todayIdx = daily.time.length >= 9 ? 1 : 0;
          }

          const sunriseTime = daily.sunrise && daily.sunrise[todayIdx] ? daily.sunrise[todayIdx].slice(11, 16) : '--:--';
          const sunsetTime = daily.sunset && daily.sunset[todayIdx] ? daily.sunset[todayIdx].slice(11, 16) : '--:--';
          const regionSub = [city.admin1, city.country].filter(Boolean).join(' · ');

          lastCelestialCtx = { city, offsetSec, sunriseTime, sunsetTime };
          const cState = computeCelestialState(city, offsetSec, sunriseTime, sunsetTime);
          const moonPhaseName = getMoonPhaseName(cState.moonIllum.phase);
          const celestialSvgHtml = buildCelestialSvg(cState);

          const fourDaysSpec = [
            { offset: -1, label: '昨日', isToday: false },
            { offset: 0,  label: '今日', isToday: true },
            { offset: 1,  label: '明日', isToday: false },
            { offset: 2,  label: '后日', isToday: false }
          ];

          let fourDaysHtml = '<div class="weather-four-days">';
          fourDaysSpec.forEach(item => {
            const idx = todayIdx + item.offset;
            const cls = item.isToday ? 'day-mini-card is-today' : 'day-mini-card is-muted';
            if (idx >= 0 && idx < daily.time.length) {
              const dInfo = parseWeatherCode(daily.weather_code[idx]);
              const dMin = Math.round(daily.temperature_2m_min[idx]);
              const dMax = Math.round(daily.temperature_2m_max[idx]);
              const tempHtml = item.isToday
                ? `<span class="temp-low">${dMin}°</span>~<span class="temp-high">${dMax}°</span>`
                : `${dMin}°~${dMax}°`;

              fourDaysHtml += `
                <div class="${cls}">
                  <div class="day-mini-label">${item.label}</div>
                  <div class="day-mini-cond">
                    <span>${dInfo.icon}</span>
                    <span class="day-mini-text">${dInfo.text}</span>
                  </div>
                  <div class="day-mini-temp">${tempHtml}</div>
                </div>
              `;
            } else {
              fourDaysHtml += `
                <div class="${cls}">
                  <div class="day-mini-label">${item.label}</div>
                  <div class="day-mini-cond"><span class="day-mini-text">暂无</span></div>
                  <div class="day-mini-temp">--</div>
                </div>
              `;
            }
          });
          fourDaysHtml += '</div>';

          todayBox.innerHTML = `
            <div class="weather-now">
              <div class="weather-now-main">
                <div class="weather-left-info">
                  <div class="weather-head-row">
                    <div class="weather-city-block">
                      <div class="weather-city-name">${escapeHtml(city.name)}</div>
                      <div class="weather-city-sub">${escapeHtml(regionSub)}</div>
                    </div>
                    <div class="weather-temp-wrap">
                      <div class="weather-temp-main">${Math.round(curr.temperature_2m)}°C</div>
                      <div class="weather-desc">${wInfo.icon} ${wInfo.text}</div>
                    </div>
                  </div>
                  <div class="weather-metrics-row">
                    <span>体感<strong>${Math.round(curr.apparent_temperature)}°C</strong></span>
                    <span>湿度<strong>${curr.relative_humidity_2m}%</strong></span>
                  </div>
                  <div class="astro-times-left" id="astroTimesLeft">
                    <div class="astro-times-line">
                      <span>日出<strong>${cState.sunriseLabel}</strong></span>
                      <span>日落<strong>${cState.sunsetLabel}</strong></span>
                    </div>
                    <div class="astro-times-line" title="当前月相：${moonPhaseName}">
                      <span>月出<strong>${cState.moonriseLabel}</strong></span>
                      <span>月落<strong>${cState.moonsetLabel}</strong></span>
                    </div>
                  </div>
                </div>
                <div class="weather-celestial-wrap" id="celestialStage" title="24小时制表盘昼夜与日月出落实时演示">
                  ${celestialSvgHtml}
                </div>
              </div>
              ${fourDaysHtml}
            </div>
          `;

          let rowsHtml = '<div class="forecast-list">';
          for (let offset = 1; offset <= 7; offset++) {
            const i = todayIdx + offset;
            if (i >= daily.time.length) break;

            const dateStr = daily.time[i];
            const parts = dateStr.split('-');
            const dObj = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            const wdLabel = offset === 1 ? '明日' : offset === 2 ? '后日' : WEEKDAYS[dObj.getDay()];
            const mdLabel = `${Number(parts[1])}月${Number(parts[2])}日`;
            const fInfo = parseWeatherCode(daily.weather_code[i]);
            const rainProb = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
            const tMin = Math.round(daily.temperature_2m_min[i]);
            const tMax = Math.round(daily.temperature_2m_max[i]);

            rowsHtml += `
              <div class="forecast-row">
                <div class="forecast-date">
                  <strong>${wdLabel}</strong>
                  <span>${mdLabel}</span>
                </div>
                <div class="forecast-cond">
                  <span>${fInfo.icon}</span>
                  <span>${fInfo.text}</span>
                </div>
                <div class="forecast-rain">
                  ${rainProb !== null && rainProb > 0 ? `💧${rainProb}%` : ''}
                </div>
                <div class="forecast-temp">
                  <span class="temp-low">${tMin}°</span> ~ <span class="temp-high">${tMax}°</span>
                </div>
              </div>
            `;
          }
          rowsHtml += '</div>';
          forecastBox.innerHTML = rowsHtml;
          hasWeatherRendered = true;

        } catch (err) {
          if (!hasWeatherRendered) {
            todayBox.innerHTML = `<div class="weather-now is-loading"><div class="status-msg">气象接口暂时无法连接，请稍后点击刷新。</div></div>`;
            forecastBox.innerHTML = `<div class="status-msg">暂无未来七日数据</div>`;
          }
        } finally {
          todayBox.classList.remove('is-refreshing');
          forecastBox.classList.remove('is-refreshing');
          if (refreshBtn) refreshBtn.textContent = '刷新';
        }
      }

      document.getElementById('refreshWeatherBtn').addEventListener('click', fetchWeatherForActiveCity);

      const cityInput = document.getElementById('cityInput');
      const dropdown = document.getElementById('searchDropdown');

      async function searchCity() {
        const rawQuery = cityInput.value.trim();
        if (!rawQuery) return;

        dropdown.innerHTML = '<div class="search-item">寻城中，请稍候...</div>';
        dropdown.classList.add('show');

        async function queryApi(q) {
          const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=zh&format=json`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('搜索失败');
          const json = await res.json();
          return json.results || [];
        }

        try {
          let results = await queryApi(rawQuery);
          if (results.length === 0 && /[市省县区]$/.test(rawQuery) && rawQuery.length > 2) {
            results = await queryApi(rawQuery.slice(0, -1));
          }

          if (results.length === 0) {
            dropdown.innerHTML = '<div class="search-item">未寻得此城，请尝试输入完整城市名（如“苏州”或拼音）</div>';
            return;
          }

          dropdown.innerHTML = '';
          results.forEach(item => {
            const div = document.createElement('div');
            div.className = 'search-item';
            const sub = [item.admin1, item.country].filter(Boolean).join(' · ');
            div.innerHTML = `<span><strong>${escapeHtml(item.name)}</strong></span><small>${escapeHtml(sub)}</small>`;
            div.addEventListener('click', () => {
              const newCity = {
                id: String(item.id),
                name: item.name,
                admin1: item.admin1 || '',
                country: item.country || '',
                latitude: item.latitude,
                longitude: item.longitude
              };
              if (!savedCities.some(c => String(c.id) === newCity.id)) {
                savedCities.push(newCity);
              }
              activeCityId = newCity.id;
              saveCities();
              renderCityTabs();
              fetchWeatherForActiveCity();
              dropdown.classList.remove('show');
              cityInput.value = '';
            });
            dropdown.appendChild(div);
          });
        } catch (e) {
          dropdown.innerHTML = '<div class="search-item">寻城受阻，请检查网络后重试</div>';
        }
      }

      document.getElementById('searchBtn').addEventListener('click', searchCity);
      cityInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') searchCity();
      });

      document.addEventListener('click', e => {
        if (!e.target.closest('.city-search-wrap')) {
          dropdown.classList.remove('show');
        }
      });

      function loadLunarAsync() {
        if (typeof Solar !== 'undefined') return;
        const urls = [
          'https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.8/lunar.min.js',
          'https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.8/lunar.min.js'
        ];
        let idx = 0;
        function tryLoad() {
          if (idx >= urls.length) return;
          const s = document.createElement('script');
          s.src = urls[idx++];
          s.async = true;
          s.onload = function () {
            renderCalendar(viewYear, viewMonth);
            renderCountdown();
          };
          s.onerror = tryLoad;
          document.body.appendChild(s);
        }
        tryLoad();
      }

      renderDateDetail(selectedDate);
      renderCalendar(viewYear, viewMonth);
      renderCityTabs();
      renderCountdown();
      fetchWeatherForActiveCity();
      loadLunarAsync();
    })();
  </script>
</body>
</html>
