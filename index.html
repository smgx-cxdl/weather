<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岁时历 · 观天晴雨录</title>
  <style>
    :root {
      --paper-bg: #f6f0e2;
      --card-bg: #fbf7ed;
      --card-inner: #f3ead7;
      --ink-main: #2a2420;
      --ink-sub: #6b5d4d;
      --ink-light: #968775;
      --cinnabar: #9e2a2b;      /* 朱砂红 */
      --cinnabar-soft: #f5e6e4;
      --jade: #2b6a58;          /* 石青绿 */
      --jade-soft: #e3efe9;
      --gold-border: #cbb692;
      --dark-border: #8b7355;
      --shadow: 0 6px 24px rgba(66, 48, 28, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
      background-color: var(--paper-bg);
      background-image:
        radial-gradient(rgba(158, 42, 43, 0.03) 1px, transparent 0),
        radial-gradient(rgba(107, 93, 77, 0.04) 1px, transparent 0);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: var(--ink-main);
      line-height: 1.6;
      min-height: 100vh;
      padding: 20px 16px 40px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    .scroll-frame {
      background: var(--card-bg);
      border: 2px solid var(--cinnabar);
      padding: 6px;
      box-shadow: var(--shadow);
      border-radius: 4px;
    }

    .scroll-inner {
      border: 1px solid var(--gold-border);
      padding: 22px 24px;
      background: var(--card-bg);
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 2px double var(--gold-border);
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .seal {
      width: 46px;
      height: 46px;
      background: var(--cinnabar);
      color: #fbf7ed;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      line-height: 1.1;
      padding: 4px;
      box-shadow: inset 0 0 0 2px rgba(251, 247, 237, 0.35);
      user-select: none;
      flex-shrink: 0;
    }

    .brand-title h1 {
      font-size: 24px;
      color: var(--cinnabar);
      letter-spacing: 3px;
      font-weight: 700;
    }

    .brand-title p {
      font-size: 13px;
      color: var(--ink-sub);
      letter-spacing: 1px;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .live-clock {
      font-size: 14px;
      color: var(--ink-sub);
      letter-spacing: 1px;
    }

    .live-clock strong {
      color: var(--cinnabar);
      font-size: 16px;
      margin-left: 6px;
    }

    .city-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      background: var(--card-inner);
      padding: 12px 16px;
      border: 1px solid var(--gold-border);
      border-radius: 4px;
    }

    .city-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .city-tabs-label {
      font-size: 13px;
      color: var(--ink-sub);
      margin-right: 4px;
    }

    .city-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      font-size: 14px;
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .city-tab:hover {
      border-color: var(--cinnabar);
      color: var(--cinnabar);
    }

    .city-tab.active {
      background: var(--cinnabar);
      color: #fbf7ed;
      border-color: var(--cinnabar);
    }

    .city-tab .remove-city {
      font-size: 14px;
      opacity: 0.65;
      line-height: 1;
      padding: 0 2px;
    }

    .city-tab .remove-city:hover {
      opacity: 1;
    }

    .city-search-wrap {
      position: relative;
      display: flex;
      gap: 6px;
      width: 280px;
      max-width: 100%;
    }

    .city-search-wrap input {
      flex: 1;
      padding: 6px 10px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--dark-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 3px;
      outline: none;
    }

    .city-search-wrap input:focus {
      border-color: var(--cinnabar);
    }

    .btn-traditional {
      padding: 6px 14px;
      font-size: 14px;
      font-family: inherit;
      background: var(--ink-main);
      color: #fbf7ed;
      border: 1px solid var(--ink-main);
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-traditional:hover {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--cinnabar);
      box-shadow: var(--shadow);
      z-index: 100;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      border-radius: 3px;
    }

    .search-dropdown.show {
      display: block;
    }

    .search-item {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px dashed var(--gold-border);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background: var(--cinnabar-soft);
      color: var(--cinnabar);
    }

    .search-item small {
      color: var(--ink-light);
      font-size: 12px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 22px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      padding: 18px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .panel:last-child {
      margin-bottom: 0;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 17px;
      font-weight: bold;
      color: var(--cinnabar);
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--gold-border);
      letter-spacing: 2px;
    }

    .date-hero {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      padding: 14px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      margin-bottom: 14px;
    }

    .date-day-box {
      text-align: center;
      padding: 8px 16px;
      border-right: 1px dashed var(--gold-border);
      min-width: 112px;
    }

    .date-ym {
      font-size: 13px;
      color: var(--ink-sub);
    }

    .date-day-num {
      font-size: 54px;
      font-weight: 700;
      line-height: 1.05;
      color: var(--cinnabar);
      margin: 2px 0;
    }

    .date-weekday {
      font-size: 15px;
      font-weight: bold;
      color: var(--ink-main);
    }

    .date-lunar-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lunar-main-date {
      font-size: 20px;
      font-weight: bold;
      color: var(--ink-main);
      letter-spacing: 1px;
    }

    .lunar-year-stat {
      font-size: 13px;
      color: var(--ink-sub);
    }

    .lunar-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .badge-red {
      display: inline-block;
      padding: 2px 8px;
      font-size: 12px;
      background: var(--cinnabar);
      color: #fbf7ed;
      border-radius: 2px;
    }

    .badge-outline {
      display: inline-block;
      padding: 2px 8px;
      font-size: 12px;
      border: 1px solid var(--cinnabar);
      color: var(--cinnabar);
      border-radius: 2px;
    }

    .jieqi-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .jieqi-col {
      padding: 10px 14px;
      border-radius: 3px;
      font-size: 13px;
    }

    .jieqi-col.prev {
      background: var(--jade-soft);
      border: 1px solid rgba(43, 106, 88, 0.25);
    }

    .jieqi-col.next {
      background: var(--cinnabar-soft);
      border: 1px solid rgba(158, 42, 43, 0.22);
    }

    .jieqi-label {
      font-size: 12px;
      color: var(--ink-sub);
    }

    .jieqi-name {
      font-size: 17px;
      font-weight: bold;
      margin: 2px 0;
    }

    .jieqi-col.prev .jieqi-name { color: var(--jade); }
    .jieqi-col.next .jieqi-name { color: var(--cinnabar); }

    .jieqi-meta {
      font-size: 12px;
      color: var(--ink-sub);
    }

    .cal-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cal-btn {
      padding: 3px 10px;
      font-size: 13px;
      font-family: inherit;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      color: var(--ink-main);
      cursor: pointer;
      border-radius: 3px;
    }

    .cal-btn:hover {
      border-color: var(--cinnabar);
      color: var(--cinnabar);
    }

    .cal-weekdays, .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-weekdays div {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      color: var(--ink-sub);
      padding: 6px 0;
      border-bottom: 1px dashed var(--gold-border);
      margin-bottom: 4px;
    }

    .cal-weekdays div.weekend {
      color: var(--cinnabar);
    }

    .cal-cell {
      min-height: 58px;
      padding: 6px 4px;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.15s;
    }

    .cal-cell:hover {
      background: var(--card-inner);
      border-color: var(--gold-border);
    }

    .cal-cell.other-month {
      opacity: 0.35;
    }

    .cal-cell.selected {
      border: 1.5px solid var(--ink-main);
      background: var(--card-inner);
    }

    .cal-cell.today {
      background: var(--cinnabar);
      color: #fbf7ed;
    }

    .cal-cell.today .cal-lunar {
      color: rgba(251, 247, 237, 0.9);
    }

    .cal-solar {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.2;
    }

    .cal-cell.is-weekend:not(.today) .cal-solar {
      color: var(--cinnabar);
    }

    .cal-lunar {
      font-size: 11px;
      color: var(--ink-sub);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .cal-cell:not(.today) .cal-lunar.is-highlight {
      color: var(--cinnabar);
      font-weight: bold;
    }

    .weather-now {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      margin-bottom: 14px;
      gap: 12px;
    }

    .weather-city-name {
      font-size: 20px;
      font-weight: bold;
      color: var(--ink-main);
    }

    .weather-city-sub {
      font-size: 12px;
      color: var(--ink-sub);
    }

    .weather-temp-wrap {
      text-align: right;
    }

    .weather-temp-main {
      font-size: 40px;
      font-weight: bold;
      color: var(--cinnabar);
      line-height: 1.1;
    }

    .weather-desc {
      font-size: 14px;
      color: var(--ink-main);
      margin-top: 2px;
    }

    .weather-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 6px;
    }

    .metric-item {
      background: var(--card-bg);
      border: 1px solid var(--gold-border);
      padding: 8px 6px;
      text-align: center;
      border-radius: 3px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--ink-light);
    }

    .metric-val {
      font-size: 14px;
      font-weight: bold;
      color: var(--ink-main);
      margin-top: 2px;
    }

    .forecast-list {
      display: flex;
      flex-direction: column;
    }

    .forecast-row {
      display: grid;
      grid-template-columns: 92px 1fr 56px 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 6px;
      border-bottom: 1px dashed var(--gold-border);
      font-size: 14px;
    }

    .forecast-row:last-child {
      border-bottom: none;
    }

    .forecast-date {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .forecast-date strong {
      font-size: 14px;
      color: var(--ink-main);
    }

    .forecast-date span {
      font-size: 11px;
      color: var(--ink-light);
    }

    .forecast-cond {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .forecast-rain {
      font-size: 12px;
      color: var(--jade);
      text-align: center;
    }

    .forecast-temp {
      text-align: right;
      font-weight: bold;
      white-space: nowrap;
    }

    .temp-low {
      color: var(--ink-sub);
      font-weight: normal;
    }

    .temp-high {
      color: var(--cinnabar);
    }

    .status-msg {
      padding: 20px;
      text-align: center;
      color: var(--ink-sub);
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--ink-light);
      letter-spacing: 1px;
    }

    @media (max-width: 860px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      .header-right {
        align-items: flex-start;
      }
      .scroll-inner {
        padding: 16px 14px;
      }
    }

    @media (max-width: 520px) {
      .date-hero {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .date-day-box {
        border-right: none;
        border-bottom: 1px dashed var(--gold-border);
        padding-bottom: 12px;
      }
      .lunar-badges {
        justify-content: center;
      }
      .jieqi-box {
        grid-template-columns: 1fr;
      }
      .weather-metrics {
        grid-template-columns: repeat(2, 1fr);
      }
      .forecast-row {
        grid-template-columns: 78px 1fr 44px 82px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="scroll-frame">
      <div class="scroll-inner">
        <header class="header">
          <div class="brand">
            <div class="seal">岁时<br>历书</div>
            <div class="brand-title">
              <h1>岁时历 · 观天晴雨录</h1>
              <p>公历月令 · 农历节气 · 今日实况 · 未来七日晴雨</p>
            </div>
          </div>
          <div class="header-right">
            <div class="live-clock" id="liveClock">加载时间中...</div>
          </div>
        </header>

        <section class="city-bar">
          <div class="city-tabs" id="cityTabs">
            <span class="city-tabs-label">所在城市：</span>
          </div>
          <div class="city-search-wrap">
            <input type="text" id="cityInput" placeholder="输入城市名添加（如：苏州、成都）" autocomplete="off" />
            <button class="btn-traditional" id="searchBtn">寻城</button>
            <div class="search-dropdown" id="searchDropdown"></div>
          </div>
        </section>

        <main class="main-grid">
          <div>
            <section class="panel">
              <div class="panel-title">
                <span>历法 · 岁时</span>
                <button class="cal-btn" id="backTodayBtn" style="display: none;">返回今日</button>
              </div>
              <div id="dateDetailContent">
                <div class="status-msg">正在推演历法...</div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span id="calMonthTitle">月历</span>
                <div class="cal-controls">
                  <button class="cal-btn" id="prevMonthBtn">上月</button>
                  <button class="cal-btn" id="currMonthBtn">本月</button>
                  <button class="cal-btn" id="nextMonthBtn">下月</button>
                </div>
              </div>
              <div class="cal-weekdays">
                <div class="weekend">日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div class="weekend">六</div>
              </div>
              <div class="cal-days" id="calDays"></div>
            </section>
          </div>

          <div>
            <section class="panel">
              <div class="panel-title">
                <span>气象 · 今日实况</span>
                <button class="cal-btn" id="refreshWeatherBtn">刷新</button>
              </div>
              <div id="todayWeatherBox">
                <div class="status-msg">正在获取气象数据...</div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span>未来七日晴雨</span>
                <span style="font-size: 12px; font-weight: normal; color: var(--ink-light);">含明日至第七日</span>
              </div>
              <div id="forecastBox">
                <div class="status-msg">正在获取七日预报...</div>
              </div>
            </section>
          </div>
        </main>

        <footer class="footer">
          历法与节气本地计算 · 气象数据源自 Open-Meteo 开源接口 · 点击月历任意日期可查看当日农历与节气详情
        </footer>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const STORAGE_CITIES_KEY = 'suishi_saved_cities_v1';
      const STORAGE_ACTIVE_KEY = 'suishi_active_city_v1';

      const DEFAULT_CITIES = [
        { id: '1816670', name: '北京', admin1: '北京市', country: '中国', latitude: 39.9075, longitude: 116.39723 },
        { id: '1796236', name: '上海', admin1: '上海市', country: '中国', latitude: 31.22222, longitude: 121.45806 },
        { id: '1808926', name: '杭州', admin1: '浙江省', country: '中国', latitude: 30.29365, longitude: 120.16142 }
      ];

      const now = new Date();
      let viewYear = now.getFullYear();
      let viewMonth = now.getMonth() + 1;
      let selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let lunarLoadFailed = false;

      let savedCities = loadCities();
      let activeCityId = loadActiveCityId(savedCities);

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, function (m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
      }

      function loadCities() {
        try {
          const raw = localStorage.getItem(STORAGE_CITIES_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return DEFAULT_CITIES.slice();
      }

      function saveCities() {
        try {
          localStorage.setItem(STORAGE_CITIES_KEY, JSON.stringify(savedCities));
          localStorage.setItem(STORAGE_ACTIVE_KEY, String(activeCityId));
        } catch (e) {}
      }

      function loadActiveCityId(cities) {
        try {
          const id = localStorage.getItem(STORAGE_ACTIVE_KEY);
          if (id && cities.some(c => String(c.id) === String(id))) return id;
        } catch (e) {}
        return String(cities[0].id);
      }

      function diffDaysFromSolar(baseDate, targetSolar) {
        const targetDate = new Date(targetSolar.getYear(), targetSolar.getMonth() - 1, targetSolar.getDay());
        const curDate = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
        return Math.round((targetDate - curDate) / 86400000);
      }

      function updateClock() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        const dateStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;
        const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        document.getElementById('liveClock').innerHTML = `${dateStr} <strong>${timeStr}</strong>`;
      }
      updateClock();
      setInterval(updateClock, 1000);

      function renderDateDetail(dateObj) {
        const box = document.getElementById('dateDetailContent');
        const backBtn = document.getElementById('backTodayBtn');
        const today = new Date();
        const isToday =
          dateObj.getFullYear() === today.getFullYear() &&
          dateObj.getMonth() === today.getMonth() &&
          dateObj.getDate() === today.getDate();

        backBtn.style.display = isToday ? 'none' : 'inline-block';

        const y = dateObj.getFullYear();
        const m = dateObj.getMonth() + 1;
        const d = dateObj.getDate();
        const wd = WEEKDAYS[dateObj.getDay()];

        const startOfYear = new Date(y, 0, 1);
        const dayOfYear = Math.floor((new Date(y, m - 1, d) - startOfYear) / 86400000) + 1;
        const weekOfYear = Math.ceil((dayOfYear + ((startOfYear.getDay() + 6) % 7)) / 7);

        if (typeof Solar === 'undefined') {
          box.innerHTML = `
            <div class="date-hero">
              <div class="date-day-box">
                <div class="date-ym">${y}年 ${m}月</div>
                <div class="date-day-num">${d}</div>
                <div class="date-weekday">${wd}</div>
              </div>
              <div class="date-lunar-info">
                <div class="lunar-main-date">${lunarLoadFailed ? '农历库加载受限（仅显示公历）' : '正在加载农历数据...'}</div>
                <div class="lunar-year-stat">${y}年第 ${dayOfYear} 天 · 第 ${weekOfYear} 周</div>
              </div>
            </div>
          `;
          return;
        }

        const solar = Solar.fromYmd(y, m, d);
        const lunar = solar.getLunar();

        const lunarYear = lunar.getYearInChinese();
        const lunarMonth = lunar.getMonthInChinese();
        const lunarDay = lunar.getDayInChinese();
        const jieQiToday = lunar.getJieQi();
        const festivals = [...lunar.getFestivals(), ...solar.getFestivals()];

        let badgesHtml = '';
        if (jieQiToday) badgesHtml += `<span class="badge-red">今日节气 · ${escapeHtml(jieQiToday)}</span>`;
        festivals.forEach(f => {
          badgesHtml += `<span class="badge-outline">${escapeHtml(f)}</span>`;
        });
        if (!badgesHtml) {
          badgesHtml = `<span class="badge-outline">${isToday ? '今日' : '选定日期'}</span>`;
        }

        const prevJQ = lunar.getPrevJieQi(true);
        let nextJQ = lunar.getNextJieQi(true);
        if (nextJQ && diffDaysFromSolar(dateObj, nextJQ.getSolar()) <= 0) {
          nextJQ = solar.next(1).getLunar().getNextJieQi(true);
        }

        let prevHtml = '<div class="jieqi-name">--</div><div class="jieqi-meta">暂无数据</div>';
        if (prevJQ) {
          const ps = prevJQ.getSolar();
          const diff = Math.abs(diffDaysFromSolar(dateObj, ps));
          const diffText = diff === 0 ? '正是今日' : `已过 ${diff} 天`;
          prevHtml = `
            <div class="jieqi-name">${escapeHtml(prevJQ.getName())}</div>
            <div class="jieqi-meta">${ps.getMonth()}月${ps.getDay()}日 · ${diffText}</div>
          `;
        }

        let nextHtml = '<div class="jieqi-name">--</div><div class="jieqi-meta">暂无数据</div>';
        if (nextJQ) {
          const ns = nextJQ.getSolar();
          const diff = diffDaysFromSolar(dateObj, ns);
          nextHtml = `
            <div class="jieqi-name">${escapeHtml(nextJQ.getName())}</div>
            <div class="jieqi-meta">${ns.getMonth()}月${ns.getDay()}日 · 还有 ${diff} 天</div>
          `;
        }

        box.innerHTML = `
          <div class="date-hero">
            <div class="date-day-box">
              <div class="date-ym">${y}年 ${m}月</div>
              <div class="date-day-num">${d}</div>
              <div class="date-weekday">${wd}</div>
            </div>
            <div class="date-lunar-info">
              <div class="lunar-main-date">农历 ${lunarMonth}月${lunarDay}</div>
              <div class="lunar-year-stat">农历${lunarYear}年 · 公历第 ${dayOfYear} 天 · 第 ${weekOfYear} 周</div>
              <div class="lunar-badges">${badgesHtml}</div>
            </div>
          </div>
          <div class="jieqi-box">
            <div class="jieqi-col prev">
              <div class="jieqi-label">${jieQiToday ? '当前节气' : '上一节气'}</div>
              ${prevHtml}
            </div>
            <div class="jieqi-col next">
              <div class="jieqi-label">下一节气</div>
              ${nextHtml}
            </div>
          </div>
        `;
      }

      function renderCalendar(year, month) {
        document.getElementById('calMonthTitle').textContent = `${year}年 ${month}月`;
        const container = document.getElementById('calDays');
        container.innerHTML = '';

        const firstDayOfWeek = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

        const today = new Date();
        const totalCells = Math.ceil((firstDayOfWeek + daysInMonth) / 7) * 7;

        for (let i = 0; i < totalCells; i++) {
          let cellY = year;
          let cellM = month;
          let cellD;
          let isOther = false;

          if (i < firstDayOfWeek) {
            cellD = daysInPrevMonth - firstDayOfWeek + i + 1;
            cellM = month - 1;
            if (cellM < 1) { cellM = 12; cellY -= 1; }
            isOther = true;
          } else if (i >= firstDayOfWeek + daysInMonth) {
            cellD = i - (firstDayOfWeek + daysInMonth) + 1;
            cellM = month + 1;
            if (cellM > 12) { cellM = 1; cellY += 1; }
            isOther = true;
          } else {
            cellD = i - firstDayOfWeek + 1;
          }

          const cellDate = new Date(cellY, cellM - 1, cellD);
          const isToday =
            cellY === today.getFullYear() &&
            cellM === today.getMonth() + 1 &&
            cellD === today.getDate();
          const isSelected =
            cellY === selectedDate.getFullYear() &&
            cellM === selectedDate.getMonth() + 1 &&
            cellD === selectedDate.getDate();
          const isWeekend = cellDate.getDay() === 0 || cellDate.getDay() === 6;

          let lunarText = '';
          let isHighlight = false;

          if (typeof Solar !== 'undefined') {
            const solar = Solar.fromYmd(cellY, cellM, cellD);
            const lunar = solar.getLunar();
            const jq = lunar.getJieQi();
            const fests = [...lunar.getFestivals(), ...solar.getFestivals()];

            if (fests.length > 0) {
              lunarText = fests[0];
              isHighlight = true;
            } else if (jq) {
              lunarText = jq;
              isHighlight = true;
            } else if (lunar.getDay() === 1) {
              lunarText = `${lunar.getMonthInChinese()}月`;
              isHighlight = true;
            } else {
              lunarText = lunar.getDayInChinese();
            }
          }

          const cell = document.createElement('div');
          cell.className = 'cal-cell' +
            (isOther ? ' other-month' : '') +
            (isToday ? ' today' : '') +
            (isSelected && !isToday ? ' selected' : '') +
            (isWeekend ? ' is-weekend' : '');

          cell.innerHTML = `
            <span class="cal-solar">${cellD}</span>
            <span class="cal-lunar ${isHighlight ? 'is-highlight' : ''}">${escapeHtml(lunarText)}</span>
          `;

          cell.addEventListener('click', () => {
            selectedDate = new Date(cellY, cellM - 1, cellD);
            if (isOther) {
              viewYear = cellY;
              viewMonth = cellM;
            }
            renderDateDetail(selectedDate);
            renderCalendar(viewYear, viewMonth);
          });

          container.appendChild(cell);
        }
      }

      document.getElementById('prevMonthBtn').addEventListener('click', () => {
        viewMonth--;
        if (viewMonth < 1) { viewMonth = 12; viewYear--; }
        renderCalendar(viewYear, viewMonth);
      });

      document.getElementById('nextMonthBtn').addEventListener('click', () => {
        viewMonth++;
        if (viewMonth > 12) { viewMonth = 1; viewYear++; }
        renderCalendar(viewYear, viewMonth);
      });

      document.getElementById('currMonthBtn').addEventListener('click', () => {
        const t = new Date();
        viewYear = t.getFullYear();
        viewMonth = t.getMonth() + 1;
        renderCalendar(viewYear, viewMonth);
      });

      document.getElementById('backTodayBtn').addEventListener('click', () => {
        const t = new Date();
        viewYear = t.getFullYear();
        viewMonth = t.getMonth() + 1;
        selectedDate = new Date(t.getFullYear(), t.getMonth(), t.getDate());
        renderDateDetail(selectedDate);
        renderCalendar(viewYear, viewMonth);
      });

      function parseWeatherCode(code) {
        const map = {
          0: { text: '晴朗', icon: '☀️' },
          1: { text: '晴间少云', icon: '🌤️' },
          2: { text: '多云', icon: '⛅' },
          3: { text: '阴天', icon: '☁️' },
          45: { text: '轻雾', icon: '🌫️' },
          48: { text: '霜雾', icon: '🌫️' },
          51: { text: '毛毛微雨', icon: '🌦️' },
          53: { text: '细雨', icon: '🌦️' },
          55: { text: '密雨', icon: '🌧️' },
          56: { text: '微冻雨', icon: '🌨️' },
          57: { text: '冻雨', icon: '🌨️' },
          61: { text: '小雨', icon: '🌦️' },
          63: { text: '中雨', icon: '🌧️' },
          65: { text: '大雨', icon: '🌧️' },
          66: { text: '冻雨', icon: '🌨️' },
          67: { text: '强冻雨', icon: '🌨️' },
          71: { text: '小雪', icon: '🌨️' },
          73: { text: '中雪', icon: '❄️' },
          75: { text: '大雪', icon: '❄️' },
          77: { text: '霰雪', icon: '❄️' },
          80: { text: '阵雨', icon: '🌦️' },
          81: { text: '强阵雨', icon: '🌧️' },
          82: { text: '暴雨', icon: '⛈️' },
          85: { text: '阵雪', icon: '🌨️' },
          86: { text: '强阵雪', icon: '❄️' },
          95: { text: '雷阵雨', icon: '⛈️' },
          96: { text: '雷雨夹雹', icon: '⛈️' },
          99: { text: '强雷暴冰雹', icon: '⛈️' }
        };
        return map[code] || { text: '气象未知', icon: '🌡️' };
      }

      function renderCityTabs() {
        const container = document.getElementById('cityTabs');
        container.innerHTML = '<span class="city-tabs-label">所在城市：</span>';

        savedCities.forEach(city => {
          const isActive = String(city.id) === String(activeCityId);
          const btn = document.createElement('button');
          btn.className = 'city-tab' + (isActive ? ' active' : '');
          btn.innerHTML = `<span>${escapeHtml(city.name)}</span>`;

          if (savedCities.length > 1) {
            const del = document.createElement('span');
            del.className = 'remove-city';
            del.title = '移除此城市';
            del.textContent = '×';
            del.addEventListener('click', e => {
              e.stopPropagation();
              savedCities = savedCities.filter(c => String(c.id) !== String(city.id));
              if (String(activeCityId) === String(city.id)) {
                activeCityId = String(savedCities[0].id);
                fetchWeatherForActiveCity();
              }
              saveCities();
              renderCityTabs();
            });
            btn.appendChild(del);
          }

          btn.addEventListener('click', () => {
            activeCityId = String(city.id);
            saveCities();
            renderCityTabs();
            fetchWeatherForActiveCity();
          });

          container.appendChild(btn);
        });
      }

      async function fetchWeatherForActiveCity() {
        const city = savedCities.find(c => String(c.id) === String(activeCityId)) || savedCities[0];
        if (!city) return;

        const todayBox = document.getElementById('todayWeatherBox');
        const forecastBox = document.getElementById('forecastBox');
        todayBox.innerHTML = `<div class="status-msg">正在获取气象数据（${escapeHtml(city.name)}）...</div>`;
        forecastBox.innerHTML = `<div class="status-msg">正在获取七日预报...</div>`;

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(city.latitude)}&longitude=${encodeURIComponent(city.longitude)}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&forecast_days=8`;

        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('网络请求异常');
          const data = await res.json();

          const curr = data.current;
          const daily = data.daily;
          const wInfo = parseWeatherCode(curr.weather_code);

          const sunriseTime = daily.sunrise && daily.sunrise[0] ? daily.sunrise[0].slice(11, 16) : '--:--';
          const sunsetTime = daily.sunset && daily.sunset[0] ? daily.sunset[0].slice(11, 16) : '--:--';
          const regionSub = [city.admin1, city.country].filter(Boolean).join(' · ');

          todayBox.innerHTML = `
            <div class="weather-now">
              <div>
                <div class="weather-city-name">${escapeHtml(city.name)}</div>
                <div class="weather-city-sub">${escapeHtml(regionSub)}</div>
                <div style="margin-top: 8px; font-size: 13px; color: var(--ink-sub);">
                  今日气温 ${Math.round(daily.temperature_2m_min[0])}° ~ ${Math.round(daily.temperature_2m_max[0])}°
                </div>
              </div>
              <div class="weather-temp-wrap">
                <div class="weather-temp-main">${Math.round(curr.temperature_2m)}°C</div>
                <div class="weather-desc">${wInfo.icon} ${wInfo.text}</div>
              </div>
            </div>
            <div class="weather-metrics">
              <div class="metric-item">
                <div class="metric-label">体感温度</div>
                <div class="metric-val">${Math.round(curr.apparent_temperature)}°C</div>
              </div>
              <div class="metric-item">
                <div class="metric-label">相对湿度</div>
                <div class="metric-val">${curr.relative_humidity_2m}%</div>
              </div>
              <div class="metric-item">
                <div class="metric-label">当前风速</div>
                <div class="metric-val">${curr.wind_speed_10m} km/h</div>
              </div>
              <div class="metric-item">
                <div class="metric-label">日出 / 日落</div>
                <div class="metric-val" style="font-size: 12px;">${sunriseTime} / ${sunsetTime}</div>
              </div>
            </div>
          `;

          let rowsHtml = '<div class="forecast-list">';
          const maxIndex = Math.min(7, daily.time.length - 1);
          for (let i = 1; i <= maxIndex; i++) {
            const dateStr = daily.time[i];
            const parts = dateStr.split('-');
            const dObj = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            const wdLabel = i === 1 ? '明日' : i === 2 ? '后日' : WEEKDAYS[dObj.getDay()];
            const mdLabel = `${Number(parts[1])}月${Number(parts[2])}日`;
            const fInfo = parseWeatherCode(daily.weather_code[i]);
            const rainProb = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
            const tMin = Math.round(daily.temperature_2m_min[i]);
            const tMax = Math.round(daily.temperature_2m_max[i]);

            rowsHtml += `
              <div class="forecast-row">
                <div class="forecast-date">
                  <strong>${wdLabel}</strong>
                  <span>${mdLabel}</span>
                </div>
                <div class="forecast-cond">
                  <span>${fInfo.icon}</span>
                  <span>${fInfo.text}</span>
                </div>
                <div class="forecast-rain">
                  ${rainProb !== null && rainProb > 0 ? `💧${rainProb}%` : ''}
                </div>
                <div class="forecast-temp">
                  <span class="temp-low">${tMin}°</span> ~ <span class="temp-high">${tMax}°</span>
                </div>
              </div>
            `;
          }
          rowsHtml += '</div>';
          forecastBox.innerHTML = rowsHtml;

        } catch (err) {
          todayBox.innerHTML = `<div class="status-msg">气象接口暂时无法连接，请稍后点击刷新。</div>`;
          forecastBox.innerHTML = `<div class="status-msg">暂无未来七日数据</div>`;
        }
      }

      document.getElementById('refreshWeatherBtn').addEventListener('click', fetchWeatherForActiveCity);

      const cityInput = document.getElementById('cityInput');
      const dropdown = document.getElementById('searchDropdown');

      async function searchCity() {
        const rawQuery = cityInput.value.trim();
        if (!rawQuery) return;

        dropdown.innerHTML = '<div class="search-item">寻城中，请稍候...</div>';
        dropdown.classList.add('show');

        async function queryApi(q) {
          const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=zh&format=json`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('搜索失败');
          const json = await res.json();
          return json.results || [];
        }

        try {
          let results = await queryApi(rawQuery);
          if (results.length === 0 && /[市省县区]$/.test(rawQuery) && rawQuery.length > 2) {
            results = await queryApi(rawQuery.slice(0, -1));
          }

          if (results.length === 0) {
            dropdown.innerHTML = '<div class="search-item">未寻得此城，请尝试输入完整城市名（如“苏州”或拼音）</div>';
            return;
          }

          dropdown.innerHTML = '';
          results.forEach(item => {
            const div = document.createElement('div');
            div.className = 'search-item';
            const sub = [item.admin1, item.country].filter(Boolean).join(' · ');
            div.innerHTML = `<span><strong>${escapeHtml(item.name)}</strong></span><small>${escapeHtml(sub)}</small>`;
            div.addEventListener('click', () => {
              const newCity = {
                id: String(item.id),
                name: item.name,
                admin1: item.admin1 || '',
                country: item.country || '',
                latitude: item.latitude,
                longitude: item.longitude
              };
              if (!savedCities.some(c => String(c.id) === newCity.id)) {
                savedCities.push(newCity);
              }
              activeCityId = newCity.id;
              saveCities();
              renderCityTabs();
              fetchWeatherForActiveCity();
              dropdown.classList.remove('show');
              cityInput.value = '';
            });
            dropdown.appendChild(div);
          });
        } catch (e) {
          dropdown.innerHTML = '<div class="search-item">寻城受阻，请检查网络后重试</div>';
        }
      }

      document.getElementById('searchBtn').addEventListener('click', searchCity);
      cityInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') searchCity();
      });

      document.addEventListener('click', e => {
        if (!e.target.closest('.city-search-wrap')) {
          dropdown.classList.remove('show');
        }
      });

      // 异步非阻塞加载农历库，彻底杜绝白屏
      function loadLunarAsync() {
        if (typeof Solar !== 'undefined') return;
        const urls = [
          'https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.8/lunar.min.js',
          'https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.8/lunar.min.js'
        ];
        let idx = 0;
        function tryLoad() {
          if (idx >= urls.length) {
            lunarLoadFailed = true;
            renderDateDetail(selectedDate);
            return;
          }
          const s = document.createElement('script');
          s.src = urls[idx++];
          s.async = true;
          s.onload = function () {
            renderDateDetail(selectedDate);
            renderCalendar(viewYear, viewMonth);
          };
          s.onerror = tryLoad;
          document.body.appendChild(s);
        }
        tryLoad();
      }

      renderDateDetail(selectedDate);
      renderCalendar(viewYear, viewMonth);
      renderCityTabs();
      fetchWeatherForActiveCity();
      loadLunarAsync();
    })();
  </script>
</body>
</html>
