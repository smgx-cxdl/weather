<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岁时历 · 观天晴雨录</title>
  <style>
    :root {
      --paper-bg: #efe9dc;
      --card-bg: #faf7f0;
      --card-inner: #f1ebdd;
      --ink-main: #222629;
      --ink-sub: #596066;
      --ink-light: #868b8e;
      --royal-navy: #1b365d;
      --navy-soft: #e7edf4;
      --forest-green: #2e5a4c;
      --forest-soft: #e5efe9;
      --antique-gold: #a68342;
      --gold-dark: #7d6028;
      --gold-border: #cbb994;
      --dark-border: #7a6a50;
      --shadow: 0 10px 30px rgba(27, 54, 93, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Palatino Linotype", "Book Antiqua", Baskerville, Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
      background-color: var(--paper-bg);
      background-image:
        radial-gradient(rgba(27, 54, 93, 0.04) 1px, transparent 0),
        linear-gradient(to bottom, rgba(166, 131, 66, 0.05), transparent 260px);
      background-size: 28px 28px, 100% 100%;
      color: var(--ink-main);
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px 16px 44px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    .scroll-frame {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--royal-navy);
      padding: 7px;
      box-shadow: var(--shadow);
      border-radius: 2px;
    }

    .scroll-inner {
      position: relative;
      border: 1px solid var(--antique-gold);
      padding: 24px 28px;
      background: var(--card-bg);
    }

    .corner-ornament {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--royal-navy);
      border-style: solid;
      pointer-events: none;
    }
    .corner-tl { top: 4px; left: 4px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 4px; right: 4px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 4px; left: 4px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 3px double var(--gold-border);
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .crest-medallion {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--royal-navy);
      border: 2px solid var(--antique-gold);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 2px rgba(250, 247, 240, 0.25), 0 2px 8px rgba(27, 54, 93, 0.18);
      flex-shrink: 0;
    }

    .brand-title h1 {
      font-size: 25px;
      color: var(--royal-navy);
      letter-spacing: 3px;
      font-weight: 700;
    }

    .brand-title p {
      font-size: 13px;
      color: var(--gold-dark);
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .live-clock {
      font-size: 14px;
      color: var(--ink-sub);
      letter-spacing: 0.8px;
      padding: 6px 14px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
    }

    .live-clock strong {
      color: var(--royal-navy);
      font-size: 16px;
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
    }

    .city-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      background: var(--card-inner);
      padding: 12px 16px;
      border: 1px solid var(--gold-border);
      border-radius: 2px;
    }

    .city-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .city-tabs-label {
      font-size: 13px;
      color: var(--ink-sub);
      margin-right: 4px;
      letter-spacing: 0.5px;
    }

    .city-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      font-size: 14px;
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .city-tab:hover {
      border-color: var(--royal-navy);
      color: var(--royal-navy);
    }

    .city-tab.active {
      background: var(--royal-navy);
