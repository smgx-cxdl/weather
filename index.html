<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岁时历 · 观天晴雨录</title>
  <style>
    :root {
      --paper-bg: #efe9dc;
      --card-bg: #faf7f0;
      --card-inner: #f1ebdd;
      --ink-main: #222629;
      --ink-sub: #596066;
      --ink-light: #868b8e;
      --royal-navy: #1b365d;
      --navy-soft: #e7edf4;
      --forest-green: #2e5a4c;
      --forest-soft: #e5efe9;
      --antique-gold: #a68342;
      --gold-dark: #7d6028;
      --gold-border: #cbb994;
      --dark-border: #7a6a50;
      --shadow: 0 10px 30px rgba(27, 54, 93, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Palatino Linotype", "Book Antiqua", Baskerville, Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
      background-color: var(--paper-bg);
      background-image:
        radial-gradient(rgba(27, 54, 93, 0.04) 1px, transparent 0),
        linear-gradient(to bottom, rgba(166, 131, 66, 0.05), transparent 260px);
      background-size: 28px 28px, 100% 100%;
      color: var(--ink-main);
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px 16px 44px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    .scroll-frame {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--royal-navy);
      padding: 7px;
      box-shadow: var(--shadow);
      border-radius: 2px;
    }

    .scroll-inner {
      position: relative;
      border: 1px solid var(--antique-gold);
      padding: 20px 26px;
      background: var(--card-bg);
    }

    .corner-ornament {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--royal-navy);
      border-style: solid;
      pointer-events: none;
    }
    .corner-tl { top: 4px; left: 4px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 4px; right: 4px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 4px; left: 4px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 3px double var(--gold-border);
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
    }

    .brand-title h1 {
      font-size: 24px;
      color: var(--royal-navy);
      letter-spacing: 3px;
      font-weight: 700;
      line-height: 1.25;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .live-clock {
      font-size: 14px;
      color: var(--ink-sub);
      letter-spacing: 0.8px;
      padding: 5px 12px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
    }

    .live-clock strong {
      color: var(--royal-navy);
      font-size: 15px;
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
    }

    .city-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: var(--card-inner);
      padding: 10px 14px;
      border: 1px solid var(--gold-border);
      border-radius: 2px;
    }

    .city-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .city-tabs-label {
      font-size: 13px;
      color: var(--ink-sub);
      margin-right: 4px;
      letter-spacing: 0.5px;
    }

    .city-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      font-size: 14px;
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .city-tab:hover {
      border-color: var(--royal-navy);
      color: var(--royal-navy);
    }

    .city-tab.active {
      background: var(--royal-navy);
      color: #faf7f0;
      border-color: var(--royal-navy);
      box-shadow: inset 0 0 0 1px rgba(166, 131, 66, 0.5);
    }

    .city-tab .remove-city {
      font-size: 14px;
      opacity: 0.65;
      line-height: 1;
      padding: 0 2px;
    }

    .city-tab .remove-city:hover {
      opacity: 1;
    }

    .city-search-wrap {
      position: relative;
      display: flex;
      gap: 6px;
      width: 290px;
      max-width: 100%;
    }

    .city-search-wrap input {
      flex: 1;
      padding: 5px 10px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--dark-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 2px;
      outline: none;
    }

    .city-search-wrap input:focus {
      border-color: var(--royal-navy);
    }

    .btn-classic {
      padding: 5px 14px;
      font-size: 14px;
      font-family: inherit;
      background: var(--royal-navy);
      color: #faf7f0;
      border: 1px solid var(--royal-navy);
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-classic:hover {
      background: var(--gold-dark);
      border-color: var(--gold-dark);
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--royal-navy);
      box-shadow: var(--shadow);
      z-index: 100;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      border-radius: 2px;
    }

    .search-dropdown.show {
      display: block;
    }

    .search-item {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--gold-border);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background: var(--navy-soft);
      color: var(--royal-navy);
    }

    .search-item small {
      color: var(--ink-light);
      font-size: 12px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      padding: 14px 18px;
      border-radius: 2px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(27, 54, 93, 0.03);
    }

    .panel:last-child {
      margin-bottom: 0;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: var(--royal-navy);
      padding-bottom: 8px;
      margin-bottom: 12px;
      border-bottom: 2px double var(--gold-border);
      letter-spacing: 2px;
    }

    .panel-title-deco::before {
      content: "✦ ";
      color: var(--antique-gold);
      font-size: 13px;
      margin-right: 4px;
    }

    .progress-panel-box {
      display: flex;
      flex-direction: column;
      gap: 13px;
      padding: 12px 14px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
      margin-bottom: 10px;
    }

    .progress-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 13px;
    }

    .progress-title {
      font-weight: bold;
      color: var(--royal-navy);
      letter-spacing: 0.8px;
    }

    .progress-meta {
      color: var(--ink-sub);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .progress-meta strong {
      color: var(--royal-navy);
      margin-left: 6px;
    }

    /* 月份每日格子进度条（当月天数格 + 上中下旬） */
    .month-days-track {
      display: grid;
      gap: 2px;
      width: 100%;
      height: 13px;
      background: rgba(250, 247, 240, 0.85);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
      padding: 2px;
    }

    .month-day-cell {
      height: 100%;
      background: rgba(27, 54, 93, 0.12);
      border-radius: 1px;
      transition: background 0.25s ease;
    }

    .month-day-cell.is-filled {
      background: linear-gradient(180deg, #2b4c7e, var(--royal-navy));
    }

    .month-xun-labels {
      display: grid;
      padding: 0 2px;
    }

    .month-xun-labels span {
      text-align: center;
      font-size: 11px;
      color: var(--ink-light);
      line-height: 1.25;
      border-top: 1px solid rgba(203, 185, 148, 0.6);
      padding-top: 2px;
      letter-spacing: 1px;
    }

    .month-xun-labels span + span {
      border-left: 1px dashed rgba(203, 185, 148, 0.85);
    }

    .month-xun-labels span.is-passed {
      color: var(--ink-sub);
    }

    .month-xun-labels span.is-current {
      color: var(--royal-navy);
      font-weight: bold;
      border-top-color: var(--royal-navy);
    }

    /* 年份 12 格进度条 + 月份 + 季节 */
    .year-grid-track {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      width: 100%;
      height: 13px;
      background: rgba(250, 247, 240, 0.85);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
      padding: 2px;
    }

    .year-grid-cell {
      height: 100%;
      background: rgba(166, 131, 66, 0.14);
      border-radius: 1px;
      overflow: hidden;
    }

    .year-grid-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dark), var(--antique-gold));
      transition: width 0.35s ease;
    }

    .year-grid-labels {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      padding: 0 2px;
    }

    .year-grid-labels span {
      text-align: center;
      font-size: 11px;
      color: var(--ink-light);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .year-grid-labels span.is-passed {
      color: var(--ink-sub);
    }

    .year-grid-labels span.is-current {
      color: var(--gold-dark);
      font-weight: bold;
    }

    .year-season-labels {
      display: grid;
      grid-template-columns: 2fr 3fr 3fr 3fr 1fr;
      gap: 3px;
      padding: 0 2px;
    }

    .year-season-labels span {
      text-align: center;
      font-size: 11px;
      color: var(--ink-light);
      line-height: 1.25;
      border-top: 1px solid rgba(203, 185, 148, 0.65);
      padding-top: 2px;
      white-space: nowrap;
    }

    .year-season-labels span + span {
      border-left: 1px dashed rgba(203, 185, 148, 0.8);
    }

    .year-season-labels span.is-current {
      color: var(--gold-dark);
      font-weight: bold;
      border-top-color: var(--antique-gold);
    }

    .jieqi-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .jieqi-col {
      padding: 9px 12px;
      border-radius: 2px;
      font-size: 13px;
    }

    .jieqi-col.prev {
      background: var(--forest-soft);
      border: 1px solid rgba(46, 90, 76, 0.28);
    }

    .jieqi-col.next {
      background: var(--navy-soft);
      border: 1px solid rgba(27, 54, 93, 0.24);
    }

    .jieqi-label {
      font-size: 11px;
      color: var(--ink-sub);
      letter-spacing: 0.5px;
    }

    .jieqi-name {
      font-size: 16px;
      font-weight: bold;
      margin: 1px 0;
    }

    .jieqi-col.prev .jieqi-name { color: var(--forest-green); }
    .jieqi-col.next .jieqi-name { color: var(--royal-navy); }

    .jieqi-meta {
      font-size: 11px;
      color: var(--ink-sub);
    }

    .cal-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cal-btn {
      padding: 2px 9px;
      font-size: 12px;
      font-family: inherit;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      color: var(--ink-main);
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
    }

    .cal-btn:hover {
      border-color: var(--royal-navy);
      color: var(--royal-navy);
      background: var(--navy-soft);
    }

    .cal-weekdays, .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .cal-weekdays div {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: var(--ink-sub);
      padding: 3px 0;
      border-bottom: 1px solid var(--gold-border);
      margin-bottom: 2px;
    }

    .cal-weekdays div.weekend {
      color: var(--gold-dark);
    }

    .cal-cell {
      min-height: 44px;
      padding: 3px 2px;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.15s;
    }

    .cal-cell:hover {
      background: var(--card-inner);
      border-color: var(--gold-border);
    }

    .cal-cell.other-month {
      opacity: 0.35;
    }

    .cal-cell.selected {
      border: 1.5px solid var(--antique-gold);
      background: var(--card-inner);
      box-shadow: inset 0 0 0 1px rgba(166, 131, 66, 0.25);
    }

    .cal-cell.today {
      background: var(--royal-navy);
      color: #faf7f0;
      border-color: var(--antique-gold);
      box-shadow: inset 0 0 0 1px rgba(250, 247, 240, 0.25);
    }

    .cal-cell.today .cal-lunar {
      color: rgba(250, 247, 240, 0.88);
    }

    .cal-solar {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.15;
      font-variant-numeric: lining-nums;
    }

    .cal-cell.is-weekend:not(.today) .cal-solar {
      color: var(--gold-dark);
    }

    .cal-lunar {
      font-size: 10px;
      color: var(--ink-sub);
      margin-top: 1px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .cal-cell:not(.today) .cal-lunar.is-highlight {
      color: var(--royal-navy);
      font-weight: bold;
    }

    .weather-now {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      margin-bottom: 14px;
      gap: 12px;
    }

    .weather-city-name {
      font-size: 20px;
      font-weight: bold;
      color: var(--royal-navy);
    }

    .weather-city-sub {
      font-size: 12px;
      color: var(--ink-sub);
    }

    .weather-temp-wrap {
      text-align: right;
    }

    .weather-temp-main {
      font-size: 40px;
      font-weight: bold;
      color: var(--royal-navy);
      line-height: 1.1;
      font-variant-numeric: lining-nums;
    }

    .weather-desc {
      font-size: 14px;
      color: var(--ink-main);
      margin-top: 2px;
    }

    .weather-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 4px;
    }

    .metric-item {
      background: var(--card-bg);
      border: 1px solid var(--gold-border);
      padding: 9px 6px;
      text-align: center;
      border-radius: 2px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--ink-light);
    }

    .metric-val {
      font-size: 14px;
      font-weight: bold;
      color: var(--ink-main);
      margin-top: 2px;
    }

    .weather-yesterday {
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .yesterday-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .yesterday-tag {
      display: inline-block;
      padding: 1px 7px;
      font-size: 11px;
      background: var(--royal-navy);
      color: #faf7f0;
      border-radius: 2px;
      letter-spacing: 0.5px;
    }

    .yesterday-date {
      color: var(--ink-sub);
      font-size: 12px;
    }

    .yesterday-cond {
      color: var(--ink-main);
      font-weight: bold;
    }

    .yesterday-precip {
      font-size: 12px;
      color: var(--forest-green);
    }

    .yesterday-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-variant-numeric: tabular-nums;
    }

    .yesterday-temp {
      font-weight: bold;
      color: var(--royal-navy);
    }

    .yesterday-diff {
      font-size: 12px;
      color: var(--gold-dark);
    }

    .forecast-list {
      display: flex;
      flex-direction: column;
    }

    .forecast-row {
      display: grid;
      grid-template-columns: 92px 1fr 56px 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 6px;
      border-bottom: 1px solid rgba(203, 185, 148, 0.55);
      font-size: 14px;
    }

    .forecast-row:last-child {
      border-bottom: none;
    }

    .forecast-date {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .forecast-date strong {
      font-size: 14px;
      color: var(--ink-main);
    }

    .forecast-date span {
      font-size: 11px;
      color: var(--ink-light);
    }

    .forecast-cond {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .forecast-rain {
      font-size: 12px;
      color: var(--forest-green);
      text-align: center;
    }

    .forecast-temp {
      text-align: right;
      font-weight: bold;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .temp-low {
      color: var(--ink-sub);
      font-weight: normal;
    }

    .temp-high {
      color: var(--royal-navy);
    }

    .status-msg {
      padding: 20px;
      text-align: center;
      color: var(--ink-sub);
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--gold-border);
      font-size: 12px;
      color: var(--ink-light);
      letter-spacing: 1px;
    }

    @media (max-width: 860px) {
      .main-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .header-right {
        align-items: flex-start;
      }
      .scroll-inner {
        padding: 16px 14px;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 8px 6px 24px;
      }
      .scroll-frame {
        padding: 4px;
      }
      .scroll-inner {
        padding: 12px 10px;
      }
      .corner-ornament {
        width: 12px;
        height: 12px;
      }
      .header {
        padding-bottom: 8px;
        margin-bottom: 10px;
        gap: 6px;
      }
      .brand-title h1 {
        font-size: 20px;
        letter-spacing: 2px;
      }
      .live-clock {
        font-size: 12px;
        padding: 4px 10px;
      }
      .live-clock strong {
        font-size: 14px;
      }
      .city-bar {
        padding: 8px 10px;
        margin-bottom: 10px;
        gap: 7px;
      }
      .panel {
        padding: 10px 10px;
        margin-bottom: 10px;
      }
      .panel-title {
        font-size: 15px;
        padding-bottom: 6px;
        margin-bottom: 8px;
        letter-spacing: 1px;
      }
      .progress-panel-box {
        padding: 9px 10px;
        gap: 10px;
        margin-bottom: 8px;
      }
      .progress-header {
        flex-wrap: wrap;
        gap: 1px 8px;
      }
      .month-days-track {
        gap: 1px;
        height: 12px;
        padding: 1.5px;
      }
      .year-grid-track,
      .year-grid-labels,
      .year-season-labels {
        gap: 2px;
      }
      .year-grid-track {
        height: 12px;
        padding: 1.5px;
      }
      .month-xun-labels span,
      .year-grid-labels span,
      .year-season-labels span {
        font-size: 10px;
      }
      .jieqi-box {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .jieqi-col {
        padding: 7px 10px;
      }
      .jieqi-label,
      .jieqi-meta {
        font-size: 11px;
      }
      .jieqi-name {
        font-size: 15px;
        margin: 1px 0;
      }
      .cal-btn {
        padding: 2px 7px;
        font-size: 12px;
      }
      .cal-weekdays, .cal-days {
        gap: 2px;
      }
      .cal-weekdays div {
        padding: 2px 0;
        font-size: 11px;
        margin-bottom: 2px;
      }
      .cal-cell {
        min-height: 38px;
        padding: 2px 1px;
      }
      .cal-solar {
        font-size: 14px;
        line-height: 1.1;
      }
      .cal-lunar {
        font-size: 9.5px;
        margin-top: 1px;
      }
      .weather-metrics {
        grid-template-columns: repeat(2, 1fr);
      }
      .forecast-row {
        grid-template-columns: 78px 1fr 44px 82px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="scroll-frame">
      <div class="scroll-inner">
        <div class="corner-ornament corner-tl"></div>
        <div class="corner-ornament corner-tr"></div>
        <div class="corner-ornament corner-bl"></div>
        <div class="corner-ornament corner-br"></div>

        <header class="header">
          <div class="brand">
            <div class="brand-title">
              <h1>岁时历 · 观天晴雨录</h1>
            </div>
          </div>
          <div class="header-right">
            <div class="live-clock" id="liveClock">加载时间中...</div>
          </div>
        </header>

        <section class="city-bar">
          <div class="city-tabs" id="cityTabs">
            <span class="city-tabs-label">观象城市：</span>
          </div>
          <div class="city-search-wrap">
            <input type="text" id="cityInput" placeholder="输入城市名添加（如：苏州、成都）" autocomplete="off" />
            <button class="btn-classic" id="searchBtn">寻城</button>
            <div class="search-dropdown" id="searchDropdown"></div>
          </div>
        </section>

        <main class="main-grid">
          <div>
            <section class="panel">
              <div id="dateDetailContent">
                <div class="status-msg">正在推演历法...</div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span class="panel-title-deco" id="calMonthTitle">月历</span>
                <div class="cal-controls">
                  <button class="cal-btn" id="backTodayBtn" style="display: none;">今日</button>
                  <button class="cal-btn" id="prevMonthBtn">上月</button>
                  <button class="cal-btn" id="currMonthBtn">本月</button>
                  <button class="cal-btn" id="nextMonthBtn">下月</button>
                </div>
              </div>
              <div class="cal-weekdays">
                <div class="weekend">日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div class="weekend">六</div>
              </div>
              <div class="cal-days" id="calDays"></div>
            </section>
          </div>

          <div>
            <section class="panel">
              <div class="panel-title">
                <span class="panel-title-deco">气象 · 今日实况</span>
                <button class="cal-btn" id="refreshWeatherBtn">刷新</button>
              </div>
              <div id="todayWeatherBox">
                <div class="status-msg">正在获取气象数据...</div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span class="panel-title-deco">未来七日晴雨</span>
                <span style="font-size: 12px; font-weight: normal; color: var(--ink-light); letter-spacing: 0;">明日至第七日</span>
              </div>
              <div id="forecastBox">
                <div class="status-msg">正在获取七日预报...</div>
              </div>
            </section>
          </div>
        </main>

        <footer class="footer">
          ✦ 中国农历与节气本地推演 · 气象数据源自 Open-Meteo 开源接口 · 点击月历任意日期可查当日农历与节气 ✦
        </footer>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const STORAGE_CITIES_KEY = 'suishi_saved_cities_v1';
      const STORAGE_ACTIVE_KEY = 'suishi_active_city_v1';

      const DEFAULT_CITIES = [
        { id: '1816670', name: '北京', admin1: '北京市', country: '中国', latitude: 39.9075, longitude: 116.39723 },
        { id: '1796236', name: '上海', admin1: '上海市', country: '中国', latitude: 31.22222, longitude: 121.45806 },
        { id: '1808926', name: '杭州', admin1: '浙江省', country: '中国', latitude: 30.29365, longitude: 120.16142 }
      ];

      const now = new Date();
      let viewYear = now.getFullYear();
      let viewMonth = now.getMonth() + 1;
      let selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let lunarLoadFailed = false;

      let savedCities = loadCities();
      let activeCityId = loadActiveCityId(savedCities);

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, function (m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
      }

      function loadCities() {
        try {
          const raw = localStorage.getItem(STORAGE_CITIES_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return DEFAULT_CITIES.slice();
      }

      function saveCities() {
        try {
          localStorage.setItem(STORAGE_CITIES_KEY, JSON.stringify(savedCities));
          localStorage.setItem(STORAGE_ACTIVE_KEY, String(activeCityId));
        } catch (e) {}
      }

      function loadActiveCityId(cities) {
        try {
          const id = localStorage.getItem(STORAGE_ACTIVE_KEY);
          if (id && cities.some(c => String(c.id) === String(id))) return id;
        } catch (e) {}
        return String(cities[0].id);
      }

      function diffDaysFromSolar(baseDate, targetSolar) {
        const targetDate = new Date(targetSolar.getYear(), targetSolar.getMonth() - 1, targetSolar.getDay());
        const curDate = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
        return Math.round((targetDate - curDate) / 86400000);
      }

      function updateClock() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        const dateStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;
        const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        document.getElementById('liveClock').innerHTML = `${dateStr} <strong>${timeStr}</strong>`;
      }
      updateClock();
      setInterval(updateClock, 1000);

      function buildProgressHtml(y, m, d) {
        const daysInMonth = new Date(y, m, 0).getDate();
        const remainMonthDays = daysInMonth - d;
        const monthPct = (d / daysInMonth) * 100;

        // 月份按当月天数生成格子（30/31/28/29格），下方标注上旬、中旬、下旬
        let monthCellsHtml = '';
        for (let dayIdx = 1; dayIdx <= daysInMonth; dayIdx++) {
          const filledClass = dayIdx <= d ? 'is-filled' : '';
          monthCellsHtml += `<div class="month-day-cell ${filledClass}" title="${m}月${dayIdx}日"></div>`;
        }

        const lateDays = daysInMonth - 20;
        const xunStatus = [
          d <= 10 ? 'is-current' : 'is-passed',
          d > 10 && d <= 20 ? 'is-current' : (d > 20 ? 'is-passed' : ''),
          d > 20 ? 'is-current' : ''
        ];

        // 年份 12 格（每格一月）+ 月份数字 + 季节
        const isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
        const daysInYear = isLeap ? 366 : 365;
        const startOfYear = new Date(y, 0, 1);
        const dayOfYear = Math.floor((new Date(y, m - 1, d) - startOfYear) / 86400000) + 1;
        const remainYearDays = daysInYear - dayOfYear;
        const yearPct = (dayOfYear / daysInYear) * 100;

        let yearCellsHtml = '';
        let yearLabelsHtml = '';
        for (let monthIdx = 1; monthIdx <= 12; monthIdx++) {
          let cellPct = 0;
          if (monthIdx < m) {
            cellPct = 100;
          } else if (monthIdx === m) {
            cellPct = (d / daysInMonth) * 100;
          }
          const labelClass = monthIdx === m ? 'is-current' : (monthIdx < m ? 'is-passed' : '');
          yearCellsHtml += `<div class="year-grid-cell" title="${monthIdx}月"><div class="year-grid-fill" style="width: ${cellPct.toFixed(2)}%;"></div></div>`;
          yearLabelsHtml += `<span class="${labelClass}">${monthIdx}</span>`;
        }

        const seasonCls = {
          winEarly: m <= 2 ? 'is-current' : '',
          spring: m >= 3 && m <= 5 ? 'is-current' : '',
          summer: m >= 6 && m <= 8 ? 'is-current' : '',
          autumn: m >= 9 && m <= 11 ? 'is-current' : '',
          winLate: m === 12 ? 'is-current' : ''
        };

        return `
          <div class="progress-panel-box">
            <div class="progress-item">
              <div class="progress-header">
                <span class="progress-title">月份进度（${m}月）</span>
                <span class="progress-meta">第 ${d} / ${daysInMonth} 天 · 剩 ${remainMonthDays} 天 <strong>${monthPct.toFixed(1)}%</strong></span>
              </div>
              <div class="month-days-track" style="grid-template-columns: repeat(${daysInMonth}, 1fr);" role="progressbar" aria-valuenow="${monthPct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100">
                ${monthCellsHtml}
              </div>
              <div class="month-xun-labels" style="grid-template-columns: 10fr 10fr ${lateDays}fr;">
                <span class="${xunStatus[0]}">上旬</span>
                <span class="${xunStatus[1]}">中旬</span>
                <span class="${xunStatus[2]}">下旬</span>
              </div>
            </div>
            <div class="progress-item">
              <div class="progress-header">
                <span class="progress-title">年份进度（${y}年）</span>
                <span class="progress-meta">第 ${dayOfYear} / ${daysInYear} 天 · 剩 ${remainYearDays} 天 <strong>${yearPct.toFixed(1)}%</strong></span>
              </div>
              <div class="year-grid-track" role="progressbar" aria-valuenow="${yearPct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100">
                ${yearCellsHtml}
              </div>
              <div class="year-grid-labels">
                ${yearLabelsHtml}
              </div>
              <div class="year-season-labels">
                <span class="${seasonCls.winEarly}">冬季</span>
                <span class="${seasonCls.spring}">春季</span>
                <span class="${seasonCls.summer}">夏季</span>
                <span class="${seasonCls.autumn}">秋季</span>
                <span class="${seasonCls.winLate}">冬</span>
              </div>
            </div>
          </div>
        `;
      }

      function renderDateDetail(dateObj) {
        const box = document.getElementById('dateDetailContent');
        const backBtn = document.getElementById('backTodayBtn');
        const today = new Date();
        const isToday =
          dateObj.getFullYear() === today.getFullYear() &&
          dateObj.getMonth() === today.getMonth() &&
          dateObj.getDate() === today.getDate();

        backBtn.style.display = isToday ? 'none' : 'inline-block';

        const y = dateObj.getFullYear();
        const m = dateObj.getMonth() + 1;
        const d = dateObj.getDate();

        const progressHtml = buildProgressHtml(y, m, d);

        if (typeof Solar === 'undefined') {
          box.innerHTML = `
            ${progressHtml}
            <div class="status-msg" style="padding: 10px 0;">
              ${lunarLoadFailed ? '农历库加载受限，暂无法推演节气' : '正在加载节气数据...'}
            </div>
          `;
          return;
        }

        const solar = Solar.fromYmd(y, m, d);
        const lunar = solar.getLunar();
        const jieQiToday = lunar.getJieQi();

        const prevJQ = lunar.getPrevJieQi(true);
        let nextJQ = lunar.getNextJieQi(true);
        if (nextJQ && diffDaysFromSolar(dateObj, nextJQ.getSolar()) <= 0) {
          nextJQ = solar.next(1).getLunar().getNextJieQi(true);
        }

        let prevHtml = '<div class="jieqi-name">--</div><div class="jieqi-meta">暂无数据</div>';
        if (prevJQ) {
          const ps = prevJQ.getSolar();
          const diff = Math.abs(diffDaysFromSolar(dateObj, ps));
          const diffText = diff === 0 ? '正是今日' : `已过 ${diff} 天`;
