<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岁时历 · 观天晴雨录</title>
  <style>
    :root {
      --paper-bg: #efe9dc;
      --card-bg: #faf7f0;
      --card-inner: #f1ebdd;
      --ink-main: #222629;
      --ink-sub: #596066;
      --ink-light: #868b8e;
      --royal-navy: #1b365d;
      --navy-soft: #e7edf4;
      --forest-green: #2e5a4c;
      --forest-soft: #e5efe9;
      --antique-gold: #a68342;
      --gold-dark: #7d6028;
      --gold-border: #cbb994;
      --dark-border: #7a6a50;
      --shadow: 0 10px 30px rgba(27, 54, 93, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Palatino Linotype", "Book Antiqua", Baskerville, Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
      background-color: var(--paper-bg);
      background-image:
        radial-gradient(rgba(27, 54, 93, 0.04) 1px, transparent 0),
        linear-gradient(to bottom, rgba(166, 131, 66, 0.05), transparent 260px);
      background-size: 28px 28px, 100% 100%;
      color: var(--ink-main);
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px 16px 44px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    .scroll-frame {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--royal-navy);
      padding: 7px;
      box-shadow: var(--shadow);
      border-radius: 2px;
    }

    .scroll-inner {
      position: relative;
      border: 1px solid var(--antique-gold);
      padding: 24px 28px;
      background: var(--card-bg);
    }

    .corner-ornament {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--royal-navy);
      border-style: solid;
      pointer-events: none;
    }
    .corner-tl { top: 4px; left: 4px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 4px; right: 4px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 4px; left: 4px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 3px double var(--gold-border);
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .crest-medallion {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--royal-navy);
      border: 2px solid var(--antique-gold);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 2px rgba(250, 247, 240, 0.25), 0 2px 8px rgba(27, 54, 93, 0.18);
      flex-shrink: 0;
    }

    .brand-title h1 {
      font-size: 25px;
      color: var(--royal-navy);
      letter-spacing: 3px;
      font-weight: 700;
    }

    .brand-title p {
      font-size: 13px;
      color: var(--gold-dark);
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .live-clock {
      font-size: 14px;
      color: var(--ink-sub);
      letter-spacing: 0.8px;
      padding: 6px 14px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
    }

    .live-clock strong {
      color: var(--royal-navy);
      font-size: 16px;
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
    }

    .city-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      background: var(--card-inner);
      padding: 12px 16px;
      border: 1px solid var(--gold-border);
      border-radius: 2px;
    }

    .city-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .city-tabs-label {
      font-size: 13px;
      color: var(--ink-sub);
      margin-right: 4px;
      letter-spacing: 0.5px;
    }

    .city-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      font-size: 14px;
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .city-tab:hover {
      border-color: var(--royal-navy);
      color: var(--royal-navy);
    }

    .city-tab.active {
      background: var(--royal-navy);
      color: #faf7f0;
      border-color: var(--royal-navy);
      box-shadow: inset 0 0 0 1px rgba(166, 131, 66, 0.5);
    }

    .city-tab .remove-city {
      font-size: 14px;
      opacity: 0.65;
      line-height: 1;
      padding: 0 2px;
    }

    .city-tab .remove-city:hover {
      opacity: 1;
    }

    .city-search-wrap {
      position: relative;
      display: flex;
      gap: 6px;
      width: 290px;
      max-width: 100%;
    }

    .city-search-wrap input {
      flex: 1;
      padding: 6px 10px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid var(--dark-border);
      background: var(--card-bg);
      color: var(--ink-main);
      border-radius: 2px;
      outline: none;
    }

    .city-search-wrap input:focus {
      border-color: var(--royal-navy);
    }

    .btn-classic {
      padding: 6px 15px;
      font-size: 14px;
      font-family: inherit;
      background: var(--royal-navy);
      color: #faf7f0;
      border: 1px solid var(--royal-navy);
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-classic:hover {
      background: var(--gold-dark);
      border-color: var(--gold-dark);
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--royal-navy);
      box-shadow: var(--shadow);
      z-index: 100;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      border-radius: 2px;
    }

    .search-dropdown.show {
      display: block;
    }

    .search-item {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--gold-border);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background: var(--navy-soft);
      color: var(--royal-navy);
    }

    .search-item small {
      color: var(--ink-light);
      font-size: 12px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--gold-border);
      background: var(--card-bg);
      padding: 18px 20px;
      border-radius: 2px;
      margin-bottom: 22px;
      box-shadow: 0 2px 10px rgba(27, 54, 93, 0.03);
    }

    .panel:last-child {
      margin-bottom: 0;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 17px;
      font-weight: bold;
      color: var(--royal-navy);
      padding-bottom: 10px;
      margin-bottom: 16px;
      border-bottom: 2px double var(--gold-border);
      letter-spacing: 2px;
    }

    .panel-title-deco::before {
      content: "✦ ";
      color: var(--antique-gold);
      font-size: 13px;
      margin-right: 4px;
    }

    .progress-panel-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 15px 16px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
      margin-bottom: 14px;
    }

    .progress-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 13px;
    }

    .progress-title {
      font-weight: bold;
      color: var(--royal-navy);
      letter-spacing: 0.8px;
    }

    .progress-meta {
      color: var(--ink-sub);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .progress-meta strong {
      color: var(--royal-navy);
      margin-left: 6px;
    }

    .progress-track {
      width: 100%;
      height: 11px;
      background: rgba(250, 247, 240, 0.85);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
      overflow: hidden;
      padding: 1px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 1px;
      transition: width 0.35s ease;
    }

    .progress-fill.month {
      background: linear-gradient(90deg, #2b4c7e, var(--royal-navy));
    }

    .progress-fill.year {
      background: linear-gradient(90deg, var(--gold-dark), var(--antique-gold));
    }

    .jieqi-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .jieqi-col {
      padding: 11px 14px;
      border-radius: 2px;
      font-size: 13px;
    }

    .jieqi-col.prev {
      background: var(--forest-soft);
      border: 1px solid rgba(46, 90, 76, 0.28);
    }

    .jieqi-col.next {
      background: var(--navy-soft);
      border: 1px solid rgba(27, 54, 93, 0.24);
    }

    .jieqi-label {
      font-size: 12px;
      color: var(--ink-sub);
      letter-spacing: 0.5px;
    }

    .jieqi-name {
      font-size: 17px;
      font-weight: bold;
      margin: 2px 0;
    }

    .jieqi-col.prev .jieqi-name { color: var(--forest-green); }
    .jieqi-col.next .jieqi-name { color: var(--royal-navy); }

    .jieqi-meta {
      font-size: 12px;
      color: var(--ink-sub);
    }

    .cal-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cal-btn {
      padding: 3px 10px;
      font-size: 13px;
      font-family: inherit;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      color: var(--ink-main);
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
    }

    .cal-btn:hover {
      border-color: var(--royal-navy);
      color: var(--royal-navy);
      background: var(--navy-soft);
    }

    .cal-weekdays, .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-weekdays div {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      color: var(--ink-sub);
      padding: 6px 0;
      border-bottom: 1px solid var(--gold-border);
      margin-bottom: 4px;
    }

    .cal-weekdays div.weekend {
      color: var(--gold-dark);
    }

    .cal-cell {
      min-height: 58px;
      padding: 6px 4px;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.15s;
    }

    .cal-cell:hover {
      background: var(--card-inner);
      border-color: var(--gold-border);
    }

    .cal-cell.other-month {
      opacity: 0.35;
    }

    .cal-cell.selected {
      border: 1.5px solid var(--antique-gold);
      background: var(--card-inner);
      box-shadow: inset 0 0 0 1px rgba(166, 131, 66, 0.25);
    }

    .cal-cell.today {
      background: var(--royal-navy);
      color: #faf7f0;
      border-color: var(--antique-gold);
      box-shadow: inset 0 0 0 1px rgba(250, 247, 240, 0.25);
    }

    .cal-cell.today .cal-lunar {
      color: rgba(250, 247, 240, 0.88);
    }

    .cal-solar {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.2;
      font-variant-numeric: lining-nums;
    }

    .cal-cell.is-weekend:not(.today) .cal-solar {
      color: var(--gold-dark);
    }

    .cal-lunar {
      font-size: 11px;
      color: var(--ink-sub);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .cal-cell:not(.today) .cal-lunar.is-highlight {
      color: var(--royal-navy);
      font-weight: bold;
    }

    .weather-now {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      margin-bottom: 14px;
      gap: 12px;
    }

    .weather-city-name {
      font-size: 20px;
      font-weight: bold;
      color: var(--royal-navy);
    }

    .weather-city-sub {
      font-size: 12px;
      color: var(--ink-sub);
    }

    .weather-temp-wrap {
      text-align: right;
    }

    .weather-temp-main {
      font-size: 40px;
      font-weight: bold;
      color: var(--royal-navy);
      line-height: 1.1;
      font-variant-numeric: lining-nums;
    }

    .weather-desc {
      font-size: 14px;
      color: var(--ink-main);
      margin-top: 2px;
    }

    .weather-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 4px;
    }

    .metric-item {
      background: var(--card-bg);
      border: 1px solid var(--gold-border);
      padding: 9px 6px;
      text-align: center;
      border-radius: 2px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--ink-light);
    }

    .metric-val {
      font-size: 14px;
      font-weight: bold;
      color: var(--ink-main);
      margin-top: 2px;
    }

    .weather-yesterday {
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--card-inner);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .yesterday-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .yesterday-tag {
      display: inline-block;
      padding: 1px 7px;
      font-size: 11px;
      background: var(--royal-navy);
      color: #faf7f0;
      border-radius: 2px;
      letter-spacing: 0.5px;
    }

    .yesterday-date {
      color: var(--ink-sub);
      font-size: 12px;
    }

    .yesterday-cond {
      color: var(--ink-main);
      font-weight: bold;
    }

    .yesterday-precip {
      font-size: 12px;
      color: var(--forest-green);
    }

    .yesterday-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-variant-numeric: tabular-nums;
    }

    .yesterday-temp {
      font-weight: bold;
      color: var(--royal-navy);
    }

    .yesterday-diff {
      font-size: 12px;
      color: var(--gold-dark);
    }

    .forecast-list {
      display: flex;
      flex-direction: column;
    }

    .forecast-row {
      display: grid;
      grid-template-columns: 92px 1fr 56px 96px;
      align-items: center;
      gap: 8px;
      padding: 10px 6px;
      border-bottom: 1px solid rgba(203, 185, 148, 0.55);
      font-size: 14px;
    }

    .forecast-row:last-child {
      border-bottom: none;
    }

    .forecast-date {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .forecast-date strong {
      font-size: 14px;
      color: var(--ink-main);
    }

    .forecast-date span {
      font-size: 11px;
      color: var(--ink-light);
    }

    .forecast-cond {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .forecast-rain {
      font-size: 12px;
      color: var(--forest-green);
      text-align: center;
    }

    .forecast-temp {
      text-align: right;
      font-weight: bold;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .temp-low {
      color: var(--ink-sub);
      font-weight: normal;
    }

    .temp-high {
      color: var(--royal-navy);
    }

    .status-msg {
      padding: 20px;
      text-align: center;
      color: var(--ink-sub);
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--gold-border);
      font-size: 12px;
      color: var(--ink-light);
      letter-spacing: 1px;
    }

    @media (max-width: 860px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      .header-right {
        align-items: flex-start;
      }
      .scroll-inner {
        padding: 18px 14px;
      }
    }

    @media (max-width: 520px) {
      .progress-header {
        flex-direction: column;
        gap: 2px;
      }
      .jieqi-box {
        grid-template-columns: 1fr;
      }
      .weather-metrics {
        grid-template-columns: repeat(2, 1fr);
      }
      .forecast-row {
        grid-template-columns: 78px 1fr 44px 82px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="scroll-frame">
      <div class="scroll-inner">
        <div class="corner-ornament corner-tl"></div>
        <div class="corner-ornament corner-tr"></div>
        <div class="corner-ornament corner-bl"></div>
        <div class="corner-ornament corner-br"></div>

        <header class="header">
          <div class="brand">
            <div class="crest-medallion" aria-hidden="true">
              <svg width="32" height="32" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="18" cy="18" r="14" stroke="#cbb994" stroke-width="1.2" stroke-dasharray="2 2"/>
                <circle cx="18" cy="18" r="7" stroke="#faf7f0" stroke-width="1.2"/>
                <path d="M18 2L20.4 15.6L34 18L20.4 20.4L18 34L15.6 20.4L2 18L15.6 15.6L18 2Z" fill="#cbb994" fill-opacity="0.9"/>
                <circle cx="18" cy="18" r="2.2" fill="#1b365d"/>
              </svg>
            </div>
            <div class="brand-title">
              <h1>岁时历 · 观天晴雨录</h1>
              <p>ALMANAC &amp; METEOROLOGY · 公历月令 · 农历节气 · 七日晴雨</p>
            </div>
          </div>
          <div class="header-right">
            <div class="live-clock" id="liveClock">加载时间中...</div>
          </div>
        </header>

        <section class="city-bar">
          <div class="city-tabs" id="cityTabs">
            <span class="city-tabs-label">观象城市：</span>
          </div>
          <div class="city-search-wrap">
            <input type="text" id="cityInput" placeholder="输入城市名添加（如：苏州、成都）" autocomplete="off" />
            <button class="btn-classic" id="searchBtn">寻城</button>
            <div class="search-dropdown" id="searchDropdown"></div>
          </div>
        </section>

        <main class="main-grid">
          <div>
            <section class="panel">
              <div class="panel-title">
                <span class="panel-title-deco">历法 · 岁时</span>
                <button class="cal-btn" id="backTodayBtn" style="display: none;">返回今日</button>
              </div>
              <div id="dateDetailContent">
                <div class="status-msg">正在推演历法...</div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span class="panel-title-deco" id="calMonthTitle">月历</span>
                <div class="cal-controls">
                  <button class="cal-btn" id="prevMonthBtn">上月</button>
                  <button class="cal-btn" id="currMonthBtn">本月</button>
                  <button class="cal-btn" id="nextMonthBtn">下月</button>
                </div>
              </div>
              <div class="cal-weekdays">
                <div class="weekend">日</div>
                <div>一</div>
                <div>二</div>
                <div>三</div>
                <div>四</div>
                <div>五</div>
                <div class="weekend">六</div>
              </div>
              <div class="cal-days" id="calDays"></div>
            </section>
          </div>

          <div>
            <section class="panel">
              <div class="panel-title">
                <span class="panel-title-deco">气象 · 今日实况</span>
                <button class="cal-btn" id="refreshWeatherBtn">刷新</button>
              </div>
              <div id="todayWeatherBox">
                <div class="status-msg">正在获取气象数据...</div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span class="panel-title-deco">未来七日晴雨</span>
                <span style="font-size: 12px; font-weight: normal; color: var(--ink-light); letter-spacing: 0;">明日至第七日</span>
              </div>
              <div id="forecastBox">
                <div class="status-msg">正在获取七日预报...</div>
              </div>
            </section>
          </div>
        </main>

        <footer class="footer">
          ✦ 中国农历与节气本地推演 · 气象数据源自 Open-Meteo 开源接口 · 点击月历任意日期可查当日农历与节气 ✦
        </footer>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const STORAGE_CITIES_KEY = 'suishi_saved_cities_v1';
      const STORAGE_ACTIVE_KEY = 'suishi_active_city_v1';

      const DEFAULT_CITIES = [
        { id: '1816670', name: '北京', admin1: '北京市', country: '中国', latitude: 39.9075, longitude: 116.39723 },
        { id: '1796236', name: '上海', admin1: '上海市', country: '中国', latitude: 31.22222, longitude: 121.45806 },
        { id: '1808926', name: '杭州', admin1: '浙江省', country: '中国', latitude: 30.29365, longitude: 120.16142 }
      ];

      const now = new Date();
      let viewYear = now.getFullYear();
      let viewMonth = now.getMonth() + 1;
      let selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let lunarLoadFailed = false;

      let savedCities = loadCities();
      let activeCityId = loadActiveCityId(savedCities);

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, function (m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
      }

      function loadCities() {
        try {
          const raw = localStorage.getItem(STORAGE_CITIES_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return DEFAULT_CITIES.slice();
      }

      function saveCities() {
        try {
          localStorage.setItem(STORAGE_CITIES_KEY, JSON.stringify(savedCities));
          localStorage.setItem(STORAGE_ACTIVE_KEY, String(activeCityId));
        } catch (e) {}
      }

      function loadActiveCityId(cities) {
        try {
          const id = localStorage.getItem(STORAGE_ACTIVE_KEY);
          if (id && cities.some(c => String(c.id) === String(id))) return id;
        } catch (e) {}
        return String(cities[0].id);
      }

      function diffDaysFromSolar(baseDate, targetSolar) {
        const targetDate = new Date(targetSolar.getYear(), targetSolar.getMonth() - 1, targetSolar.getDay());
        const curDate = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
        return Math.round((targetDate - curDate) / 86400000);
      }

      function updateClock() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        const dateStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;
        const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        document.getElementById('liveClock').innerHTML = `${dateStr} <strong>${timeStr}</strong>`;
      }
      updateClock();
      setInterval(updateClock, 1000);

      function buildProgressHtml(y, m, d) {
        const daysInMonth = new Date(y, m, 0).getDate();
        const monthPct = (d / daysInMonth) * 100;

        const isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
        const daysInYear = isLeap ? 366 : 365;
        const startOfYear = new Date(y, 0, 1);
        const dayOfYear = Math.floor((new Date(y, m - 1, d) - startOfYear) / 86400000) + 1;
        const yearPct = (dayOfYear / daysInYear) * 100;

        return `
          <div class="progress-panel-box">
            <div class="progress-item">
              <div class="progress-header">
                <span class="progress-title">月份进度（${m}月）</span>
                <span class="progress-meta">第 ${d} / ${daysInMonth} 天 <strong>${monthPct.toFixed(1)}%</strong></span>
              </div>
              <div class="progress-track" role="progressbar" aria-valuenow="${monthPct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-fill month" style="width: ${monthPct.toFixed(2)}%;"></div>
              </div>
            </div>
            <div class="progress-item">
              <div class="progress-header">
                <span class="progress-title">年份进度（${y}年）</span>
                <span class="progress-meta">第 ${dayOfYear} / ${daysInYear} 天 <strong>${yearPct.toFixed(1)}%</strong></span>
              </div>
              <div class="progress-track" role="progressbar" aria-valuenow="${yearPct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-fill year" style="width: ${yearPct.toFixed(2)}%;"></div>
              </div>
            </div>
          </div>
        `;
      }

      function renderDateDetail(dateObj) {
        const box = document.getElementById('dateDetailContent');
        const backBtn = document.getElementById('backTodayBtn');
        const today = new Date();
        const isToday =
          dateObj.getFullYear() === today.getFullYear() &&
          dateObj.getMonth() === today.getMonth() &&
          dateObj.getDate() === today.getDate();

        backBtn.style.display = isToday ? 'none' : 'inline-block';

        const y = dateObj.getFullYear();
        const m = dateObj.getMonth() + 1;
        const d = dateObj.getDate();

        const progressHtml = buildProgressHtml(y, m, d);

        if (typeof Solar === 'undefined') {
          box.innerHTML = `
            ${progressHtml}
            <div class="status-msg" style="padding: 10px 0;">
              ${lunarLoadFailed ? '农历库加载受限，暂无法推演节气' : '正在加载节气数据...'}
            </div>
          `;
          return;
        }

        const solar = Solar.fromYmd(y, m, d);
        const lunar = solar.getLunar();
        const jieQiToday = lunar.getJieQi();

        const prevJQ = lunar.getPrevJieQi(true);
        let nextJQ = lunar.getNextJieQi(true);
        if (nextJQ && diffDaysFromSolar(dateObj, nextJQ.getSolar()) <= 0) {
          nextJQ = solar.next(1).getLunar().getNextJieQi(true);
        }

        let prevHtml = '<div class="jieqi-name">--</div><div class="jieqi-meta">暂无数据</div>';
        if (prevJQ) {
          const ps = prevJQ.getSolar();
          const diff = Math.abs(diffDaysFromSolar(dateObj, ps));
          const diffText = diff === 0 ? '正是今日' : `已过 ${diff} 天`;
          prevHtml = `
            <div class="jieqi-name">${escapeHtml(prevJQ.getName())}</div>
            <div class="jieqi-meta">${ps.getMonth()}月${ps.getDay()}日 · ${diffText}</div>
          `;
        }

        let nextHtml = '<div class="jieqi-name">--</div><div class="jieqi-meta">暂无数据</div>';
        if (nextJQ) {
          const ns = nextJQ.getSolar();
          const diff = diffDaysFromSolar(dateObj, ns);
          nextHtml = `
            <div class="jieqi-name">${escapeHtml(nextJQ.getName())}</div>
            <div class="jieqi-meta">${ns.getMonth()}月${ns.getDay()}日 · 还有 ${diff} 天</div>
          `;
        }

        box.innerHTML = `
          ${progressHtml}
          <div class="jieqi-box">
            <div class="jieqi-col prev">
              <div class="jieqi-label">${jieQiToday ? '当前节气' : '上一节气'}</div>
              ${prevHtml}
            </div>
            <div class="jieqi-col next">
              <div class="jieqi-label">下一节气</div>
              ${nextHtml}
            </div>
          </div>
        `;
      }

      function renderCalendar(year, month) {
        document.getElementById('calMonthTitle').textContent = `${year}年 ${month}月`;
        const container = document.getElementById('calDays');
        container.innerHTML = '';

        const firstDayOfWeek = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

        const today = new Date();
        const totalCells = Math.ceil((firstDayOfWeek + daysInMonth) / 7) * 7;

        for (let i = 0; i < totalCells; i++) {
          let cellY = year;
          let cellM = month;
          let cellD;
          let isOther = false;

          if (i < firstDayOfWeek) {
            cellD = daysInPrevMonth - firstDayOfWeek + i + 1;
            cellM = month - 1;
            if (cellM < 1) { cellM = 12; cellY -= 1; }
            isOther = true;
          } else if (i >= firstDayOfWeek + daysInMonth) {
            cellD = i - (firstDayOfWeek + daysInMonth) + 1;
            cellM = month + 1;
            if (cellM > 12) { cellM = 1; cellY += 1; }
            isOther = true;
          } else {
            cellD = i - firstDayOfWeek + 1;
          }

          const cellDate = new Date(cellY, cellM - 1, cellD);
          const isToday =
            cellY === today.getFullYear() &&
            cellM === today.getMonth() + 1 &&
            cellD === today.getDate();
          const isSelected =
            cellY === selectedDate.getFullYear() &&
            cellM === selectedDate.getMonth() + 1 &&
            cellD === selectedDate.getDate();
          const isWeekend = cellDate.getDay() === 0 || cellDate.getDay() === 6;

          let lunarText = '';
          let isHighlight = false;

          if (typeof Solar !== 'undefined') {
            const solar = Solar.fromYmd(cellY, cellM, cellD);
            const lunar = solar.getLunar();
            const jq = lunar.getJieQi();
            const fests = [...lunar.getFestivals(), ...solar.getFestivals()];

            if (fests.length > 0) {
              lunarText = fests[0];
              isHighlight = true;
            } else if (jq) {
              lunarText = jq;
              isHighlight = true;
            } else if (lunar.getDay() === 1) {
              lunarText = `${lunar.getMonthInChinese()}月`;
              isHighlight = true;
            } else {
              lunarText = lunar.getDayInChinese();
            }
          }

          const cell = document.createElement('div');
          cell.className = 'cal-cell' +
            (isOther ? ' other-month' : '') +
            (isToday ? ' today' : '') +
            (isSelected && !isToday ? ' selected' : '') +
            (isWeekend ? ' is-weekend' : '');

          cell.innerHTML = `
            <span class="cal-solar">${cellD}</span>
            <span class="cal-lunar ${isHighlight ? 'is-highlight' : ''}">${escapeHtml(lunarText)}</span>
          `;

          cell.addEventListener('click', () => {
            selectedDate = new Date(cellY, cellM - 1, cellD);
            if (isOther) {
              viewYear = cellY;
              viewMonth = cellM;
            }
            renderDateDetail(selectedDate);
            renderCalendar(viewYear, viewMonth);
          });

          container.appendChild(cell);
        }
      }

      document.getElementById('prevMonthBtn').addEventListener('click', () => {
        viewMonth--;
        if (viewMonth < 1) { viewMonth = 12; viewYear--; }
        renderCalendar(viewYear, viewMonth);
      });

      document.getElementById('nextMonthBtn').addEventListener('click', () => {
        viewMonth++;
        if (viewMonth > 12) { viewMonth = 1; viewYear++; }
        renderCalendar(viewYear, viewMonth);
      });

      document.getElementById('currMonthBtn').addEventListener('click', () => {
        const t = new Date();
        viewYear = t.getFullYear();
        viewMonth = t.getMonth() + 1;
        renderCalendar(viewYear, viewMonth);
      });

      document.getElementById('backTodayBtn').addEventListener('click', () => {
        const t = new Date();
        viewYear = t.getFullYear();
        viewMonth = t.getMonth() + 1;
        selectedDate = new Date(t.getFullYear(), t.getMonth(), t.getDate());
        renderDateDetail(selectedDate);
        renderCalendar(viewYear, viewMonth);
      });

      function parseWeatherCode(code) {
        const map = {
          0: { text: '晴朗', icon: '☀️' },
          1: { text: '晴间少云', icon: '🌤️' },
          2: { text: '多云', icon: '⛅' },
          3: { text: '阴天', icon: '☁️' },
          45: { text: '轻雾', icon: '🌫️' },
          48: { text: '霜雾', icon: '🌫️' },
          51: { text: '毛毛微雨', icon: '🌦️' },
          53: { text: '细雨', icon: '🌦️' },
          55: { text: '密雨', icon: '🌧️' },
          56: { text: '微冻雨', icon: '🌨️' },
          57: { text: '冻雨', icon: '🌨️' },
          61: { text: '小雨', icon: '🌦️' },
          63: { text: '中雨', icon: '🌧️' },
          65: { text: '大雨', icon: '🌧️' },
          66: { text: '冻雨', icon: '🌨️' },
          67: { text: '强冻雨', icon: '🌨️' },
          71: { text: '小雪', icon: '🌨️' },
          73: { text: '中雪', icon: '❄️' },
          75: { text: '大雪', icon: '❄️' },
          77: { text: '霰雪', icon: '❄️' },
          80: { text: '阵雨', icon: '🌦️' },
          81: { text: '强阵雨', icon: '🌧️' },
          82: { text: '暴雨', icon: '⛈️' },
          85: { text: '阵雪', icon: '🌨️' },
          86: { text: '强阵雪', icon: '❄️' },
          95: { text: '雷阵雨', icon: '⛈️' },
          96: { text: '雷雨夹雹', icon: '⛈️' },
          99: { text: '强雷暴冰雹', icon: '⛈️' }
        };
        return map[code] || { text: '气象未知', icon: '🌡️' };
      }

      function renderCityTabs() {
        const container = document.getElementById('cityTabs');
        container.innerHTML = '<span class="city-tabs-label">观象城市：</span>';

        savedCities.forEach(city => {
          const isActive = String(city.id) === String(activeCityId);
          const btn = document.createElement('button');
          btn.className = 'city-tab' + (isActive ? ' active' : '');
          btn.innerHTML = `<span>${escapeHtml(city.name)}</span>`;

          if (savedCities.length > 1) {
            const del = document.createElement('span');
            del.className = 'remove-city';
            del.title = '移除此城市';
            del.textContent = '×';
            del.addEventListener('click', e => {
              e.stopPropagation();
              savedCities = savedCities.filter(c => String(c.id) !== String(city.id));
              if (String(activeCityId) === String(city.id)) {
                activeCityId = String(savedCities[0].id);
                fetchWeatherForActiveCity();
              }
              saveCities();
              renderCityTabs();
            });
            btn.appendChild(del);
          }

          btn.addEventListener('click', () => {
            activeCityId = String(city.id);
            saveCities();
            renderCityTabs();
            fetchWeatherForActiveCity();
          });

          container.appendChild(btn);
        });
      }

      async function fetchWeatherForActiveCity() {
        const city = savedCities.find(c => String(c.id) === String(activeCityId)) || savedCities[0];
        if (!city) return;

        const todayBox = document.getElementById('todayWeatherBox');
        const forecastBox = document.getElementById('forecastBox');
        todayBox.innerHTML = `<div class="status-msg">正在获取气象数据（${escapeHtml(city.name)}）...</div>`;
        forecastBox.innerHTML = `<div class="status-msg">正在获取七日预报...</div>`;

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(city.latitude)}&longitude=${encodeURIComponent(city.longitude)}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset&timezone=auto&past_days=1&forecast_days=8`;

        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('网络请求异常');
          const data = await res.json();

          const curr = data.current;
          const daily = data.daily;
          const wInfo = parseWeatherCode(curr.weather_code);

          const todayStr = curr.time ? curr.time.slice(0, 10) : '';
          let todayIdx = todayStr ? daily.time.indexOf(todayStr) : -1;
          if (todayIdx === -1) {
            todayIdx = daily.time.length >= 9 ? 1 : 0;
          }
          const yesterdayIdx = todayIdx - 1;

          const sunriseTime = daily.sunrise && daily.sunrise[todayIdx] ? daily.sunrise[todayIdx].slice(11, 16) : '--:--';
          const sunsetTime = daily.sunset && daily.sunset[todayIdx] ? daily.sunset[todayIdx].slice(11, 16) : '--:--';
          const regionSub = [city.admin1, city.country].filter(Boolean).join(' · ');
          const todayMin = Math.round(daily.temperature_2m_min[todayIdx]);
          const todayMax = Math.round(daily.temperature_2m_max[todayIdx]);

          let yesterdayHtml = '';
          if (yesterdayIdx >= 0) {
            const yParts = daily.time[yesterdayIdx].split('-');
            const yMdLabel = `${Number(yParts[1])}月${Number(yParts[2])}日`;
            const yInfo = parseWeatherCode(daily.weather_code[yesterdayIdx]);
            const yMin = Math.round(daily.temperature_2m_min[yesterdayIdx]);
            const yMax = Math.round(daily.temperature_2m_max[yesterdayIdx]);
            const yPrecip = daily.precipitation_sum ? daily.precipitation_sum[yesterdayIdx] : null;
            const precipText = yPrecip !== null && yPrecip > 0 ? `💧 降水 ${yPrecip.toFixed(1)} mm` : '';

            const maxDiff = todayMax - yMax;
            let diffText = '今日最高温与昨日持平';
            if (maxDiff > 0) diffText = `今日最高温较昨日 +${maxDiff}°`;
            else if (maxDiff < 0) diffText = `今日最高温较昨日 ${maxDiff}°`;

            yesterdayHtml = `
              <div class="weather-yesterday">
                <div class="yesterday-left">
                  <span class="yesterday-tag">昨日天气</span>
                  <span class="yesterday-date">${yMdLabel}</span>
                  <span class="yesterday-cond">${yInfo.icon} ${yInfo.text}</span>
                  ${precipText ? `<span class="yesterday-precip">${precipText}</span>` : ''}
                </div>
                <div class="yesterday-right">
                  <span class="yesterday-temp">${yMin}° ~ ${yMax}°</span>
                  <span class="yesterday-diff">${diffText}</span>
                </div>
              </div>
            `;
          }

          todayBox.innerHTML = `
            <div class="weather-now">
              <div>
                <div class="weather-city-name">${escapeHtml(city.name)}</div>
                <div class="weather-city-sub">${escapeHtml(regionSub)}</div>
                <div style="margin-top: 8px; font-size: 13px; color: var(--ink-sub);">
                  今日气温 ${todayMin}° ~ ${todayMax}°
                </div>
              </div>
              <div class="weather-temp-wrap">
                <div class="weather-temp-main">${Math.round(curr.temperature_2m)}°C</div>
                <div class="weather-desc">${wInfo.icon} ${wInfo.text}</div>
              </div>
            </div>
            <div class="weather-metrics">
              <div class="metric-item">
                <div class="metric-label">体感温度</div>
                <div class="metric-val">${Math.round(curr.apparent_temperature)}°C</div>
              </div>
              <div class="metric-item">
                <div class="metric-label">相对湿度</div>
                <div class="metric-val">${curr.relative_humidity_2m}%</div>
              </div>
              <div class="metric-item">
                <div class="metric-label">当前风速</div>
                <div class="metric-val">${curr.wind_speed_10m} km/h</div>
              </div>
              <div class="metric-item">
                <div class="metric-label">日出 / 日落</div>
                <div class="metric-val" style="font-size: 12px;">${sunriseTime} / ${sunsetTime}</div>
              </div>
            </div>
            ${yesterdayHtml}
          `;

          let rowsHtml = '<div class="forecast-list">';
          for (let offset = 1; offset <= 7; offset++) {
            const i = todayIdx + offset;
            if (i >= daily.time.length) break;

            const dateStr = daily.time[i];
            const parts = dateStr.split('-');
            const dObj = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            const wdLabel = offset === 1 ? '明日' : offset === 2 ? '后日' : WEEKDAYS[dObj.getDay()];
            const mdLabel = `${Number(parts[1])}月${Number(parts[2])}日`;
            const fInfo = parseWeatherCode(daily.weather_code[i]);
            const rainProb = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
            const tMin = Math.round(daily.temperature_2m_min[i]);
            const tMax = Math.round(daily.temperature_2m_max[i]);

            rowsHtml += `
              <div class="forecast-row">
                <div class="forecast-date">
                  <strong>${wdLabel}</strong>
                  <span>${mdLabel}</span>
                </div>
                <div class="forecast-cond">
                  <span>${fInfo.icon}</span>
                  <span>${fInfo.text}</span>
                </div>
                <div class="forecast-rain">
                  ${rainProb !== null && rainProb > 0 ? `💧${rainProb}%` : ''}
                </div>
                <div class="forecast-temp">
                  <span class="temp-low">${tMin}°</span> ~ <span class="temp-high">${tMax}°</span>
                </div>
              </div>
            `;
          }
          rowsHtml += '</div>';
          forecastBox.innerHTML = rowsHtml;

        } catch (err) {
          todayBox.innerHTML = `<div class="status-msg">气象接口暂时无法连接，请稍后点击刷新。</div>`;
          forecastBox.innerHTML = `<div class="status-msg">暂无未来七日数据</div>`;
        }
      }

      document.getElementById('refreshWeatherBtn').addEventListener('click', fetchWeatherForActiveCity);

      const cityInput = document.getElementById('cityInput');
      const dropdown = document.getElementById('searchDropdown');

      async function searchCity() {
        const rawQuery = cityInput.value.trim();
        if (!rawQuery) return;

        dropdown.innerHTML = '<div class="search-item">寻城中，请稍候...</div>';
        dropdown.classList.add('show');

        async function queryApi(q) {
          const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=zh&format=json`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('搜索失败');
          const json = await res.json();
          return json.results || [];
        }

        try {
          let results = await queryApi(rawQuery);
          if (results.length === 0 && /[市省县区]$/.test(rawQuery) && rawQuery.length > 2) {
            results = await queryApi(rawQuery.slice(0, -1));
          }

          if (results.length === 0) {
            dropdown.innerHTML = '<div class="search-item">未寻得此城，请尝试输入完整城市名（如“苏州”或拼音）</div>';
            return;
          }

          dropdown.innerHTML = '';
          results.forEach(item => {
            const div = document.createElement('div');
            div.className = 'search-item';
            const sub = [item.admin1, item.country].filter(Boolean).join(' · ');
            div.innerHTML = `<span><strong>${escapeHtml(item.name)}</strong></span><small>${escapeHtml(sub)}</small>`;
            div.addEventListener('click', () => {
              const newCity = {
                id: String(item.id),
                name: item.name,
                admin1: item.admin1 || '',
                country: item.country || '',
                latitude: item.latitude,
                longitude: item.longitude
              };
              if (!savedCities.some(c => String(c.id) === newCity.id)) {
                savedCities.push(newCity);
              }
              activeCityId = newCity.id;
              saveCities();
              renderCityTabs();
              fetchWeatherForActiveCity();
              dropdown.classList.remove('show');
              cityInput.value = '';
            });
            dropdown.appendChild(div);
          });
        } catch (e) {
          dropdown.innerHTML = '<div class="search-item">寻城受阻，请检查网络后重试</div>';
        }
      }

      document.getElementById('searchBtn').addEventListener('click', searchCity);
      cityInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') searchCity();
      });

      document.addEventListener('click', e => {
        if (!e.target.closest('.city-search-wrap')) {
          dropdown.classList.remove('show');
        }
      });

      function loadLunarAsync() {
        if (typeof Solar !== 'undefined') return;
        const urls = [
          'https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.8/lunar.min.js',
          'https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.8/lunar.min.js'
        ];
        let idx = 0;
        function tryLoad() {
          if (idx >= urls.length) {
            lunarLoadFailed = true;
            renderDateDetail(selectedDate);
            return;
          }
          const s = document.createElement('script');
          s.src = urls[idx++];
          s.async = true;
          s.onload = function () {
            renderDateDetail(selectedDate);
            renderCalendar(viewYear, viewMonth);
          };
          s.onerror = tryLoad;
          document.body.appendChild(s);
        }
        tryLoad();
      }

      renderDateDetail(selectedDate);
      renderCalendar(viewYear, viewMonth);
      renderCityTabs();
      fetchWeatherForActiveCity();
      loadLunarAsync();
    })();
  </script>
</body>
</html>
